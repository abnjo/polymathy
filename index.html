<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>POLYMATHY // Knowledge Graph & Learning Assistant</title>
<meta name="description" content="Local-first Compound DAG visual knowledge workspace and reductionist STEM learning assistant.">
<meta name="theme-color" content="#0969da">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Polymathy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="resources/vinci.svg">
<link rel="icon" type="image/png" sizes="192x192" href="resources/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="resources/icon-32.png">
<link rel="apple-touch-icon" href="resources/apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="curriculum.js"></script>
<script src="playlists/presets.js"></script>
<style>
:root {
  /* Surfaces & Ink (STEM Monograph Aesthetic, No Blur, Crisp 1px Borders) */
  --bg: #f8f9fa;
  --bg-alt: #f1f3f5;
  --surface: #ffffff;
  --surface-hover: #f4f6f8;
  --border: #d0d7de;
  --border-strong: #8c959f;
  --border-dark: #1f2328;

  /* Typography */
  --text: #1f2328;
  --text-muted: #59636e;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Semantic Status Colors (Human-readable, No Cryptic Letter Flags) */
  --accent: #0969da;
  --accent-soft: #ddf4ff;
  --head-color: #8250df;
  --head-soft: #fbefff;

  --status-done-bg: #dafbe1;
  --status-done-text: #116329;
  --status-done-border: #4ac26b;

  --status-active-bg: #fff8c5;
  --status-active-text: #7d4e00;
  --status-active-border: #d4a72c;

  --status-needed-bg: #ffebe9;
  --status-needed-text: #a40e26;
  --status-needed-border: #ff8182;

  --status-ready-bg: #ddf4ff;
  --status-ready-text: #0969da;
  --status-ready-border: #54aeff;

  --status-draft-bg: #eaeef2;
  --status-draft-text: #57606a;
  --status-draft-border: #8c959f;

  --shadow-sm: 0 1px 2px rgba(31, 35, 40, 0.06);
  --shadow-md: 0 4px 10px rgba(31, 35, 40, 0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.48;
  display: flex;
  flex-direction: column;
}

/* Form & Button Primitives */
button, input, select, textarea {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  padding: 4px 8px;
  outline: none;
}
button {
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: background 0.1s ease, border-color 0.1s ease, transform 0.06s ease;
}
button:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--border-dark); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}
button.primary:hover:not(:disabled) { background: #32383f; }
button.accent-btn {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}
button.accent-btn:hover:not(:disabled) { background: #cbe8ff; }
button.head-btn {
  background: var(--head-soft);
  color: var(--head-color);
  border-color: var(--head-color);
}
button.head-btn:hover:not(:disabled) { background: #f3dcff; }
button.success-btn {
  background: var(--status-done-bg);
  color: var(--status-done-text);
  border-color: var(--status-done-border);
}
button.danger-btn {
  background: var(--status-needed-bg);
  color: var(--status-needed-text);
  border-color: var(--status-needed-border);
}
button.btn-xs { padding: 2px 7px; font-size: 11px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { font-family: var(--font-sans); resize: vertical; }

/* Top Telemetry & Locator Bar */
.topbar {
  height: 46px;
  min-height: 46px;
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1.5px solid var(--border-dark);
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  z-index: 30;
  overflow-x: auto;
}
.topbar-left, .topbar-center, .topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.brand {
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}
.telemetry-pill {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 3px 8px;
  color: var(--text-muted);
}
.locator-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 7px;
  border-radius: 3px;
  border: 1px solid;
  font-family: var(--font-mono);
  font-size: 11px;
  max-width: 260px;
}
.locator-chip.main {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  max-width: 480px;
}
.locator-chip.main .locator-title {
  max-width: 140px;
}
.locator-chip.head {
  background: var(--head-soft);
  border-color: var(--head-color);
  color: var(--head-color);
}
.locator-chip.playlist {
  background: var(--bg-alt);
  border-color: var(--accent);
  color: var(--accent);
  max-width: 440px;
}
.locator-chip.playlist .locator-title {
  max-width: 140px;
}
.btn-xs.active-spotlight {
  background: var(--accent) !important;
  color: #ffffff !important;
  border-color: var(--accent) !important;
  font-weight: 800;
}
.btn-xs.active-pill {
  background: var(--bg-alt) !important;
  color: var(--accent) !important;
  border-color: var(--accent) !important;
  font-weight: 700;
}
.playlist-step-banner {
  border-left: 3px solid var(--accent);
  background: var(--bg);
  margin-bottom: 8px;
}
.playlist-step-badge {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 800;
  padding: 1px 4px;
  border-radius: 2px;
}
.playlist-route-spline {
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.map-dimmed {
  opacity: 0.12 !important;
  transition: opacity 0.2s ease;
}
.map-faint-edge {
  opacity: 0.08 !important;
  transition: opacity 0.2s ease;
}
.map-spine-node {
  opacity: 0.72 !important;
  transition: opacity 0.2s ease;
}
.tab-bar {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
  gap: 4px;
}
.tab-btn {
  background: transparent;
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 3px 3px 0 0;
  padding: 6px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  cursor: pointer;
}
.tab-btn:hover {
  color: var(--text);
  background: var(--bg-alt);
}
.tab-btn.active {
  color: var(--accent);
  background: var(--bg);
  border-color: var(--border) var(--border) transparent var(--border);
  margin-bottom: -1px;
  border-bottom: 1px solid var(--bg);
}
.tab-pane {
  display: none;
}
.tab-pane.active {
  display: block;
}
.progress-bar-wrap {
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 2px;
  height: 7px;
  width: 100%;
  overflow: hidden;
  margin-top: 4px;
}
.progress-bar-fill {
  background: var(--accent);
  height: 100%;
  transition: width 0.3s ease;
}
.progress-bar-fill.done {
  background: #2da44e;
}
.playlist-card-box {
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 10px;
  margin-bottom: 8px;
  background: var(--bg);
}
.playlist-card-box.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.locator-label {
  font-weight: 800;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.locator-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  font-weight: 600;
}

/* Main Workspace Split */
.workspace {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  position: relative;
  overflow: hidden;
}
.canvas-pane {
  flex: 1 1 66%;
  min-width: 320px;
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 22px 22px;
  user-select: none;
  touch-action: none;
}
.splitter {
  width: 5px;
  flex-shrink: 0;
  background: var(--bg-alt);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  cursor: col-resize;
  transition: background 0.12s;
  z-index: 20;
}
.splitter:hover, .splitter.dragging { background: var(--accent); }

.side-pane {
  width: 34%;
  min-width: 340px;
  max-width: 680px;
  flex-shrink: 0;
  background: var(--bg);
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* SVG Map Canvas & Overlays */
#dagSvg {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
}
#dagSvg.panning { cursor: grabbing; }

.detour-banner {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 15;
  display: none;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1.5px solid var(--head-color);
  border-radius: 4px;
  padding: 5px 11px;
  box-shadow: var(--shadow-md);
  font-family: var(--font-mono);
  font-size: 11.5px;
}
.detour-banner.visible { display: flex; }

.canvas-hud-bottom {
  position: absolute;
  bottom: 12px;
  left: 12px;
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.hud-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
}
.hud-hint-pill {
  font-family: var(--font-sans);
  font-size: 11px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 8px;
}

.minimap-wrap {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 184px;
  background: rgba(255, 255, 255, 0.95);
  border: 1.5px solid var(--border-dark);
  border-radius: 4px;
  box-shadow: var(--shadow-md);
  z-index: 15;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: height 0.15s ease;
}
.minimap-wrap.minimized {
  width: 110px;
}
.minimap-wrap.minimized #minimapSvg {
  display: none;
}
.minimap-header {
  height: 22px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  padding: 0 6px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#minimapSvg {
  width: 100%;
  height: 120px;
  display: block;
  cursor: crosshair;
}

/* Primitives & Boxes */
.box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.box.inset {
  background: var(--bg-alt);
  padding: 9px 11px;
  margin-bottom: 8px;
  box-shadow: none;
}
.box-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 8px;
  gap: 8px;
}
.box-title {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  text-transform: uppercase;
}
.section-hint {
  font-size: 11.5px;
  color: var(--text-muted);
  margin-bottom: 9px;
  line-height: 1.4;
}

/* Clear Semantic Tags (No Emojis) */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--bg-alt);
  color: var(--text-muted);
  line-height: 1.2;
  white-space: nowrap;
}
.tag.done {
  background: var(--status-done-bg);
  color: var(--status-done-text);
  border-color: var(--status-done-border);
}
.tag.active {
  background: var(--status-active-bg);
  color: var(--status-active-text);
  border-color: var(--status-active-border);
}
.tag.needed {
  background: var(--status-needed-bg);
  color: var(--status-needed-text);
  border-color: var(--status-needed-border);
}
.tag.ready {
  background: var(--status-ready-bg);
  color: var(--status-ready-text);
  border-color: var(--status-ready-border);
}
.tag.draft {
  background: var(--status-draft-bg);
  color: var(--status-draft-text);
  border-color: var(--status-draft-border);
  border-style: dashed;
}
.tag.edited {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}
.tag.head-tag {
  background: var(--head-soft);
  color: var(--head-color);
  border-color: var(--head-color);
}

/* Detour Drawer */
details.audit-drawer {
  border: 1.5px solid var(--border-dark);
  border-radius: 4px;
  background: var(--bg-alt);
  padding: 8px 11px;
  margin-bottom: 12px;
}
details.audit-drawer.detour-drawer {
  border-color: var(--head-color);
  background: var(--head-soft);
}
details.audit-drawer summary {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.04em;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  list-style: none;
}
details.audit-drawer summary::-webkit-details-marker { display: none; }
details.audit-drawer[open] summary {
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 8px;
}

.detour-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.5;
}
.detour-link {
  color: var(--head-color);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
  font-weight: 600;
}
.detour-link:hover { background: rgba(130, 80, 223, 0.14); }
.detour-current {
  font-weight: 800;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--head-color);
  border-radius: 3px;
  padding: 1px 5px;
}

/* Side Panel Layout */
.topic-breadcrumb {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
  word-break: break-word;
}
.topic-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.topic-title {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 800;
  line-height: 1.25;
  color: var(--text);
}
.topic-meta-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.progress-track {
  width: 100%;
  height: 8px;
  background: var(--bg-alt);
  border: 1px solid var(--border-strong);
  border-radius: 2px;
  overflow: hidden;
  margin: 8px 0 4px 0;
}
.progress-fill {
  height: 100%;
  background: var(--status-active-border);
  transition: width 0.2s ease;
}
.progress-fill.done { background: var(--status-done-border); }

.item-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.list-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 8px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 3px;
}
.list-row-left {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  min-width: 0;
  flex: 1 1 auto;
}
.list-row-left input[type="checkbox"] {
  margin-top: 2px;
  flex-shrink: 0;
  width: 14px;
  height: 14px;
  accent-color: var(--accent);
  cursor: pointer;
}
.list-row-main {
  min-width: 0;
  flex: 1 1 auto;
}
.list-row-title {
  font-weight: 600;
  font-size: 12.5px;
  color: var(--text);
  word-break: break-word;
}
.list-row-title.checked {
  text-decoration: line-through;
  color: var(--text-muted);
}
.list-row-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 1px;
  word-break: break-all;
}
.list-row-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.intro-prose {
  font-size: 13px;
  line-height: 1.55;
  color: var(--text);
  margin-bottom: 10px;
  padding: 8px 10px;
  background: var(--bg-alt);
  border-left: 3px solid var(--border-strong);
  border-radius: 2px;
}
.inline-add-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.inline-add-row input {
  flex: 1 1 140px;
  min-width: 0;
}
.diag-warn {
  margin-top: 8px;
  padding: 7px 9px;
  background: var(--status-needed-bg);
  border: 1px solid var(--status-needed-border);
  color: var(--status-needed-text);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.diag-info {
  margin-top: 8px;
  padding: 7px 9px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
}

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(31, 35, 40, 0.48);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1.5px solid var(--border-dark);
  border-radius: 5px;
  width: 100%;
  max-width: 780px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-md);
}
.modal-head {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.04em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-body {
  padding: 14px;
  overflow-y: auto;
  flex: 1 1 auto;
}

/* Manual Tabs */
.manual-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1.5px solid var(--border-dark);
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.manual-tab-btn {
  border-bottom: none;
  border-radius: 3px 3px 0 0;
  background: var(--bg-alt);
  color: var(--text-muted);
  padding: 5px 10px;
  font-size: 11px;
}
.manual-tab-btn.active {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}
.manual-tab-panel { display: none; }
.manual-tab-panel.active { display: block; }

table.spec-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin: 8px 0;
}
table.spec-table th, table.spec-table td {
  border: 1px solid var(--border);
  padding: 6px 8px;
  text-align: left;
  vertical-align: top;
}
table.spec-table th {
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-size: 11px;
}
pre.code-block {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 9px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
code.inline {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1px 4px;
}

/* SVG Interactive Elements */
.svg-node { cursor: pointer; }
.svg-node:hover .node-card { stroke: var(--text); stroke-width: 1.8px; }
.svg-expand-badge { cursor: pointer; }
.svg-expand-badge:hover rect { fill: var(--text); }
.svg-expand-badge:hover text { fill: var(--surface); }
.prereq-arrow-hit { cursor: pointer; }
.prereq-arrow-hit:hover path.visible-arrow { stroke-width: 3.2px; filter: drop-shadow(0 0 3px rgba(0,0,0,0.25)); }
.prereq-dir-badge { cursor: pointer; transition: transform 0.12s ease; }
.prereq-dir-badge:hover rect { stroke-width: 2px; }
.prereq-dir-badge:hover text { text-decoration: underline; }
.dimmed { opacity: 0.18; transition: opacity 0.15s; }

@keyframes mainPulse {
  0%, 100% { stroke-opacity: 0.95; r: 10; }
  50% { stroke-opacity: 0.25; r: 14; }
}
.main-beacon-pulse { animation: mainPulse 2s ease-in-out infinite; }

.toast {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 200;
  background: var(--text);
  color: var(--surface);
  font-family: var(--font-mono);
  font-size: 11.5px;
  padding: 7px 12px;
  border-radius: 4px;
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transform: translateY(6px);
  transition: opacity 0.18s, transform 0.18s;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 900px) {
  .workspace { flex-direction: column; }
  .canvas-pane { flex: 1 1 50%; min-width: 0; }
  .splitter { width: 100%; height: 5px; cursor: row-resize; border: none; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .side-pane { width: 100% !important; max-width: none; min-width: 0; flex: 1 1 50%; }
  .minimap-wrap { width: 130px; }
  #minimapSvg { height: 90px; }
}
</style>
</head>

    <button class="btn-xs" id="btnFrontierRadar" title="Discover what to study next and which topics unlock the most branches">Frontier Radar</button>

    <button class="btn-xs" id="btnManual" title="Open field manual, visual legend, and shortcuts">? Guide</button>

</header>

<!-- MAIN WORKSPACE -->
<main class="workspace" id="workspace">
  <!-- LEFT: COMPOUND DAG CANVAS -->
  <section class="canvas-pane" id="canvasPane">
    <!-- FLOATING DETOUR RETURN BANNER -->
    <div class="detour-banner" id="floatingDetourBanner">

    <!-- CANVAS BOTTOM HUD CONTROLS -->

      <div class="hud-hint-pill">

    <!-- MAIN SVG SCENE -->
    <svg id="dagSvg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow-needed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#a40e26"></path>

        <marker id="arrow-done" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#116329"></path>
        </marker>
        <marker id="arrow-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#8c959f"></path>

      </defs>
      <g id="svgWorld">
        <g id="layerConduits"></g>
        <g id="layerRoute"></g>

    </svg>
  </section>

  <!-- RESIZABLE SPLITTER -->
  <div class="splitter" id="splitter" title="Drag to resize side panel"></div>

  <!-- RIGHT: EXECUTION & EDITING SIDE PANEL -->

</main>

<!-- MODAL BACKDROP -->
<div class="modal-backdrop" id="modalBackdrop">

<div class="toast" id="toast"></div>
<input type="file" id="inputLoadGraphFile" accept=".json,application/json" style="display:none">

<script>
(() => {
  'use strict';

  /* =========================================================================
   * 1. EXTERNAL GRAPH LOADER (curriculum.json & curriculum.js)
   * ========================================================================= */
  const DEFAULT_FALLBACK_CURRICULUM = {
    patch_id: "001_reductionist_universal_taxonomy",
    title: "Knowledge",
    navigation: {
      MAIN: "knowledge",
      HEAD: "knowledge",
      detourStack: []
    },
    initial_state: {
      nodes: {}
    },
    nodes: [
      {
        id: "knowledge",
        title: "Knowledge",
        parentId: null,
        prereqIds: [],
        intro: "Root origin of the knowledge graph. Expand into Physics, Chemistry, Mathematics, and Computer Science to track exact formulas, textbook sources, and prerequisite dependency chains.",
        sources: []
      }
    ]
  };

  let activeCurriculumData = window.POLYMATHY_CURRICULUM || window.POLYMATHY_SEED_CURRICULUM || DEFAULT_FALLBACK_CURRICULUM;
  let activeCurriculumSource = (window.POLYMATHY_CURRICULUM || window.POLYMATHY_SEED_CURRICULUM) ? "curriculum.js" : "fallback";

  function extractBasePatch(data) {
    if (!data) data = DEFAULT_FALLBACK_CURRICULUM;
    return {
      patch_id: data.patch_id || "001_reductionist_universal_taxonomy",
      title: data.title || "Universal Reductionist Polymathy Taxonomy",
      nodes: Array.isArray(data.nodes) ? data.nodes : []
    };
  }

  function extractInitialState(data) {
    if (!data) data = DEFAULT_FALLBACK_CURRICULUM;
    const nav = data.navigation || { MAIN: "knowledge", HEAD: "knowledge", detourStack: [] };
    const nodes = (data.initial_state && data.initial_state.nodes) || {};
    return { navigation: nav, nodes };
  }

  async function fetchCurriculumJSON() {
    // 1. If served over HTTP/HTTPS, attempt to fetch curriculum.json first
    if (window.location.protocol.startsWith("http")) {
      try {
        const resp = await fetch("./curriculum.json?_t=" + Date.now(), { cache: "no-cache" });
        if (resp.ok) {
          const json = await resp.json();
          if (json && Array.isArray(json.nodes) && json.nodes.length > 0) {
            return { data: json, source: "curriculum.json" };
          }
        }
      } catch (err) {
        console.warn("Could not fetch curriculum.json over HTTP:", err);
      }
    }

    // 2. Fall back to window.POLYMATHY_CURRICULUM (loaded synchronously via <script src="curriculum.js">)
    if (window.POLYMATHY_CURRICULUM && Array.isArray(window.POLYMATHY_CURRICULUM.nodes) && window.POLYMATHY_CURRICULUM.nodes.length > 0) {
      return { data: window.POLYMATHY_CURRICULUM, source: "curriculum.js" };
    }

    // 3. Fallback: direct fetch attempt
    try {
      const resp = await fetch("./curriculum.json");
      if (resp.ok) {
        const json = await resp.json();
        if (json && Array.isArray(json.nodes) && json.nodes.length > 0) {
          return { data: json, source: "curriculum.json (direct)" };
        }
      }
    } catch { /* ignore */ }

    return { data: DEFAULT_FALLBACK_CURRICULUM, source: "fallback" };
  }

  function loadGraphFromJSONString(jsonStr, fileName) {
    try {
      const parsed = JSON.parse(jsonStr);
      if (!parsed || (!Array.isArray(parsed.nodes) && !parsed.topics)) {
        alert("Invalid graph file: Expected a JSON object with a 'nodes' array.");
        return false;
      }
      activeCurriculumData = parsed;
      activeCurriculumSource = fileName || "loaded file";
      const curBase = extractBasePatch(activeCurriculumData);
      const curInit = extractInitialState(activeCurriculumData);

      layer0Patches = [structuredClone(curBase)];
      layer1Overrides = EMPTY_OVERRIDES();
      layer2State = structuredClone(curInit);
      persistAll();
      liveGraph = buildLiveGraph();
      computeLayout(liveGraph);
      renderAll();
      fitVisibleGraph();
      showToast("Loaded graph from " + activeCurriculumSource + " (" + curBase.nodes.length + " topics)");
      return true;
    } catch (err) {
      alert("Error parsing graph JSON: " + err.message);
      return false;
    }
  }

  function resetToFileDefaults() {
    const curBase = extractBasePatch(activeCurriculumData);
    const curInit = extractInitialState(activeCurriculumData);
    layer0Patches = [structuredClone(curBase)];
    layer1Overrides = EMPTY_OVERRIDES();
    layer2State = structuredClone(curInit);
    uiSettings.spotlightMain = false;
    persistAll();
    liveGraph = buildLiveGraph();
    computeLayout(liveGraph);
    renderAll();
    fitVisibleGraph();
    showToast("Reset to " + activeCurriculumSource + " defaults.");
  }

  const EMPTY_OVERRIDES = () => ({
    custom_nodes: [],
    field_overrides: {},
    edge_deltas: {},
    reparents: {},
    tombstones: []
  });

  /* =========================================================================
   * 2. STORAGE & 3-LAYER OVERLAYFS ENGINE
   * ========================================================================= */
  const STORAGE_KEYS = {
    patches: "polymathy_v3_patches",
    overrides: "polymathy_v3_overrides",
    state: "polymathy_v3_state",
    ui: "polymathy_v3_ui",
    playlists: "polymathy_playlists_v1"
  };

  const DEFAULT_FALLBACK_PRESETS = [
    {
      playlist_id: "preset_theoretical_physics_gr",
      title: "Path to General Relativity & QFT",
      category: "Degree Track",
      description: "Minimum rigorous mathematical and physical trajectory from multivariable calculus to curved spacetime and quantum fields.",
      steps: [
        { nodeId: "math.algebra.linear", targetLevel: "baseline", note: "Inner products, bilinear forms, and spectral decomposition." },
        { nodeId: "math.analysis.multivariable_calculus", targetLevel: "baseline", note: "Master Jacobians, differential forms, and Stokes theorem." },
        { nodeId: "math.analysis.differential_equations", targetLevel: "baseline", note: "Boundary value problems, Green functions, and Sturm-Liouville theory." },
        { nodeId: "physics.classical_mechanics.analytical", targetLevel: "baseline", note: "Stationary action principle, Euler-Lagrange equations, and Noether theorem." },
        { nodeId: "physics.em_optics.maxwell_electrodynamics", targetLevel: "baseline", note: "Covariant electrodynamics and relativistic field strength tensor." },
        { nodeId: "physics.relativity.special", targetLevel: "baseline", note: "Minkowski metric, Lorentz group, and 4-tensors." },
        { nodeId: "math.geometry.differential_geometry", targetLevel: "baseline", note: "Differentiable manifolds, affine connections, geodesics, and Riemann curvature." },
        { nodeId: "physics.relativity.general", targetLevel: "full", note: "Einstein field equations, Schwarzschild metric, gravitational radiation, and FLRW cosmology." },
        { nodeId: "physics.quantum.nonrelativistic", targetLevel: "baseline", note: "Hilbert spaces, operators, Schrodinger equation, and harmonic oscillator." },
        { nodeId: "physics.quantum.qft", targetLevel: "baseline", note: "Canonical quantization, Klein-Gordon and Dirac fields, and Feynman diagrams." }
      ]
    },
    {
      playlist_id: "preset_programming_languages",
      title: "Programming Languages & Paradigms Track",
      category: "Specialization",
      description: "Rigorous progression across programming language theory, type systems, and the major paradigms from low-level systems (Assembly, C, Rust) to OOP, Functional (Haskell, Lisp), Logic, and Concurrent systems (Go).",
      steps: [
        { nodeId: "cs.systems.digital_architecture", targetLevel: "baseline", note: "Hardware execution foundation: registers, ALU, memory hierarchy, and instruction cycles." },
        { nodeId: "cs.languages_compilers.systems_languages.assembly", targetLevel: "baseline", note: "Architecture-specific instruction sets, stack frames, calling conventions, and register allocation." },
        { nodeId: "cs.languages_compilers.systems_languages.c", targetLevel: "baseline", note: "Procedural systems programming: pointer arithmetic, manual memory layout, and ABI kernel interfaces." },
        { nodeId: "cs.languages_compilers.type_systems", targetLevel: "baseline", note: "Type theory foundations: lambda calculus, Hindley-Milner type inference, and typing soundness proofs." },
        { nodeId: "cs.languages_compilers.systems_languages.rust", targetLevel: "baseline", note: "Modern systems safety: affine types, ownership, borrow checking, and zero-cost abstractions." },
        { nodeId: "cs.languages_compilers.oop_languages.cpp", targetLevel: "baseline", note: "Multi-paradigm abstractions: RAII, smart pointers, templates, and compile-time metaprogramming." },
        { nodeId: "cs.languages_compilers.oop_languages.java", targetLevel: "baseline", note: "Managed OOP runtime: JVM bytecode execution, class loaders, and generational garbage collection." },
        { nodeId: "cs.languages_compilers.functional_languages.haskell", targetLevel: "baseline", note: "Pure functional paradigm: non-strict lazy evaluation, typeclasses, and monadic I/O abstractions." },
        { nodeId: "cs.languages_compilers.functional_languages.lisp", targetLevel: "baseline", note: "Homoiconic symbolic computation: S-expressions, lexical closures, and macro metaprogramming." },
        { nodeId: "cs.languages_compilers.logic_languages.prolog", targetLevel: "baseline", note: "Declarative logic programming: Horn clauses, Robinson resolution, and unification search." },
        { nodeId: "cs.languages_compilers.dynamic_languages.python", targetLevel: "baseline", note: "Dynamic multi-paradigm runtime: data models, generators, dynamic dispatch, and C extensions." },
        { nodeId: "cs.languages_compilers.dynamic_languages.typescript", targetLevel: "baseline", note: "Event-driven asynchronous web execution combined with static structural type checking." },
        { nodeId: "cs.languages_compilers.concurrent_languages.go", targetLevel: "full", note: "Scalable concurrency: Communicating Sequential Processes (CSP), goroutines, and message-passing channels." }
      ]
    }
  ];

  let BUILTIN_PLAYLIST_PRESETS = (window.POLYMATHY_PLAYLIST_PRESETS && Array.isArray(window.POLYMATHY_PLAYLIST_PRESETS))
    ? window.POLYMATHY_PLAYLIST_PRESETS
    : DEFAULT_FALLBACK_PRESETS;
  let activePlaylistPresetsSource = (window.POLYMATHY_PLAYLIST_PRESETS && Array.isArray(window.POLYMATHY_PLAYLIST_PRESETS))
    ? "playlists/presets.js"
    : "fallback";

  async function fetchPlaylistPresets() {
    if (window.location.protocol.startsWith("http")) {
      const dirs = ["playlists", "presets"];
      for (const dir of dirs) {
        try {
          const resp = await fetch(`./${dir}/index.json?_t=` + Date.now(), { cache: "no-cache" });
          if (resp.ok) {
            const files = await resp.json();
            if (Array.isArray(files) && files.length > 0) {
              const loaded = [];
              for (const f of files) {
                try {
                  const pResp = await fetch(`./${dir}/${f}?_t=` + Date.now(), { cache: "no-cache" });
                  if (pResp.ok) {
                    const pj = await pResp.json();
                    if (pj && pj.playlist_id && Array.isArray(pj.steps)) loaded.push(pj);
                  }
                } catch (err) {
                  console.warn(`Could not load preset ${f} from ${dir}:`, err);
                }
              }
              if (loaded.length > 0) return { data: loaded, source: `${dir}/` };
            }
          }
        } catch (err) {
          // Continue to next directory
        }
      }
    }

    if (window.POLYMATHY_PLAYLIST_PRESETS && Array.isArray(window.POLYMATHY_PLAYLIST_PRESETS) && window.POLYMATHY_PLAYLIST_PRESETS.length > 0) {
      return { data: window.POLYMATHY_PLAYLIST_PRESETS, source: "playlists/presets.js" };
    }

    return { data: DEFAULT_FALLBACK_PRESETS, source: "fallback" };
  }

  function safeReadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return structuredClone(fallback);
      return JSON.parse(raw);
    } catch {
      return structuredClone(fallback);
    }
  }

  function safeWriteJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch { /* Ignore storage quota limits in private mode */ }
  }

  const initialBasePatch = extractBasePatch(activeCurriculumData);
  const initialNavState = extractInitialState(activeCurriculumData);

  const LEGACY_V1_NODE_IDS = new Set([
    "physics.mechanics", "physics.mechanics.kinematics", "physics.mechanics.newton_laws",
    "physics.mechanics.work_energy", "physics.mechanics.rotation", "physics.mechanics.gravitation", "physics.mechanics.fluids",
    "physics.electromagnetism", "physics.electromagnetism.electrostatics", "physics.electromagnetism.capacitance",
    "physics.electromagnetism.magnetism", "physics.electromagnetism.induction",
    "physics.thermal_optics", "physics.thermal_optics.thermodynamics", "physics.thermal_optics.wave_optics",
    "physics.modern", "physics.modern.quantum_basics", "physics.modern.nuclear",
    "chemistry.physical.mole_concept", "chemistry.physical.atomic_structure",
    "chemistry.physical.thermodynamics", "chemistry.physical.equilibrium", "chemistry.physical.kinetics", "chemistry.physical.electrochemistry",
    "chemistry.inorganic", "chemistry.inorganic.periodic_properties", "chemistry.inorganic.chemical_bonding", "chemistry.inorganic.coordination",
    "chemistry.organic.reaction_mechanisms", "chemistry.organic.hydrocarbons_halides", "chemistry.organic.carbonyls",

  function setPlaylistStep(index) {

  function computePlaylistSpotlightSets(playlist, graph) {
    if (!playlist || !Array.isArray(playlist.steps)) {
      return { stepSet: new Set(), spineSet: new Set(), prereqSet: new Set(), allSpotlightSet: new Set() };
    }
    const stepSet = new Set(playlist.steps.map(s => s.nodeId));
    const spineSet = new Set();
    for (const stepId of stepSet) {
      for (const anc of getAncestorChain(stepId, graph.nodes)) {
        spineSet.add(anc.id);
      }
    }
    const prereqSet = new Set();
    if (layer2State.playlistState?.spotlightIncludePrereqs) {
      const queue = [...stepSet];
      const visited = new Set(stepSet);
      while (queue.length > 0) {
        const u = queue.shift();
        const node = graph.nodes.get(u);
        if (!node) continue;
        for (const pId of node.prereqIds) {
          if (!visited.has(pId)) {
            visited.add(pId);
            prereqSet.add(pId);
            queue.push(pId);
          }
        }
      }
    }
    const allSpotlightSet = new Set([...stepSet, ...spineSet, ...prereqSet]);
    return { stepSet, spineSet, prereqSet, allSpotlightSet };
  }

  function fitPlaylistNodes(duration = 450) {
    const pl = getActivePlaylist();
    if (!pl || !Array.isArray(pl.steps) || pl.steps.length === 0) return;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    let count = 0;
    for (const step of pl.steps) {
      const anchor = findVisibleAnchor(step.nodeId);
      const pos = anchor.pos;
      if (pos) {
        minX = Math.min(minX, pos.x - 90);
        maxX = Math.max(maxX, pos.x + 90);
        minY = Math.min(minY, pos.y - 45);
        maxY = Math.max(maxY, pos.y + 45);
        count++;
      }
    }
    if (count === 0) return;
    const canvas = document.getElementById("canvasPane");
    const w = canvas.clientWidth || 800;
    const h = canvas.clientHeight || 600;
    const spanX = Math.max(260, maxX - minX);
    const spanY = Math.max(260, maxY - minY);
    const k = Math.max(0.24, Math.min(1.2, Math.min((w - 100) / spanX, (h - 100) / spanY)));
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    animateCameraTo(cx, cy, k, duration);
  }

  function addNodeToActivePlaylist(nodeId, note = "", targetLevel = "baseline") {
    let pl = getActivePlaylist();
    if (!pl) {
      if (storedPlaylists.length > 0) {
        layer2State.playlistState.activePlaylistId = storedPlaylists[0].playlist_id;
        pl = storedPlaylists[0];
      } else {
        pl = structuredClone(BUILTIN_PLAYLIST_PRESETS[0]);
        storedPlaylists.push(pl);

      }

  function cloneNode(n) {
    return {
      id: n.id,
      title: n.title || prettifySlug(n.id),
      parentId: n.parentId ?? null,
      prereqIds: Array.isArray(n.prereqIds) ? [...n.prereqIds] : [],
      intro: n.intro || "",
      sources: Array.isArray(n.sources) ? n.sources.map(s => ({ ...s })) : [],
      isStub: !!n.isStub,
      isCustom: !!n.isCustom,
      isOverridden: !!n.isOverridden
    };
  }

  function prettifySlug(id) {
    const last = String(id).split(".").pop() || id;
    return last.replace(/[_-]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  }

  function inferParentFromSlug(id, nodeMap) {
    if (id === "knowledge") return null;
    const parts = String(id).split(".");
    while (parts.length > 1) {
      parts.pop();
      const candidate = parts.join(".");
      if (nodeMap.has(candidate)) return candidate;
      return candidate;
    }
    return "knowledge";
  }

  function foldLayer0(patches) {
    const map = new Map();
    for (const patch of patches) {
      if (patch.patch_id === "001_stem_polymath_curriculum") continue;
      if (Array.isArray(patch.nodes)) {
        for (const raw of patch.nodes) {
          if (!raw || !raw.id || LEGACY_V1_NODE_IDS.has(raw.id)) continue;
          const existing = map.get(raw.id);
          if (!existing) {
            map.set(raw.id, cloneNode(raw));
          } else {
            if (raw.title) existing.title = raw.title;
            if (raw.parentId !== undefined) existing.parentId = raw.parentId;
            if (raw.intro) existing.intro = raw.intro;
            if (Array.isArray(raw.prereqIds)) {
              for (const p of raw.prereqIds) {
                if (!existing.prereqIds.includes(p)) existing.prereqIds.push(p);
              }
            }
            if (Array.isArray(raw.sources)) {
              for (const s of raw.sources) {
                if (!existing.sources.some(es => es.id === s.id)) existing.sources.push({ ...s });
              }
            }
          }
        }
      }
      if (Array.isArray(patch.extensions)) {
        for (const ext of patch.extensions) {
          const target = map.get(ext.targetId);
          if (!target) continue;
          if (Array.isArray(ext.addPrereqs)) {
            for (const p of ext.addPrereqs) {
              if (!target.prereqIds.includes(p)) target.prereqIds.push(p);
            }
          }
          if (Array.isArray(ext.addSources)) {
            for (const s of ext.addSources) {
              if (!target.sources.some(es => es.id === s.id)) target.sources.push({ ...s });
            }
          }
        }
      }
    }
    return map;
  }

  function foldLayer0And1(patches, overrides) {
    const baseMap = foldLayer0(patches);
    const map = new Map();
    for (const [id, n] of baseMap) map.set(id, cloneNode(n));

    const tombstones = new Set(overrides.tombstones || []);
    const overriddenIds = new Set();

    for (const raw of (overrides.custom_nodes || [])) {
      if (!raw || !raw.id || tombstones.has(raw.id) || LEGACY_V1_NODE_IDS.has(raw.id)) continue;
      const node = cloneNode(raw);
      node.isCustom = true;
      map.set(node.id, node);
      overriddenIds.add(node.id);
    }

    for (const deadId of tombstones) {
      if (deadId !== "knowledge") map.delete(deadId);
    }

    for (const [id, patchFields] of Object.entries(overrides.field_overrides || {})) {
      const node = map.get(id);
      if (!node) continue;
      if (patchFields.title !== undefined) node.title = patchFields.title;
      if (patchFields.intro !== undefined) node.intro = patchFields.intro;
      node.isOverridden = true;
      overriddenIds.add(id);
    }

    for (const [id, newParent] of Object.entries(overrides.reparents || {})) {
      const node = map.get(id);
      if (!node || id === "knowledge") continue;
      node.parentId = newParent;
      node.isOverridden = true;
      overriddenIds.add(id);
    }

    for (const [id, delta] of Object.entries(overrides.edge_deltas || {})) {
      const node = map.get(id);
      if (!node) continue;
      const addP = new Set(delta.addPrereqs || []);
      const remP = new Set(delta.removePrereqs || []);
      for (const p of addP) {
        if (!node.prereqIds.includes(p)) node.prereqIds.push(p);
      }
      node.prereqIds = node.prereqIds.filter(p => !remP.has(p));

      const remS = new Set(delta.removeSourceIds || []);
      node.sources = node.sources.filter(s => !remS.has(s.id));
      for (const s of (delta.addSources || [])) {
        if (!node.sources.some(es => es.id === s.id)) node.sources.push({ ...s });
      }
      node.isOverridden = true;
      overriddenIds.add(id);
    }

    let addedStub = true;
    while (addedStub) {
      addedStub = false;
      const missingIds = new Set();
      for (const node of map.values()) {
        if (node.parentId && !map.has(node.parentId) && !tombstones.has(node.parentId)) {
          missingIds.add(node.parentId);
        }
        for (const pId of node.prereqIds) {
          if (!map.has(pId) && !tombstones.has(pId)) {
            missingIds.add(pId);
          }
        }
      }
      for (const mId of missingIds) {
        const inferredParent = inferParentFromSlug(mId, map);
        map.set(mId, {
          id: mId,
          title: prettifySlug(mId),
          parentId: inferredParent,
          prereqIds: [],
          intro: "",
          sources: [],
          isStub: true,
          isCustom: false,
          isOverridden: false
        });
        addedStub = true;
      }
    }

    for (const node of map.values()) {
      if (node.id !== "knowledge" && (!node.parentId || !map.has(node.parentId))) {
        node.parentId = "knowledge";
      }
      node.prereqIds = node.prereqIds.filter(p => map.has(p) && p !== node.id);
    }

    return { map, baseMap, overriddenIds };
  }

  function buildLiveGraph() {
    const { map, baseMap, overriddenIds } = foldLayer0And1(layer0Patches, layer1Overrides);

    const childrenMap = new Map();
    const dependentsMap = new Map();
    for (const id of map.keys()) {
      childrenMap.set(id, []);
      dependentsMap.set(id, []);
    }
    for (const node of map.values()) {
      if (node.parentId && childrenMap.has(node.parentId)) {
        childrenMap.get(node.parentId).push(node.id);
      }
      for (const pId of node.prereqIds) {
        if (dependentsMap.has(pId)) dependentsMap.get(pId).push(node.id);
      }
    }

    const nodeState = (id) => {
      const s = layer2State.nodes[id];
      return {
        introDone: !!(s && s.introDone),
        baselineDone: !!(s && s.baselineDone),
        completedSourceIds: Array.isArray(s && s.completedSourceIds) ? s.completedSourceIds : [],
        expandedOnMap: !!(s && s.expandedOnMap)
      };
    };

    const progressMap = new Map();
    function computeProgress(id, visiting = new Set()) {
      if (progressMap.has(id)) return progressMap.get(id);
      if (visiting.has(id)) return 0;
      visiting.add(id);

      const node = map.get(id);
      const st = nodeState(id);
      const kids = childrenMap.get(id) || [];

      let r = 0;
      if (kids.length === 0) {
        const introVal = st.introDone ? 1 : 0;
        const baseVal = st.baselineDone ? 1 : 0;
        const totalSrc = node.sources.length;
        if (totalSrc === 0) {
          r = 0.50 * introVal + 0.50 * baseVal;
        } else {
          const doneSrc = node.sources.filter(s => st.completedSourceIds.includes(s.id)).length;
          r = 0.30 * introVal + 0.40 * (doneSrc / totalSrc) + 0.30 * baseVal;
        }
      } else {
        let sum = 0;
        for (const cId of kids) sum += computeProgress(cId, visiting);
        r = sum / kids.length;
      }

      progressMap.set(id, r);
      visiting.delete(id);
      return r;
    }

    for (const id of map.keys()) computeProgress(id);

    for (const [id, node] of map) {
      const st = nodeState(id);
      const kids = childrenMap.get(id) || [];
      node.state = st;
      node.childrenIds = kids;
      node.dependentsIds = dependentsMap.get(id) || [];
      node.progress = progressMap.get(id) || 0;
      node.isBaselineDone = st.baselineDone;
      node.isBlocked = !st.baselineDone && node.prereqIds.some(pId => !nodeState(pId).baselineDone);
      node.isPostBaselineDeepened = st.baselineDone && kids.length > 0 && node.progress < 0.999;
      node.depth = computeDepth(id, map);
    }

    if (!map.has(layer2State.navigation.MAIN)) {
      layer2State.navigation.MAIN = map.has("physics.classical_mechanics.gravitation_rotational")
        ? "physics.classical_mechanics.gravitation_rotational"
        : (map.has("physics.classical_mechanics") ? "physics.classical_mechanics" : "knowledge");
    }
    if (!map.has(layer2State.navigation.HEAD)) layer2State.navigation.HEAD = layer2State.navigation.MAIN;
    layer2State.navigation.detourStack = (layer2State.navigation.detourStack || []).filter(id => map.has(id));

    return {
      nodes: map,
      baseNodes: baseMap,
      overriddenIds,
      navigation: layer2State.navigation
    };
  }

  function computeDepth(id, map) {
    let d = 0;
    let cur = map.get(id);
    const seen = new Set();
    while (cur && cur.parentId && map.has(cur.parentId) && !seen.has(cur.id)) {
      seen.add(cur.id);
      d++;
      cur = map.get(cur.parentId);
    }
    return d;
  }

  function findPrereqCycle(graphNodes, prereqId, targetId) {
    if (prereqId === targetId) return [targetId, prereqId];
    const adj = new Map();
    for (const n of graphNodes.values()) adj.set(n.id, []);
    for (const n of graphNodes.values()) {
      for (const p of n.prereqIds) {
        if (adj.has(p)) adj.get(p).push(n.id);
      }
    }
    const visited = new Set();
    const path = [];
    function dfs(curr) {
      if (curr === prereqId) {
        path.push(curr);
        return true;
      }
      if (visited.has(curr)) return false;
      visited.add(curr);
      path.push(curr);
      for (const nxt of (adj.get(curr) || [])) {
        if (dfs(nxt)) return true;
      }
      path.pop();
      return false;
    }
    if (dfs(targetId)) return path;
    return null;
  }

  function validateFullDagAcyclicity(nodeMap) {
    const adj = new Map();
    for (const id of nodeMap.keys()) adj.set(id, []);
    for (const n of nodeMap.values()) {
      for (const p of n.prereqIds) {
        if (adj.has(p)) adj.get(p).push(n.id);
      }
    }
    const color = new Map();
    const stack = [];
    for (const id of nodeMap.keys()) {
      if ((color.get(id) || 0) !== 0) continue;
      const cycle = dfsCycleCheck(id, adj, color, stack);
      if (cycle) return cycle;
    }
    return null;
  }

  function dfsCycleCheck(u, adj, color, stack) {
    color.set(u, 1);
    stack.push(u);
    for (const v of (adj.get(u) || [])) {
      const c = color.get(v) || 0;
      if (c === 1) {
        const idx = stack.indexOf(v);
        return [...stack.slice(idx), v];
      }
      if (c === 0) {
        const res = dfsCycleCheck(v, adj, color, stack);
        if (res) return res;
      }
    }
    stack.pop();
    color.set(u, 2);
    return null;
  }

  function getAncestorChain(id, nodesMap) {
    const chain = [];
    let cur = nodesMap.get(id);
    const seen = new Set();
    while (cur && !seen.has(cur.id)) {
      seen.add(cur.id);
      chain.unshift(cur);
      cur = cur.parentId ? nodesMap.get(cur.parentId) : null;
    }
    return chain;
  }

  function formatTruncatedDirectory(id, nodesMap) {
    const chain = getAncestorChain(id, nodesMap);
    if (chain.length <= 1) return "Knowledge";
    const sub = chain.slice(1).map(n => n.title);
    const n = sub.length;
    if (n === 1) return sub[0];
    if (n === 2) return `${sub[0]} / ${sub[1]}`;
    return `${sub[0]} / ... / ${sub[n - 2]} / ${sub[n - 1]}`;
  }

  function formatPrereqArrowDirectory(targetId, nodesMap) {
    const chain = getAncestorChain(targetId, nodesMap);
    if (chain.length <= 1) return "Knowledge";
    const sub = chain.slice(1).map(n => n.title);
    const n = sub.length;
    if (n === 1) return sub[0];
    if (n === 2) return `${sub[0]} / ${sub[1]}`;
    const parentDir = sub[n - 2];
    const targetTitle = sub[n - 1];
    const shortTitle = targetTitle.length > 22 ? targetTitle.slice(0, 20) + ".." : targetTitle;
    return `${sub[0]} / ${parentDir} -> ${shortTitle}`;
  }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderMathInContainer(el) {
    if (!el || typeof window.renderMathInElement !== "function") return;
    try {
      window.renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true }
        ],
        throwOnError: false
      });
    } catch { /* Fallback */ }
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove("show"), 2400);
  }

  /* =========================================================================
   * 3. LAYOUT ENGINE (Tidy Tree & Generous Radial)
   * ========================================================================= */
  let liveGraph = buildLiveGraph();
  let layoutPositions = new Map();
  let visibleNodeIds = new Set();

  function computeGoalSpotlightSets(mainId, graph) {
    const hierarchySet = new Set(["knowledge"]);
    for (const anc of getAncestorChain(mainId, graph.nodes)) hierarchySet.add(anc.id);
    hierarchySet.add(mainId);

    const mainNode = graph.nodes.get(mainId);
    if (mainNode && mainNode.state?.expandedOnMap && Array.isArray(mainNode.childrenIds)) {
      for (const cId of mainNode.childrenIds) hierarchySet.add(cId);
    }

    const prereqOnlySet = new Set();
    const queue = [mainId];
    while (queue.length > 0) {
      const cur = queue.shift();
      const node = graph.nodes.get(cur);
      if (!node) continue;
      for (const pId of node.prereqIds) {
        if (!prereqOnlySet.has(pId)) {
          prereqOnlySet.add(pId);
          queue.push(pId);
        }
      }
    }

    const prereqSpineSet = new Set(["knowledge", mainId]);
    for (const pId of prereqOnlySet) {
      prereqSpineSet.add(pId);
      for (const anc of getAncestorChain(pId, graph.nodes)) prereqSpineSet.add(anc.id);
    }

    const hybridSet = new Set([...hierarchySet, ...prereqSpineSet]);
    return { hierarchySet, prereqOnlySet, prereqSpineSet, hybridSet };
  }

  function computeVisibleSet(graph) {
    if (uiSettings.spotlightMain && uiSettings.spotlightMode === "node") {
      const mainId = graph.navigation.MAIN;
      if (mainId && graph.nodes.has(mainId)) {
        const goalSets = computeGoalSpotlightSets(mainId, graph);
        if (uiSettings.goalSpotlightType === "hierarchy") {
          return new Set(goalSets.hierarchySet);
        } else if (uiSettings.goalSpotlightType === "prereq") {
          return new Set(goalSets.prereqSpineSet);
        } else {
          return new Set(goalSets.hybridSet);
        }
      }
    }

    const vis = new Set(["knowledge"]);
    function walk(id) {
      const n = graph.nodes.get(id);
      if (!n) return;
      if (n.state.expandedOnMap || id === "knowledge") {
        for (const cId of n.childrenIds) {
          vis.add(cId);
          walk(cId);
        }
      }
    }
    walk("knowledge");
    return vis;
  }

  function computeLayout(graph) {
    visibleNodeIds = computeVisibleSet(graph);
    const pos = new Map();

    if (uiSettings.layoutMode === "tree") {
      const NODE_WIDTH = 180;
      const HORIZ_GAP = 95;
      const UNIT_WIDTH = NODE_WIDTH + HORIZ_GAP;
      const LEVEL_HEIGHT = 220;

      const subtreeWidths = new Map();
      function calcSubtreeWidth(id) {
        const n = graph.nodes.get(id);
        const visKids = (n?.childrenIds || []).filter(c => visibleNodeIds.has(c));
        if (visKids.length === 0) {
          subtreeWidths.set(id, UNIT_WIDTH);
          return UNIT_WIDTH;
        }
        let total = 0;
        for (const cId of visKids) total += calcSubtreeWidth(cId);
        const w = Math.max(UNIT_WIDTH, total);
        subtreeWidths.set(id, w);
        return w;
      }
      calcSubtreeWidth("knowledge");

      function assignTreePos(id, leftX) {
        const n = graph.nodes.get(id);
        const totalW = subtreeWidths.get(id) || UNIT_WIDTH;
        const centerX = leftX + totalW / 2;
        const y = n.depth * LEVEL_HEIGHT - 120;
        pos.set(id, { x: centerX, y, angle: Math.PI / 2, depth: n.depth });

        const visKids = (n?.childrenIds || []).filter(c => visibleNodeIds.has(c));
        let curLeft = leftX;
        for (const cId of visKids) {
          const kidW = subtreeWidths.get(cId) || UNIT_WIDTH;
          assignTreePos(cId, curLeft);
          curLeft += kidW;
        }
      }
      const rootW = subtreeWidths.get("knowledge") || UNIT_WIDTH;
      assignTreePos("knowledge", -rootW / 2);

    } else {
      const leafCountMap = new Map();
      function countLeaves(id) {
        const n = graph.nodes.get(id);
        const visKids = (n?.childrenIds || []).filter(c => visibleNodeIds.has(c));
        if (visKids.length === 0) {
          leafCountMap.set(id, 1);
          return 1;
        }
        let count = 0;
        for (const cId of visKids) count += countLeaves(cId);
        leafCountMap.set(id, Math.max(1, count));
        return count;
      }
      countLeaves("knowledge");

      const totalLeaves = leafCountMap.get("knowledge") || 1;
      const outerRadius = Math.max(1200, (totalLeaves * 240) / (2 * Math.PI));
      const ringRadii = [0, outerRadius * 0.28, outerRadius * 0.52, outerRadius * 0.76, outerRadius, outerRadius * 1.25];

      pos.set("knowledge", { x: 0, y: 0, angle: 0, depth: 0 });

      function assignRadialPos(id, thetaStart, thetaEnd) {
        const n = graph.nodes.get(id);
        const visKids = (n?.childrenIds || []).filter(c => visibleNodeIds.has(c));
        const totalW = visKids.reduce((acc, c) => acc + (leafCountMap.get(c) || 1), 0) || 1;
        let curAngle = thetaStart;

        for (const cId of visKids) {
          const w = leafCountMap.get(cId) || 1;
          const span = ((thetaEnd - thetaStart) * w) / totalW;
          const mid = curAngle + span / 2;
          const d = graph.nodes.get(cId).depth;
          const r = ringRadii[d] || (d * 280);
          pos.set(cId, {
            x: r * Math.cos(mid),
            y: r * Math.sin(mid),
            angle: mid,
            depth: d
          });
          assignRadialPos(cId, curAngle, curAngle + span);
          curAngle += span;
        }
      }
      assignRadialPos("knowledge", -Math.PI * 0.5, Math.PI * 1.5);
    }

    layoutPositions = pos;
    return pos;
  }

  /* =========================================================================
   * 4. CAMERA ENGINE
   * ========================================================================= */
  const camera = { x: 0, y: 0, k: 0.95 };
  let animFrameId = null;

  function applyWorldTransform() {
    const canvas = document.getElementById("canvasPane");
    const w = canvas.clientWidth || 800;
    const h = canvas.clientHeight || 600;
    const tx = w / 2 + camera.x;
    const ty = h / 2 + camera.y;
    document.getElementById("svgWorld").setAttribute("transform", `translate(${tx.toFixed(2)}, ${ty.toFixed(2)}) scale(${camera.k.toFixed(4)})`);
    const pct = `${Math.round(camera.k * 100)}%`;
    document.getElementById("zoomPctLabel").textContent = pct;
    document.getElementById("minimapZoomPct").textContent = pct;
    updateMinimapViewport();
  }

  function cancelCameraAnim() {
    if (animFrameId !== null) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
  }

  function animateCameraTo(worldX, worldY, targetK = null, duration = 400) {
    cancelCameraAnim();
    const startX = camera.x;
    const startY = camera.y;
    const startK = camera.k;
    const endK = targetK !== null ? targetK : startK;
    const endX = -worldX * endK;
    const endY = -worldY * endK;
    const t0 = performance.now();

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function step(now) {
      const raw = Math.min(1, (now - t0) / duration);
      const e = easeInOutCubic(raw);
      camera.x = startX + (endX - startX) * e;
      camera.y = startY + (endY - startY) * e;
      camera.k = startK + (endK - startK) * e;
      applyWorldTransform();
      if (raw < 1) {
        animFrameId = requestAnimationFrame(step);
      } else {
        animFrameId = null;
      }
    }
    animFrameId = requestAnimationFrame(step);
  }

  function locateNode(id, zoomTarget = 0.98) {
    ensureAncestorsExpanded(id);
    const p = layoutPositions.get(id);
    if (!p) return;
    animateCameraTo(p.x, p.y, Math.max(camera.k, zoomTarget), 400);
  }

  function panCameraBy(dx, dy) {
    cancelCameraAnim();
    camera.x += dx;
    camera.y += dy;
    applyWorldTransform();
  }

  function fitVisibleGraph() {
    if (layoutPositions.size === 0) return;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of layoutPositions.values()) {
      minX = Math.min(minX, p.x - 95);
      maxX = Math.max(maxX, p.x + 95);
      minY = Math.min(minY, p.y - 50);
      maxY = Math.max(maxY, p.y + 50);
    }
    const canvas = document.getElementById("canvasPane");
    const w = canvas.clientWidth || 800;
    const h = canvas.clientHeight || 600;
    const spanX = Math.max(220, maxX - minX);
    const spanY = Math.max(220, maxY - minY);
    const k = Math.max(0.24, Math.min(1.2, Math.min((w - 90) / spanX, (h - 90) / spanY)));
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    animateCameraTo(cx, cy, k, 380);
  }

  function ensureAncestorsExpanded(id) {
    let cur = liveGraph.nodes.get(id);
    let changed = false;
    const seen = new Set();
    while (cur && cur.parentId && !seen.has(cur.id)) {
      seen.add(cur.id);
      if (!layer2State.nodes[cur.parentId]) {
        layer2State.nodes[cur.parentId] = { introDone: false, baselineDone: false, completedSourceIds: [], expandedOnMap: true };
        changed = true;
      } else if (!layer2State.nodes[cur.parentId].expandedOnMap) {
        layer2State.nodes[cur.parentId].expandedOnMap = true;
        changed = true;
      }
      cur = liveGraph.nodes.get(cur.parentId);
    }
    if (changed) {
      persistAll();
      liveGraph = buildLiveGraph();
      computeLayout(liveGraph);
      renderAll();
    }
  }

  function sampleCubicBezier(p0, p1, p2, p3, steps = 36) {
    const pts = [];
    let totalLen = 0;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const mt = 1 - t;
      const x = mt * mt * mt * p0.x + 3 * mt * mt * t * p1.x + 3 * mt * t * t * p2.x + t * t * t * p3.x;
      const y = mt * mt * mt * p0.y + 3 * mt * mt * t * p1.y + 3 * mt * t * t * p2.y + t * t * t * p3.y;
      if (i > 0) {
        const dx = x - pts[i - 1].x;
        const dy = y - pts[i - 1].y;
        totalLen += Math.hypot(dx, dy);
      }
      pts.push({ x, y, len: totalLen });
    }
    return { pts, totalLen: Math.max(1, totalLen) };
  }

  function pointAndTangentAtFraction(sampled, frac) {
    const clamped = Math.max(0, Math.min(1, frac));
    const targetLen = clamped * sampled.totalLen;
    const pts = sampled.pts;
    for (let i = 1; i < pts.length; i++) {
      if (pts[i].len >= targetLen || i === pts.length - 1) {
        const a = pts[i - 1];
        const b = pts[i];
        const seg = Math.max(0.0001, b.len - a.len);
        const u = Math.max(0, Math.min(1, (targetLen - a.len) / seg));
        const x = a.x + (b.x - a.x) * u;
        const y = a.y + (b.y - a.y) * u;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 1;
        return { x, y, tx: dx / d, ty: dy / d };
      }
    }
    return { x: pts[0].x, y: pts[0].y, tx: 1, ty: 0 };
  }

  function subPolylinePath(sampled, fracStart, fracEnd) {
    const aLen = Math.max(0, fracStart) * sampled.totalLen;
    const bLen = Math.min(1, fracEnd) * sampled.totalLen;
    if (bLen <= aLen) return "";
    const pts = sampled.pts;
    const startPt = pointAndTangentAtFraction(sampled, fracStart);
    const out = [`M ${startPt.x.toFixed(2)} ${startPt.y.toFixed(2)}`];
    for (let i = 1; i < pts.length; i++) {
      if (pts[i].len > aLen && pts[i].len < bLen) {
        out.push(`L ${pts[i].x.toFixed(2)} ${pts[i].y.toFixed(2)}`);
      }
    }
    const endPt = pointAndTangentAtFraction(sampled, fracEnd);
    out.push(`L ${endPt.x.toFixed(2)} ${endPt.y.toFixed(2)}`);
    return out.join(" ");
  }

  function makeSvgEl(tag, attrs = {}) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs)) {
      el.setAttribute(k, String(v));
    }
    return el;
  }

  function computeMainDependencySubgraph(graph) {
    const mainId = graph.navigation.MAIN;
    const activeSet = new Set();
    for (const anc of getAncestorChain(mainId, graph.nodes)) activeSet.add(anc.id);
    const queue = [mainId];
    while (queue.length > 0) {
      const cur = queue.shift();
      const node = graph.nodes.get(cur);
      if (!node) continue;
      for (const pId of node.prereqIds) {
        if (!activeSet.has(pId)) {
          activeSet.add(pId);
          queue.push(pId);
          for (const anc of getAncestorChain(pId, graph.nodes)) activeSet.add(anc.id);
        }
      }
    }
    return activeSet;
  }

  /* =========================================================================
   * 5. SCENE RENDERING
   * ========================================================================= */

    computeLayout(liveGraph);
    renderTopbar();
    renderFloatingDetour();
    renderSvgScene();
    renderMinimap();
    renderSidePanel();

  }

  function renderFloatingDetour() {
    const banner = document.getElementById("floatingDetourBanner");
    const stack = liveGraph.navigation.detourStack;
    if (stack.length === 0) {
      banner.classList.remove("visible");
      return;
    }
    const prevId = stack[stack.length - 1];
    const prevNode = liveGraph.nodes.get(prevId);
    const btn = document.getElementById("btnFloatingGetBack");
    btn.textContent = `<- Back to ${prevNode ? prevNode.title : prevId}`;
    document.getElementById("floatingDetourLabel").textContent = `Detour depth: ${stack.length}`;
