  const EMPTY_OVERRIDES = () => ({
    custom_nodes: [],
    field_overrides: {},
    edge_deltas: {},
    reparents: {},
    tombstones: []
  });

  /* =========================================================================
   * 2. PERSISTENCE & 3-LAYER OVERLAYFS ENGINE
   * ========================================================================= */
  const STORAGE_KEYS = {
    patches: "polymathy_v1_patches",
    overrides: "polymathy_v1_overrides",
    state: "polymathy_v1_state",
    ui: "polymathy_v1_ui"
  };

  function safeReadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return structuredClone(fallback);
      return JSON.parse(raw);
    } catch {
      return structuredClone(fallback);
    }
  }

  function safeWriteJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch {
      /* Ignore storage quota errors in private mode */
    }
  }

  let layer0Patches = safeReadJSON(STORAGE_KEYS.patches, [SEED_PATCH_001]);
  if (!Array.isArray(layer0Patches) || layer0Patches.length === 0) {
    layer0Patches = [structuredClone(SEED_PATCH_001)];
  }
  let layer1Overrides = Object.assign(EMPTY_OVERRIDES(), safeReadJSON(STORAGE_KEYS.overrides, EMPTY_OVERRIDES()));
  let layer2State = safeReadJSON(STORAGE_KEYS.state, SEED_STATE);
  if (!layer2State.navigation) layer2State.navigation = structuredClone(SEED_STATE.navigation);
  if (!layer2State.nodes) layer2State.nodes = {};

  let uiSettings = safeReadJSON(STORAGE_KEYS.ui, {
    layoutMode: "radial", // "radial" | "tree"
    learnChecklistActive: {},
    spotlightMain: false,
    sidePaneWidth: null
  });

  function persistAll() {
    safeWriteJSON(STORAGE_KEYS.patches, layer0Patches);
    safeWriteJSON(STORAGE_KEYS.overrides, layer1Overrides);
    safeWriteJSON(STORAGE_KEYS.state, layer2State);
    safeWriteJSON(STORAGE_KEYS.ui, uiSettings);
  }

  function cloneNode(n) {
    return {
      id: n.id,
      title: n.title || prettifySlug(n.id),
      parentId: n.parentId ?? null,
      prereqIds: Array.isArray(n.prereqIds) ? [...n.prereqIds] : [],
      intro: n.intro || "",
      sources: Array.isArray(n.sources) ? n.sources.map(s => ({ ...s })) : [],
      isStub: !!n.isStub,
      isCustom: !!n.isCustom,
      isOverridden: !!n.isOverridden
    };
  }

  function prettifySlug(id) {
    const last = String(id).split(".").pop() || id;
    return last.replace(/[_-]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  }

  function inferParentFromSlug(id, nodeMap) {
    if (id === "knowledge") return null;
    const parts = String(id).split(".");
    while (parts.length > 1) {
      parts.pop();
      const candidate = parts.join(".");
      if (nodeMap.has(candidate)) return candidate;
      // Also allow creating intermediate stub prefix if dotted hierarchy exists
      return candidate;
    }
    return "knowledge";
  }

  /* Fold Layer 0: append-only curriculum patches */
  function foldLayer0(patches) {
    const map = new Map();
    for (const patch of patches) {
      if (Array.isArray(patch.nodes)) {
        for (const raw of patch.nodes) {
          if (!raw || !raw.id) continue;
          const existing = map.get(raw.id);
          if (!existing) {
            map.set(raw.id, cloneNode(raw));
          } else {
            // Idempotent re-merge / upgrade
            if (raw.title) existing.title = raw.title;
            if (raw.parentId !== undefined) existing.parentId = raw.parentId;
            if (raw.intro) existing.intro = raw.intro;
            if (Array.isArray(raw.prereqIds)) {
              for (const p of raw.prereqIds) {
                if (!existing.prereqIds.includes(p)) existing.prereqIds.push(p);
              }
            }
            if (Array.isArray(raw.sources)) {
              for (const s of raw.sources) {
                if (!existing.sources.some(es => es.id === s.id)) existing.sources.push({ ...s });
              }
            }
          }
        }
      }
      if (Array.isArray(patch.extensions)) {
        for (const ext of patch.extensions) {
          const target = map.get(ext.targetId);
          if (!target) continue;
          if (Array.isArray(ext.addPrereqs)) {
            for (const p of ext.addPrereqs) {
              if (!target.prereqIds.includes(p)) target.prereqIds.push(p);
            }
          }
          if (Array.isArray(ext.addSources)) {
            for (const s of ext.addSources) {
              if (!target.sources.some(es => es.id === s.id)) target.sources.push({ ...s });
            }
          }
        }
      }
    }
    return map;
  }

  /* Fold Layer 0 (+) Layer 1 + Auto-hydrate Stubs */
  function foldLayer0And1(patches, overrides) {
    const baseMap = foldLayer0(patches);
    const map = new Map();
    for (const [id, n] of baseMap) map.set(id, cloneNode(n));

    const tombstones = new Set(overrides.tombstones || []);
    const overriddenIds = new Set();

    // Custom nodes created in UI
    for (const raw of (overrides.custom_nodes || [])) {
      if (!raw || !raw.id || tombstones.has(raw.id)) continue;
      const node = cloneNode(raw);
      node.isCustom = true;
      map.set(node.id, node);
      overriddenIds.add(node.id);
    }

    // Tombstones
    for (const deadId of tombstones) {
      if (deadId !== "knowledge") map.delete(deadId);
    }

    // Field overrides
    for (const [id, patchFields] of Object.entries(overrides.field_overrides || {})) {
      const node = map.get(id);
      if (!node) continue;
      if (patchFields.title !== undefined) node.title = patchFields.title;
      if (patchFields.intro !== undefined) node.intro = patchFields.intro;
      node.isOverridden = true;
      overriddenIds.add(id);
    }

    // Reparents
    for (const [id, newParent] of Object.entries(overrides.reparents || {})) {
      const node = map.get(id);
      if (!node || id === "knowledge") continue;
      node.parentId = newParent;
      node.isOverridden = true;
      overriddenIds.add(id);
    }

    // 2P-Set Edge Deltas (prereqIds + sources)
    for (const [id, delta] of Object.entries(overrides.edge_deltas || {})) {
      const node = map.get(id);
      if (!node) continue;
      const addP = new Set(delta.addPrereqs || []);
      const remP = new Set(delta.removePrereqs || []);
      for (const p of addP) {
        if (!node.prereqIds.includes(p)) node.prereqIds.push(p);
      }
      node.prereqIds = node.prereqIds.filter(p => !remP.has(p));

      const remS = new Set(delta.removeSourceIds || []);
      node.sources = node.sources.filter(s => !remS.has(s.id));
      for (const s of (delta.addSources || [])) {
        if (!node.sources.some(es => es.id === s.id)) node.sources.push({ ...s });
      }
      node.isOverridden = true;
      overriddenIds.add(id);
    }

    // Ghost / Stub Node Auto-Hydration (fixed-point loop for multi-segment dotted IDs)
    let addedStub = true;
    while (addedStub) {
      addedStub = false;
      const missingIds = new Set();
      for (const node of map.values()) {
        if (node.parentId && !map.has(node.parentId) && !tombstones.has(node.parentId)) {
          missingIds.add(node.parentId);
        }
        for (const pId of node.prereqIds) {
          if (!map.has(pId) && !tombstones.has(pId)) {
            missingIds.add(pId);
          }
        }
      }
      for (const mId of missingIds) {
        const inferredParent = inferParentFromSlug(mId, map);
        map.set(mId, {
          id: mId,
          title: prettifySlug(mId),
          parentId: inferredParent,
          prereqIds: [],
          intro: "",
          sources: [],
          isStub: true,
          isCustom: false,
          isOverridden: false
        });
        addedStub = true;
      }
    }

    // Clean orphaned parentId or tombstoned prereqIds
    for (const node of map.values()) {
      if (node.id !== "knowledge" && (!node.parentId || !map.has(node.parentId))) {
        node.parentId = "knowledge";
      }
      node.prereqIds = node.prereqIds.filter(p => map.has(p) && p !== node.id);
    }

    return { map, baseMap, overriddenIds };
  }

  /* Join Layer 2 Telemetry + Compute Recursive Conduit Progress Ratios */
  function buildLiveGraph() {
    const { map, baseMap, overriddenIds } = foldLayer0And1(layer0Patches, layer1Overrides);

    // Build children adjacency & outgoing prereq dependents
    const childrenMap = new Map();
    const dependentsMap = new Map();
    for (const id of map.keys()) {
      childrenMap.set(id, []);
      dependentsMap.set(id, []);
    }
    for (const node of map.values()) {
      if (node.parentId && childrenMap.has(node.parentId)) {
        childrenMap.get(node.parentId).push(node.id);
      }
      for (const pId of node.prereqIds) {
        if (dependentsMap.has(pId)) dependentsMap.get(pId).push(node.id);
      }
    }

    // Attach Layer 2 state per node
    const nodeState = (id) => {
      const s = layer2State.nodes[id];
      return {
        introDone: !!(s && s.introDone),
        baselineDone: !!(s && s.baselineDone),
        completedSourceIds: Array.isArray(s && s.completedSourceIds) ? s.completedSourceIds : [],
        expandedOnMap: !!(s && s.expandedOnMap)
      };
    };

    const progressMap = new Map();
    function computeProgress(id, visiting = new Set()) {
      if (progressMap.has(id)) return progressMap.get(id);
      if (visiting.has(id)) return 0;
      visiting.add(id);

      const node = map.get(id);
      const st = nodeState(id);
      const kids = childrenMap.get(id) || [];

      let r = 0;
      if (kids.length === 0) {
        const introVal = st.introDone ? 1 : 0;
        const baseVal = st.baselineDone ? 1 : 0;
        const totalSrc = node.sources.length;
        if (totalSrc === 0) {
          r = 0.50 * introVal + 0.50 * baseVal;
        } else {
          const doneSrc = node.sources.filter(s => st.completedSourceIds.includes(s.id)).length;
          r = 0.30 * introVal + 0.40 * (doneSrc / totalSrc) + 0.30 * baseVal;
        }
      } else {
        let sum = 0;
        for (const cId of kids) sum += computeProgress(cId, visiting);
        r = sum / kids.length;
      }

      progressMap.set(id, r);
      visiting.delete(id);
      return r;
    }

    for (const id of map.keys()) computeProgress(id);

    // Enrich nodes with computed metrics
    for (const [id, node] of map) {
      const st = nodeState(id);
      const kids = childrenMap.get(id) || [];
      node.state = st;
      node.childrenIds = kids;
      node.dependentsIds = dependentsMap.get(id) || [];
      node.progress = progressMap.get(id) || 0;
      node.isBaselineDone = st.baselineDone;
      node.isBlocked = !st.baselineDone && node.prereqIds.some(pId => !nodeState(pId).baselineDone);
      node.isPostBaselineDeepened = st.baselineDone && kids.length > 0 && node.progress < 0.999;
      node.depth = computeDepth(id, map);
    }

    // Ensure navigation pointers stay valid
    if (!map.has(layer2State.navigation.MAIN)) layer2State.navigation.MAIN = "knowledge";
    if (!map.has(layer2State.navigation.HEAD)) layer2State.navigation.HEAD = layer2State.navigation.MAIN;
    layer2State.navigation.detourStack = (layer2State.navigation.detourStack || []).filter(id => map.has(id));

    return {
      nodes: map,
      baseNodes: baseMap,
      overriddenIds,
      navigation: layer2State.navigation
    };
  }

  function computeDepth(id, map) {
    let d = 0;
    let cur = map.get(id);
    const seen = new Set();
    while (cur && cur.parentId && map.has(cur.parentId) && !seen.has(cur.id)) {
      seen.add(cur.id);
      d++;
      cur = map.get(cur.parentId);
    }
    return d;
  }

  /* Strict Acyclicity DFS Check on E_prereq: returns cycle array or null */
  function findPrereqCycle(graphNodes, prereqId, targetId) {
    // Adding edge (prereqId -> targetId) creates a cycle iff prereqId is reachable from targetId
    // via existing outgoing prerequisite edges (dependents)
    if (prereqId === targetId) return [targetId, prereqId];
    const adj = new Map();
    for (const n of graphNodes.values()) adj.set(n.id, []);
    for (const n of graphNodes.values()) {
      for (const p of n.prereqIds) {
        if (adj.has(p)) adj.get(p).push(n.id);
      }
    }
    // Simulate adding edge prereqId -> targetId; check path from targetId to prereqId
    const visited = new Set();
    const path = [];
    function dfs(curr) {
      if (curr === prereqId) {
        path.push(curr);
        return true;
      }
      if (visited.has(curr)) return false;
      visited.add(curr);
      path.push(curr);
      for (const nxt of (adj.get(curr) || [])) {
        if (dfs(nxt)) return true;
      }
      path.pop();
      return false;
    }
    if (dfs(targetId)) return path;
    return null;
  }

  function validateFullDagAcyclicity(nodeMap) {
    const adj = new Map();
    for (const id of nodeMap.keys()) adj.set(id, []);
    for (const n of nodeMap.values()) {
      for (const p of n.prereqIds) {
        if (adj.has(p)) adj.get(p).push(n.id);
      }
    }
    const color = new Map(); // 0 unvisited, 1 visiting, 2 done
    const stack = [];
    for (const id of nodeMap.keys()) {
      if ((color.get(id) || 0) !== 0) continue;
      const cycle = dfsCycleCheck(id, adj, color, stack);
      if (cycle) return cycle;
    }
    return null;
  }

  function dfsCycleCheck(u, adj, color, stack) {
    color.set(u, 1);
    stack.push(u);
    for (const v of (adj.get(u) || [])) {
      const c = color.get(v) || 0;
      if (c === 1) {
        const idx = stack.indexOf(v);
        return [...stack.slice(idx), v];
      }
      if (c === 0) {
        const res = dfsCycleCheck(v, adj, color, stack);
        if (res) return res;
      }
    }
    stack.pop();
    color.set(u, 2);
    return null;
  }

  /* =========================================================================
   * 3. DIRECTORY TRUNCATION & FORMATTING HELPERS
   * ========================================================================= */
  function getAncestorChain(id, nodesMap) {
    const chain = [];
    let cur = nodesMap.get(id);
    const seen = new Set();
    while (cur && !seen.has(cur.id)) {
      seen.add(cur.id);
      chain.unshift(cur);
      cur = cur.parentId ? nodesMap.get(cur.parentId) : null;
    }
    return chain;
  }

  function formatTruncatedDirectory(id, nodesMap) {
    const chain = getAncestorChain(id, nodesMap);
    if (chain.length <= 1) return "Knowledge (Origin)";
    // Drop root v_0 = Knowledge; indices [1..n]
    const sub = chain.slice(1).map(n => n.title);
    const n = sub.length;
    if (n === 1) return sub[0];
    if (n === 2) return `${sub[0]} / ${sub[1]}`;
    return `${sub[0]} / ... / ${sub[n - 2]} / ${sub[n - 1]}`;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderMathInContainer(el) {
    if (!el || typeof window.renderMathInElement !== "function") return;
    try {
      window.renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true }
        ],
        throwOnError: false
      });
    } catch { /* Graceful fallback */ }
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove("show"), 2400);
  }

  /* =========================================================================
   * 4. GRAPH LAYOUT ENGINE (Radial Wedge + Orthogonal Top-Down Tree)
   * ========================================================================= */
  let liveGraph = buildLiveGraph();
  let layoutPositions = new Map(); // id -> { x, y, angle, depth, visibleChildren }
  let visibleNodeIds = new Set();

  function computeVisibleSet(graph) {
    const vis = new Set(["knowledge"]);
    function walk(id) {
      const n = graph.nodes.get(id);
      if (!n) return;
      if (n.state.expandedOnMap || id === "knowledge") {
        for (const cId of n.childrenIds) {
          vis.add(cId);
          walk(cId);
        }
      }
    }
    walk("knowledge");
    return vis;
  }

  function computeLayout(graph) {
    visibleNodeIds = computeVisibleSet(graph);
    const pos = new Map();

    // Leaf weight among visible nodes
    const weightMap = new Map();
    function calcWeight(id) {
      const n = graph.nodes.get(id);
      if (!n) return 1;
      const visKids = n.childrenIds.filter(c => visibleNodeIds.has(c));
      if (visKids.length === 0) {
        weightMap.set(id, 1);
        return 1;
      }
      let sum = 0;
      for (const c of visKids) sum += calcWeight(c);
      const w = Math.max(1, sum);
      weightMap.set(id, w);
      return w;
    }
    calcWeight("knowledge");

    if (uiSettings.layoutMode === "radial") {
      // Count visible nodes at each depth to dynamically expand ring radii if dense
      const depthCounts = new Map();
      for (const id of visibleNodeIds) {
        const d = graph.nodes.get(id).depth;
        depthCounts.set(d, (depthCounts.get(d) || 0) + 1);
      }
      const ringRadius = new Map([[0, 0]]);
      const maxDepth = Math.max(0, ...depthCounts.keys());
      for (let d = 1; d <= maxDepth; d++) {
        const prevR = ringRadius.get(d - 1);
        const minCircumferenceR = ((depthCounts.get(d) || 1) * 185) / (2 * Math.PI);
        ringRadius.set(d, Math.max(prevR + 195, minCircumferenceR));
      }

      pos.set("knowledge", { x: 0, y: 0, angle: 0, depth: 0 });

      function assignRadial(id, thetaStart, thetaEnd) {
        const n = graph.nodes.get(id);
        const visKids = n.childrenIds.filter(c => visibleNodeIds.has(c));
        const totalW = visKids.reduce((acc, c) => acc + weightMap.get(c), 0) || 1;
        let cur = thetaStart;
        for (const cId of visKids) {
          const w = weightMap.get(cId);
          const span = ((thetaEnd - thetaStart) * w) / totalW;
          const mid = cur + span / 2;
          const d = graph.nodes.get(cId).depth;
          const r = ringRadius.get(d) || d * 200;
          pos.set(cId, {
            x: r * Math.cos(mid),
            y: r * Math.sin(mid),
            angle: mid,
            depth: d
          });
          assignRadial(cId, cur, cur + span);
          cur += span;
        }
      }
      assignRadial("knowledge", -Math.PI * 0.5, Math.PI * 1.5);
    } else {
      // Orthogonal Top-Down Tidy Tree Layout
      const totalLeaves = weightMap.get("knowledge") || 1;
      const unitWidth = 190;
      const levelHeight = 165;
      const totalWidth = totalLeaves * unitWidth;

      function assignTree(id, xStart, xEnd) {
        const n = graph.nodes.get(id);
        const midX = (xStart + xEnd) / 2;
        const y = n.depth * levelHeight - 180;
        pos.set(id, { x: midX, y, angle: Math.PI / 2, depth: n.depth });

        const visKids = n.childrenIds.filter(c => visibleNodeIds.has(c));
        const totalW = visKids.reduce((acc, c) => acc + weightMap.get(c), 0) || 1;
        let curX = xStart;
        for (const cId of visKids) {
          const w = weightMap.get(cId);
          const span = ((xEnd - xStart) * w) / totalW;
          assignTree(cId, curX, curX + span);
          curX += span;
        }
      }
      assignTree("knowledge", -totalWidth / 2, totalWidth / 2);
    }

    layoutPositions = pos;
  }

  /* =========================================================================
   * 5. CAMERA (PAN, ZOOM, SMOOTH 450ms rAF INTERPOLATION) & MINIMAP
   * ========================================================================= */
  const camera = { x: 0, y: 0, k: 0.85 };
  let animFrameId = null;

  function applyWorldTransform() {
    const canvas = document.getElementById("canvasPane");
    const w = canvas.clientWidth || 800;
    const h = canvas.clientHeight || 600;
    const tx = w / 2 + camera.x;
    const ty = h / 2 + camera.y;
    document.getElementById("svgWorld").setAttribute("transform", `translate(${tx.toFixed(2)}, ${ty.toFixed(2)}) scale(${camera.k.toFixed(4)})`);
    const pct = `${Math.round(camera.k * 100)}%`;
    document.getElementById("zoomPctLabel").textContent = pct;
    document.getElementById("minimapZoomPct").textContent = pct;
    updateMinimapViewport();
  }

  function cancelCameraAnim() {
    if (animFrameId !== null) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
  }

  function animateCameraTo(worldX, worldY, targetK = null, duration = 450) {
    cancelCameraAnim();
    const startX = camera.x;
    const startY = camera.y;
    const startK = camera.k;
    const endK = targetK !== null ? targetK : startK;
    const endX = -worldX * endK;
    const endY = -worldY * endK;
    const t0 = performance.now();

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function step(now) {
      const raw = Math.min(1, (now - t0) / duration);
      const e = easeInOutCubic(raw);
      camera.x = startX + (endX - startX) * e;
      camera.y = startY + (endY - startY) * e;
      camera.k = startK + (endK - startK) * e;
      applyWorldTransform();
      if (raw < 1) {
        animFrameId = requestAnimationFrame(step);
      } else {
        animFrameId = null;
      }
    }
    animFrameId = requestAnimationFrame(step);
  }

  function locateNode(id, zoomTarget = 0.98) {
    ensureAncestorsExpanded(id);
    const p = layoutPositions.get(id);
    if (!p) return;
    animateCameraTo(p.x, p.y, Math.max(camera.k, zoomTarget), 450);
  }

  function gentleCenterIfNearEdge(id) {
    const p = layoutPositions.get(id);
    if (!p) return;
    const canvas = document.getElementById("canvasPane");
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    const sx = p.x * camera.k + w / 2 + camera.x;
    const sy = p.y * camera.k + h / 2 + camera.y;
    const marginX = Math.min(130, w * 0.18);
    const marginY = Math.min(95, h * 0.18);
    if (sx < marginX || sx > w - marginX || sy < marginY || sy > h - marginY) {
      animateCameraTo(p.x, p.y, camera.k, 380);
    }
  }

  function fitVisibleGraph() {
    if (layoutPositions.size === 0) return;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of layoutPositions.values()) {
      minX = Math.min(minX, p.x - 95);
      maxX = Math.max(maxX, p.x + 95);
      minY = Math.min(minY, p.y - 45);
      maxY = Math.max(maxY, p.y + 45);
    }
    const canvas = document.getElementById("canvasPane");
    const w = canvas.clientWidth || 800;
    const h = canvas.clientHeight || 600;
    const spanX = Math.max(200, maxX - minX);
    const spanY = Math.max(200, maxY - minY);
    const k = Math.max(0.28, Math.min(1.25, Math.min((w - 80) / spanX, (h - 80) / spanY)));
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    animateCameraTo(cx, cy, k, 420);
  }

  function ensureAncestorsExpanded(id) {
    let cur = liveGraph.nodes.get(id);
    let changed = false;
    const seen = new Set();
    while (cur && cur.parentId && !seen.has(cur.id)) {
      seen.add(cur.id);
      if (!layer2State.nodes[cur.parentId]) {
        layer2State.nodes[cur.parentId] = { introDone: false, baselineDone: false, completedSourceIds: [], expandedOnMap: true };
        changed = true;
      } else if (!layer2State.nodes[cur.parentId].expandedOnMap) {
        layer2State.nodes[cur.parentId].expandedOnMap = true;
        changed = true;
      }
      cur = liveGraph.nodes.get(cur.parentId);
    }
    if (changed) {
      persistAll();
      liveGraph = buildLiveGraph();
      computeLayout(liveGraph);
      renderAll();
    }
  }

  /* =========================================================================
   * 6. SVG GEOMETRY HELPERS FOR HOLLOW PROGRESS CONDUITS
   * ========================================================================= */
  function sampleCubicBezier(p0, p1, p2, p3, steps = 40) {
    const pts = [];
    let totalLen = 0;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const mt = 1 - t;
      const x = mt * mt * mt * p0.x + 3 * mt * mt * t * p1.x + 3 * mt * t * t * p2.x + t * t * t * p3.x;
      const y = mt * mt * mt * p0.y + 3 * mt * mt * t * p1.y + 3 * mt * t * t * p2.y + t * t * t * p3.y;
      if (i > 0) {
        const dx = x - pts[i - 1].x;
        const dy = y - pts[i - 1].y;
        totalLen += Math.hypot(dx, dy);
      }
      pts.push({ x, y, len: totalLen });
    }
    return { pts, totalLen: Math.max(1, totalLen) };
  }

  function pointAndTangentAtFraction(sampled, frac) {
    const clamped = Math.max(0, Math.min(1, frac));
    const targetLen = clamped * sampled.totalLen;
    const pts = sampled.pts;
    for (let i = 1; i < pts.length; i++) {
      if (pts[i].len >= targetLen || i === pts.length - 1) {
        const a = pts[i - 1];
        const b = pts[i];
        const seg = Math.max(0.0001, b.len - a.len);
        const u = Math.max(0, Math.min(1, (targetLen - a.len) / seg));
        const x = a.x + (b.x - a.x) * u;
        const y = a.y + (b.y - a.y) * u;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 1;
        return { x, y, tx: dx / d, ty: dy / d };
      }
    }
    const p = pts[0];
    return { x: p.x, y: p.y, tx: 1, ty: 0 };
  }

  function subPolylinePath(sampled, fracStart, fracEnd) {
    const aLen = Math.max(0, fracStart) * sampled.totalLen;
    const bLen = Math.min(1, fracEnd) * sampled.totalLen;
    if (bLen <= aLen) return "";
    const pts = sampled.pts;
    const startPt = pointAndTangentAtFraction(sampled, fracStart);
    const out = [`M ${startPt.x.toFixed(2)} ${startPt.y.toFixed(2)}`];
    for (let i = 1; i < pts.length; i++) {
      if (pts[i].len > aLen && pts[i].len < bLen) {
        out.push(`L ${pts[i].x.toFixed(2)} ${pts[i].y.toFixed(2)}`);
      }
    }
    const endPt = pointAndTangentAtFraction(sampled, fracEnd);
    out.push(`L ${endPt.x.toFixed(2)} ${endPt.y.toFixed(2)}`);
    return out.join(" ");
  }

  function makeSvgEl(tag, attrs = {}) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs)) {
      el.setAttribute(k, String(v));
    }
    return el;
  }

  /* =========================================================================
   * 7. MAIN SUBGRAPH SPOTLIGHT HELPER (Frontier Radar)
   * ========================================================================= */
  function computeMainDependencySubgraph(graph) {
    const mainId = graph.navigation.MAIN;
    const activeSet = new Set();
    // 1) Tree ancestors of MAIN
    for (const anc of getAncestorChain(mainId, graph.nodes)) activeSet.add(anc.id);
    // 2) Transitive prerequisites of MAIN (and their tree ancestors so paths remain clear)
    const queue = [mainId];
    while (queue.length > 0) {
      const cur = queue.shift();
      const node = graph.nodes.get(cur);
      if (!node) continue;
      for (const pId of node.prereqIds) {
        if (!activeSet.has(pId)) {
          activeSet.add(pId);
          queue.push(pId);
          for (const anc of getAncestorChain(pId, graph.nodes)) activeSet.add(anc.id);
        }
      }
    }
    return activeSet;
  }

  /* =========================================================================
   * 8. RENDER ENGINE (SVG MAP + MINIMAP + SIDE PANEL + TOP TELEMETRY)
   * ========================================================================= */
  function renderAll() {
    liveGraph = buildLiveGraph();
    computeLayout(liveGraph);
    renderTopbar();
    renderFloatingDetour();
    renderSvgScene();
    renderMinimap();
    renderSidePanel();
    applyWorldTransform();
  }

  function renderTopbar() {
    const nodesArr = [...liveGraph.nodes.values()].filter(n => n.id !== "knowledge" && !n.isStub);
    const doneCount = nodesArr.filter(n => n.isBaselineDone).length;
    document.getElementById("globalProgressPill").textContent = `Baseline: ${doneCount} / ${nodesArr.length} Topics`;

    const mainNode = liveGraph.nodes.get(liveGraph.navigation.MAIN);
    const headNode = liveGraph.nodes.get(liveGraph.navigation.HEAD);
    document.getElementById("topMainTitle").textContent = mainNode ? mainNode.title : "—";
    document.getElementById("topHeadTitle").textContent = headNode ? headNode.title : "—";
    document.getElementById("btnToggleLayout").textContent = uiSettings.layoutMode === "radial" ? "Layout: Radial" : "Layout: Tree";

    const spotHud = document.getElementById("spotlightHudBox");
    spotHud.style.display = uiSettings.spotlightMain ? "flex" : "none";
  }

  function renderFloatingDetour() {
    const banner = document.getElementById("floatingDetourBanner");
    const stack = liveGraph.navigation.detourStack;
    if (stack.length === 0) {
      banner.classList.remove("visible");
      return;
    }
    const prevId = stack[stack.length - 1];
    const prevNode = liveGraph.nodes.get(prevId);
    const btn = document.getElementById("btnFloatingGetBack");
    btn.textContent = `← Get Back to ${prevNode ? prevNode.title : prevId}`;
    document.getElementById("floatingDetourLabel").textContent = `Stack Depth: ${stack.length}`;
    banner.classList.add("visible");
  }

  function findVisibleAnchor(id) {
    if (visibleNodeIds.has(id) && layoutPositions.has(id)) {
      return { id, pos: layoutPositions.get(id), proxied: false };
    }
    let cur = liveGraph.nodes.get(id);
    const seen = new Set();
    while (cur && cur.parentId && !seen.has(cur.id)) {
      seen.add(cur.id);
      if (visibleNodeIds.has(cur.parentId) && layoutPositions.has(cur.parentId)) {
        return { id: cur.parentId, pos: layoutPositions.get(cur.parentId), proxied: true };
      }
      cur = liveGraph.nodes.get(cur.parentId);
    }
    return { id: "knowledge", pos: layoutPositions.get("knowledge"), proxied: true };
  }

  function renderSvgScene() {
    const gConduits = document.getElementById("layerConduits");
    const gPrereqs = document.getElementById("layerPrereqs");
    const gSources = document.getElementById("layerSources");
    const gNodes = document.getElementById("layerNodes");
    const gPills = document.getElementById("layerPrereqPills");

    gConduits.innerHTML = "";
    gPrereqs.innerHTML = "";
    gSources.innerHTML = "";
    gNodes.innerHTML = "";
    gPills.innerHTML = "";

    const spotlightSet = uiSettings.spotlightMain ? computeMainDependencySubgraph(liveGraph) : null;
    const isDimmed = (id) => spotlightSet && !spotlightSet.has(id);

    /* 1) Hollow Progress Conduits & Perpendicular Crossbars */
    for (const vId of visibleNodeIds) {
      if (vId === "knowledge") continue;
      const v = liveGraph.nodes.get(vId);
      const uPos = layoutPositions.get(v.parentId);
      const vPos = layoutPositions.get(vId);
      if (!uPos || !vPos) continue;

      let p1, p2;
      if (uiSettings.layoutMode === "radial") {
        const dx = vPos.x - uPos.x;
        const dy = vPos.y - uPos.y;
        const dist = Math.hypot(dx, dy) || 1;
        // Slight outward radial curve
        const ux = uPos.x === 0 && uPos.y === 0 ? dx / dist : uPos.x / (Math.hypot(uPos.x, uPos.y) || 1);
        const uy = uPos.x === 0 && uPos.y === 0 ? dy / dist : uPos.y / (Math.hypot(uPos.x, uPos.y) || 1);
        p1 = { x: uPos.x + ux * dist * 0.35, y: uPos.y + uy * dist * 0.35 };
        p2 = { x: vPos.x - dx * 0.32, y: vPos.y - dy * 0.32 };
      } else {
        const midY = (uPos.y + vPos.y) / 2;
        p1 = { x: uPos.x, y: midY };
        p2 = { x: vPos.x, y: midY };
      }

      const sampled = sampleCubicBezier(uPos, p1, p2, vPos, 40);
      const fullPath = subPolylinePath(sampled, 0, 1);

      const conduitGroup = makeSvgEl("g", { class: isDimmed(vId) ? "dimmed" : "" });

      // Outer wall (width 9 -> 6px core + 1.5px wall each side)
      conduitGroup.appendChild(makeSvgEl("path", {
        d: fullPath,
        fill: "none",
        stroke: "#8c959f",
        "stroke-width": 9,
        "stroke-linecap": "round"
      }));
      // Hollow inner channel
      conduitGroup.appendChild(makeSvgEl("path", {
        d: fullPath,
        fill: "none",
        stroke: "#ffffff",
        "stroke-width": 6,
        "stroke-linecap": "round"
      }));

      // Map ratio to visible span outside parent/child boxes [0.16 .. 0.84]
      const visStart = 0.16;
      const visEnd = 0.84;
      const r = v.progress;
      const fillColor = v.isBaselineDone ? "#4ac26b" : "#d4a72c";
      const barColor = v.isBaselineDone ? "#116329" : "#7d4e00";

      // If baselineDone and deeper subtopics were appended later, reserve gate at 0.30 of visible span
      let activeRatio = r;
      if (v.isPostBaselineDeepened) {
        activeRatio = 0.30 + 0.70 * r;
      }
      const fillFrac = visStart + activeRatio * (visEnd - visStart);

      if (activeRatio > 0.005) {
        const fillPath = subPolylinePath(sampled, 0, fillFrac);
        conduitGroup.appendChild(makeSvgEl("path", {
          d: fillPath,
          fill: "none",
          stroke: fillColor,
          "stroke-width": 4.6,
          "stroke-linecap": "butt"
        }));
      }

      // Post-Baseline Double-Bar Gate stamped at baseline threshold
      if (v.isPostBaselineDeepened) {
        const gateFrac = visStart + 0.30 * (visEnd - visStart);
        for (const offset of [-0.015, 0.015]) {
          const gp = pointAndTangentAtFraction(sampled, gateFrac + offset);
          const nx = -gp.ty * 8;
          const ny = gp.tx * 8;
          conduitGroup.appendChild(makeSvgEl("line", {
            x1: (gp.x - nx).toFixed(2),
            y1: (gp.y - ny).toFixed(2),
            x2: (gp.x + nx).toFixed(2),
            y2: (gp.y + ny).toFixed(2),
            stroke: "#116329",
            "stroke-width": 2.2
          }));
        }
      }

      // Perpendicular achievement crossbar (14px wide, 2.5px stroke)
      const pt = pointAndTangentAtFraction(sampled, fillFrac);
      const nx = -pt.ty * 7;
      const ny = pt.tx * 7;
      conduitGroup.appendChild(makeSvgEl("line", {
        x1: (pt.x - nx).toFixed(2),
        y1: (pt.y - ny).toFixed(2),
        x2: (pt.x + nx).toFixed(2),
        y2: (pt.y + ny).toFixed(2),
        stroke: barColor,
        "stroke-width": 2.5,
        "stroke-linecap": "square"
      }));

      gConduits.appendChild(conduitGroup);
    }

    /* 2) Cross-Branch Prerequisite Arrows (Contextual for HEAD, plus dimmed MAIN) */
    const targetsToDraw = [];
    if (liveGraph.navigation.MAIN !== liveGraph.navigation.HEAD) {
      targetsToDraw.push({ id: liveGraph.navigation.MAIN, dimmed: true });
    }
    targetsToDraw.push({ id: liveGraph.navigation.HEAD, dimmed: false });

    const seenPairs = new Set();
    for (const { id: targetId, dimmed } of targetsToDraw) {
      const targetNode = liveGraph.nodes.get(targetId);
      if (!targetNode) continue;
      const targetAnchor = findVisibleAnchor(targetId);
      const tPos = targetAnchor.pos;
      if (!tPos) continue;

      targetNode.prereqIds.forEach((pId, idx) => {
        const pairKey = `${pId}->${targetId}`;
        if (seenPairs.has(pairKey)) return;
        seenPairs.add(pairKey);

        const pNode = liveGraph.nodes.get(pId);
        if (!pNode) return;
        const pAnchor = findVisibleAnchor(pId);
        const sPos = pAnchor.pos;
        if (!sPos) return;

        const isDone = pNode.isBaselineDone;
        const dx = tPos.x - sPos.x;
        const dy = tPos.y - sPos.y;
        const dist = Math.hypot(dx, dy) || 1;
        const nx = -dy / dist;
        const ny = dx / dist;
        // Offset curve nicely so multiple arrows separate clearly
        const curveSign = idx % 2 === 0 ? 1 : -1;
        const curveMag = Math.max(48, Math.min(130, dist * 0.22)) + idx * 14;
        const cx = (sPos.x + tPos.x) / 2 + nx * curveMag * curveSign;
        const cy = (sPos.y + tPos.y) / 2 + ny * curveMag * curveSign;

        // Shorten end slightly so arrowhead sits right outside node card
        const endT = Math.max(0.75, 1 - 46 / dist);
        const ex = (1 - endT) * (1 - endT) * sPos.x + 2 * (1 - endT) * endT * cx + endT * endT * tPos.x;
        const ey = (1 - endT) * (1 - endT) * sPos.y + 2 * (1 - endT) * endT * cy + endT * endT * tPos.y;

        const pathD = `M ${sPos.x.toFixed(1)} ${sPos.y.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
        const strokeColor = dimmed ? "#8c959f" : (isDone ? "#116329" : "#a40e26");
        const markerId = dimmed ? "url(#arrow-dim)" : (isDone ? "url(#arrow-dotted-c)" : "url(#arrow-solid-x)");

        const hitGroup = makeSvgEl("g", {
          class: `prereq-hit ${dimmed ? "dimmed" : ""}`,
          style: dimmed ? "opacity: 0.45;" : ""
        });
        // Invisible wide hit area
        hitGroup.appendChild(makeSvgEl("path", {
          d: pathD,
          fill: "none",
          stroke: "transparent",
          "stroke-width": 14
        }));
        const arrowAttrs = {
          d: pathD,
          fill: "none",
          stroke: strokeColor,
          "stroke-width": isDone ? 1.8 : 2.3,
          "marker-end": markerId
        };
        if (isDone) arrowAttrs["stroke-dasharray"] = "5,5";
        hitGroup.appendChild(makeSvgEl("path", arrowAttrs));

        hitGroup.addEventListener("click", (e) => {
          e.stopPropagation();
          detourTo(pId);
        });
        gPrereqs.appendChild(hitGroup);

        // Midpoint directory label pill
        if (!dimmed) {
          const mx = 0.25 * sPos.x + 0.5 * cx + 0.25 * tPos.x;
          const my = 0.25 * sPos.y + 0.5 * cy + 0.25 * tPos.y;
          let dirText = formatTruncatedDirectory(pId, liveGraph.nodes);
          if (pAnchor.proxied) dirText = `↳ ${dirText}`;
          if (dirText.length > 36) dirText = "…" + dirText.slice(-35);
          const pillW = Math.max(96, dirText.length * 6.1 + 18);

          const pillGroup = makeSvgEl("g", { class: "prereq-hit" });
          pillGroup.appendChild(makeSvgEl("rect", {
            class: "prereq-pill-rect",
            x: (mx - pillW / 2).toFixed(1),
            y: (my - 10).toFixed(1),
            width: pillW.toFixed(1),
            height: 20,
            rx: 3,
            fill: isDone ? "#dafbe1" : "#ffebe9",
            stroke: isDone ? "#4ac26b" : "#ff8182",
            "stroke-width": 1.2
          }));
          const pillTxt = makeSvgEl("text", {
            x: mx.toFixed(1),
            y: (my + 3.5).toFixed(1),
            "text-anchor": "middle",
            "font-family": "var(--font-mono)",
            "font-size": 9.5,
            "font-weight": 700,
            fill: isDone ? "#116329" : "#a40e26"
          });
          pillTxt.textContent = dirText;
          pillGroup.appendChild(pillTxt);
          pillGroup.addEventListener("click", (e) => {
            e.stopPropagation();
            detourTo(pId);
          });
          gPills.appendChild(pillGroup);
        }
      });
    }

    /* 3) Leaf Source Clusters around Expanded Leaf / HEAD Nodes */
    for (const vId of visibleNodeIds) {
      if (vId === "knowledge") continue;
      const v = liveGraph.nodes.get(vId);
      if (!v || v.sources.length === 0) continue;
      if (!v.state.expandedOnMap && vId !== liveGraph.navigation.HEAD) continue;
      const pos = layoutPositions.get(vId);
      if (!pos) continue;

      const maxShow = Math.min(3, v.sources.length);
      for (let i = 0; i < maxShow; i++) {
        const src = v.sources[i];
        const done = v.state.completedSourceIds.includes(src.id);
        const angle = (pos.angle || 0) + (i - (maxShow - 1) / 2) * 0.42;
        const sx = pos.x + Math.cos(angle) * 86;
        const sy = pos.y + Math.sin(angle) * 52 + 24;
        const sg = makeSvgEl("g", { class: isDimmed(vId) ? "dimmed" : "" });
        sg.appendChild(makeSvgEl("line", {
          x1: pos.x,
          y1: pos.y + 18,
          x2: sx,
          y2: sy,
          stroke: "#d0d7de",
          "stroke-width": 1,
          "stroke-dasharray": "2,2"
        }));
        const label = (done ? "✓ " : "○ ") + (src.title.length > 22 ? src.title.slice(0, 21) + "…" : src.title);
        const cw = Math.max(70, label.length * 5.6 + 12);
        sg.appendChild(makeSvgEl("rect", {
          x: sx - cw / 2,
          y: sy - 9,
          width: cw,
          height: 18,
          rx: 2,
          fill: done ? "#dafbe1" : "#f1f3f5",
          stroke: done ? "#4ac26b" : "#d0d7de",
          "stroke-width": 1
        }));
        const st = makeSvgEl("text", {
          x: sx,
          y: sy + 3,
          "text-anchor": "middle",
          "font-family": "var(--font-mono)",
          "font-size": 8.5,
          fill: done ? "#116329" : "#59636e"
        });
        st.textContent = label;
        sg.appendChild(st);
        gSources.appendChild(sg);
      }
    }

    /* 4) Topic Vertices (Origin Dot + Branch Cards) */
    for (const id of visibleNodeIds) {
      const n = liveGraph.nodes.get(id);
      const pos = layoutPositions.get(id);
      if (!n || !pos) continue;

      const isMain = id === liveGraph.navigation.MAIN;
      const isHead = id === liveGraph.navigation.HEAD;
      const nodeG = makeSvgEl("g", {
        class: `svg-node ${isDimmed(id) ? "dimmed" : ""}`,
        transform: `translate(${pos.x.toFixed(1)}, ${pos.y.toFixed(1)})`
      });

      if (id === "knowledge") {
        // Concentric Origin Dot (o)
        nodeG.appendChild(makeSvgEl("circle", {
          cx: 0, cy: 0, r: 30,
          fill: "#ffffff",
          stroke: isHead ? "#8250df" : "#1f2328",
          "stroke-width": isHead ? 2.8 : 2
        }));
        nodeG.appendChild(makeSvgEl("circle", {
          cx: 0, cy: 0, r: 21,
          fill: "#f1f3f5",
          stroke: "#8c959f",
          "stroke-width": 1.2
        }));
        nodeG.appendChild(makeSvgEl("circle", {
          cx: 0, cy: 0, r: 5,
          fill: "#1f2328"
        }));
        const lbl = makeSvgEl("text", {
          x: 0, y: 44,
          "text-anchor": "middle",
          "font-family": "var(--font-mono)",
          "font-size": 11,
          "font-weight": 800,
          fill: "#1f2328"
        });
        lbl.textContent = "KNOWLEDGE (ORIGIN)";
        nodeG.appendChild(lbl);
      } else {
        const w = 152;
        const h = 42;
        let fill = "#ffffff";
        let stroke = "#8c959f";
        let strokeW = 1.2;
        let dash = null;

        if (n.isStub) {
          fill = "#eaeef2";
          stroke = "#8c959f";
          dash = "4,3";
        } else if (n.isBaselineDone) {
          fill = "#f6fff8";
          stroke = "#4ac26b";
        } else if (n.isBlocked) {
          fill = "#fff8f7";
          stroke = "#ff8182";
        } else if (n.progress > 0) {
          fill = "#fffdf0";
          stroke = "#d4a72c";
        }

        // MAIN pulsing beacon ring
        if (isMain) {
          nodeG.appendChild(makeSvgEl("rect", {
            x: -w / 2 - 5,
            y: -h / 2 - 5,
            width: w + 10,
            height: h + 10,
            rx: 6,
            fill: "none",
            stroke: "#0969da",
            "stroke-width": 2,
            "stroke-dasharray": "4,3"
          }));
          nodeG.appendChild(makeSvgEl("circle", {
            class: "main-beacon-pulse",
            cx: -w / 2 + 8,
            cy: -h / 2 - 10,
            r: 10,
            fill: "none",
            stroke: "#0969da",
            "stroke-width": 1.8
          }));
        }

        // HEAD active reticle
        if (isHead) {
          nodeG.appendChild(makeSvgEl("rect", {
            x: -w / 2 - 3,
            y: -h / 2 - 3,
            width: w + 6,
            height: h + 6,
            rx: 5,
            fill: "none",
            stroke: "#8250df",
            "stroke-width": 2.2
          }));
        }

        const cardAttrs = {
          class: "node-card",
          x: -w / 2,
          y: -h / 2,
          width: w,
          height: h,
          rx: 4,
          fill,
          stroke,
          "stroke-width": strokeW
        };
        if (dash) cardAttrs["stroke-dasharray"] = dash;
        nodeG.appendChild(makeSvgEl("rect", cardAttrs));

        // Left status indicator bar
        const statusBarColor = n.isStub ? "#57606a"
          : n.isBaselineDone ? "#4ac26b"
          : n.isBlocked ? "#ff8182"
          : n.progress > 0 ? "#d4a72c"
          : "#d0d7de";
        nodeG.appendChild(makeSvgEl("rect", {
          x: -w / 2,
          y: -h / 2,
          width: 4.5,
          height: h,
          rx: 1,
          fill: statusBarColor
        }));

        // Title (truncate cleanly)
        const titleStr = n.title.length > 20 ? n.title.slice(0, 19) + "…" : n.title;
        const txt = makeSvgEl("text", {
          x: -w / 2 + 10,
          y: -3,
          "font-family": "var(--font-mono)",
          "font-size": 10.5,
          "font-weight": 700,
          fill: n.isStub ? "#57606a" : "#1f2328"
        });
        txt.textContent = titleStr;
        nodeG.appendChild(txt);

        // Subline: progress % + status flag
        const pct = Math.round(n.progress * 100);
        const flagStr = n.isStub ? "[STUB]"
          : n.isBaselineDone ? "[C] BASELINE"
          : n.isBlocked ? "[X] BLOCKED"
          : n.progress > 0 ? "[W] ACTIVE"
          : "[ ] READY";
        const subTxt = makeSvgEl("text", {
          x: -w / 2 + 10,
          y: 12,
          "font-family": "var(--font-mono)",
          "font-size": 9,
          "font-weight": 600,
          fill: n.isBaselineDone ? "#116329" : n.isBlocked ? "#a40e26" : "#59636e"
        });
        subTxt.textContent = `${flagStr} · ${pct}%`;
        nodeG.appendChild(subTxt);

        // Locator Badges above node card
        if (isMain || isHead) {
          let bx = -w / 2;
          if (isMain) {
            nodeG.appendChild(makeSvgEl("rect", { x: bx, y: -h / 2 - 17, width: 38, height: 14, rx: 2, fill: "#0969da" }));
            const mt = makeSvgEl("text", { x: bx + 19, y: -h / 2 - 7, "text-anchor": "middle", "font-family": "var(--font-mono)", "font-size": 8.5, "font-weight": 800, fill: "#ffffff" });
            mt.textContent = "MAIN";
            nodeG.appendChild(mt);
            bx += 42;
          }
          if (isHead) {
            nodeG.appendChild(makeSvgEl("rect", { x: bx, y: -h / 2 - 17, width: 38, height: 14, rx: 2, fill: "#8250df" }));
            const ht = makeSvgEl("text", { x: bx + 19, y: -h / 2 - 7, "text-anchor": "middle", "font-family": "var(--font-mono)", "font-size": 8.5, "font-weight": 800, fill: "#ffffff" });
            ht.textContent = "HEAD";
            nodeG.appendChild(ht);
          }
        }

        // Expand / Collapse Badge (+N / -) — does NOT change HEAD
        if (n.childrenIds.length > 0) {
          const isExp = n.state.expandedOnMap;
          const badgeText = isExp ? "−" : `+${n.childrenIds.length}`;
          const bw = isExp ? 18 : Math.max(22, badgeText.length * 6.5 + 8);
          const bg = makeSvgEl("g", { class: "svg-expand-badge" });
          bg.appendChild(makeSvgEl("rect", {
            x: w / 2 - bw - 4,
            y: h / 2 - 9,
            width: bw,
            height: 16,
            rx: 3,
            fill: "#f1f3f5",
            stroke: "#8c959f",
            "stroke-width": 1
          }));
          const bt = makeSvgEl("text", {
            x: w / 2 - bw / 2 - 4,
            y: h / 2 + 2,
            "text-anchor": "middle",
            "font-family": "var(--font-mono)",
            "font-size": 9,
            "font-weight": 800,
            fill: "#1f2328"
          });
          bt.textContent = badgeText;
          bg.appendChild(bt);
          bg.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleNodeExpansion(id);
          });
          nodeG.appendChild(bg);
        }
      }

      // Single Click on Node Body: sets HEAD = id, clears detourStack, toggles expandedOnMap if has children/sources
      nodeG.addEventListener("click", (e) => {
        e.stopPropagation();
        selectNodeFromMap(id);
      });

      gNodes.appendChild(nodeG);
    }
  }

  /* Minimap Rendering & Viewport Rectangle */
  let minimapBounds = { minX: -400, maxX: 400, minY: -300, maxY: 300 };

  function renderMinimap() {
    const svg = document.getElementById("minimapSvg");
    svg.innerHTML = "";
    let minX = -220, maxX = 220, minY = -180, maxY = 180;
    for (const p of layoutPositions.values()) {
      minX = Math.min(minX, p.x - 100);
      maxX = Math.max(maxX, p.x + 100);
      minY = Math.min(minY, p.y - 80);
      maxY = Math.max(maxY, p.y + 80);
    }
    minimapBounds = { minX, maxX, minY, maxY };
    const vw = Math.max(100, maxX - minX);
    const vh = Math.max(100, maxY - minY);
    svg.setAttribute("viewBox", `${minX.toFixed(1)} ${minY.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`);

    // Skeleton edges
    for (const id of visibleNodeIds) {
      if (id === "knowledge") continue;
      const n = liveGraph.nodes.get(id);
      const u = layoutPositions.get(n.parentId);
      const v = layoutPositions.get(id);
      if (!u || !v) continue;
      svg.appendChild(makeSvgEl("line", {
        x1: u.x, y1: u.y, x2: v.x, y2: v.y,
        stroke: n.isBaselineDone ? "#4ac26b" : "#8c959f",
        "stroke-width": Math.max(2, vw * 0.004)
      }));
    }

    // Node dots + beacons
    const dotR = Math.max(5, vw * 0.011);
    for (const id of visibleNodeIds) {
      const p = layoutPositions.get(id);
      if (!p) continue;
      const isMain = id === liveGraph.navigation.MAIN;
      const isHead = id === liveGraph.navigation.HEAD;
      svg.appendChild(makeSvgEl("circle", {
        cx: p.x, cy: p.y,
        r: isMain || isHead ? dotR * 1.45 : dotR,
        fill: isMain ? "#0969da" : isHead ? "#8250df" : (id === "knowledge" ? "#1f2328" : "#59636e")
      }));
      if (isHead) {
        svg.appendChild(makeSvgEl("circle", {
          cx: p.x, cy: p.y,
          r: dotR * 2.4,
          fill: "none",
          stroke: "#8250df",
          "stroke-width": Math.max(2, vw * 0.005)
        }));
      }
    }

    const vpRect = makeSvgEl("rect", {
      id: "minimapViewportRect",
      fill: "rgba(9, 105, 218, 0.10)",
      stroke: "#0969da",
      "stroke-width": Math.max(2.5, vw * 0.006)
    });
    svg.appendChild(vpRect);
    updateMinimapViewport();
  }

  function updateMinimapViewport() {
    const vp = document.getElementById("minimapViewportRect");
    if (!vp) return;
    const canvas = document.getElementById("canvasPane");
    const cw = canvas.clientWidth || 800;
    const ch = canvas.clientHeight || 600;
    const worldLeft = (-cw / 2 - camera.x) / camera.k;
    const worldTop = (-ch / 2 - camera.y) / camera.k;
    const worldW = cw / camera.k;
    const worldH = ch / camera.k;
    vp.setAttribute("x", worldLeft.toFixed(1));
    vp.setAttribute("y", worldTop.toFixed(1));
    vp.setAttribute("width", worldW.toFixed(1));
    vp.setAttribute("height", worldH.toFixed(1));
  }

  /* =========================================================================
   * 9. NAVIGATION STATE MACHINE (MAIN vs HEAD & DETOUR STACK)
   * ========================================================================= */
  function selectNodeFromMap(id) {
    const node = liveGraph.nodes.get(id);
    if (!node) return;
    layer2State.navigation.HEAD = id;
    layer2State.navigation.detourStack = [];
    if (id !== "knowledge" && (node.childrenIds.length > 0 || node.sources.length > 0)) {
      ensureNodeState(id).expandedOnMap = !ensureNodeState(id).expandedOnMap;
    }
    persistAll();
    renderAll();
    gentleCenterIfNearEdge(id);
  }

  function toggleNodeExpansion(id) {
    const st = ensureNodeState(id);
    st.expandedOnMap = !st.expandedOnMap;
    persistAll();
    renderAll();
  }

  function detourTo(prereqId) {
    if (!liveGraph.nodes.has(prereqId)) return;
    const oldHead = liveGraph.navigation.HEAD;
    if (oldHead && oldHead !== prereqId) {
      layer2State.navigation.detourStack.push(oldHead);
    }
    layer2State.navigation.HEAD = prereqId;
    persistAll();
    ensureAncestorsExpanded(prereqId);
    renderAll();
    locateNode(prereqId, 0.96);
  }

  function popDetour() {
    const stack = layer2State.navigation.detourStack;
    if (!stack || stack.length === 0) return;
    const restored = stack.pop();
    layer2State.navigation.HEAD = restored;
    persistAll();
    ensureAncestorsExpanded(restored);
    renderAll();
    locateNode(restored, 0.96);
  }

  function jumpToDetourFrame(index) {
    const stack = layer2State.navigation.detourStack;
    if (index < 0 || index >= stack.length) return;
    const target = stack[index];
    layer2State.navigation.detourStack = stack.slice(0, index);
    layer2State.navigation.HEAD = target;
    persistAll();
    ensureAncestorsExpanded(target);
    renderAll();
    locateNode(target, 0.96);
  }

  function setHeadAsMain() {
    layer2State.navigation.MAIN = layer2State.navigation.HEAD;
    layer2State.navigation.detourStack = [];
    persistAll();
    renderAll();
    showToast("MAIN goal anchored to current HEAD.");
  }

  function ensureNodeState(id) {
    if (!layer2State.nodes[id]) {
      layer2State.nodes[id] = {
        introDone: false,
        baselineDone: false,
        completedSourceIds: [],
        expandedOnMap: false
      };
    }
    return layer2State.nodes[id];
  }

  /* =========================================================================
   * 10. SIDE PANEL (5-STAGE EXECUTION FLOW)
   * ========================================================================= */
  let isEditingHeader = false;
  let prereqSearchQuery = "";
  let lastPrereqCycleDiag = "";

  function renderSidePanel() {
    const side = document.getElementById("sidePane");
    const headId = liveGraph.navigation.HEAD;
    const node = liveGraph.nodes.get(headId);
    if (!node) {
      side.innerHTML = `<div class="box">Topic not found.</div>`;
      return;
    }

    const isMain = headId === liveGraph.navigation.MAIN;
    const stack = liveGraph.navigation.detourStack;
    const pct = Math.round(node.progress * 100);

    let html = "";

    /* 6.1 Top Collapsible Detour Tracker */
    if (stack.length > 0) {
      const chainIds = [...stack, headId];
      const chainHtml = chainIds.map((id, idx) => {
        const n = liveGraph.nodes.get(id);
        const title = escapeHtml(n ? n.title : id);
        if (idx === chainIds.length - 1) {
          return `<span class="detour-current">${title}</span>`;
        }
        return `<span class="detour-link" data-detour-idx="${idx}">${title}</span>`;
      }).join(` <span>→</span> `);

      html += `
        <details open class="audit-drawer detour-drawer">
          <summary>
            <span>DETOUR CALL STACK (Depth: ${stack.length})</span>
            <button type="button" class="btn-xs head-btn" id="btnSideGetBack">← Get Back</button>
          </summary>
          <div class="detour-chain">${chainHtml}</div>
        </details>
      `;
    }

    /* 6.2 Topic Header & Directory Truncation */
    const statusTag = node.isStub
      ? `<span class="tag stub">[STUB NODE]</span>`
      : node.isBaselineDone
        ? `<span class="tag flag-C">[BASELINE DONE]</span>`
        : node.isBlocked
          ? `<span class="tag flag-X">[PREREQ BLOCKED]</span>`
          : `<span class="tag flag-W">[IN PROGRESS]</span>`;
    const overrideTag = liveGraph.overriddenIds.has(headId) ? `<span class="tag edited">[OVERRIDDEN]</span>` : "";

    html += `
      <div class="box">
        <div class="topic-breadcrumb">${escapeHtml(formatTruncatedDirectory(headId, liveGraph.nodes))}</div>
        <div class="topic-title-row">
          <div>
            <div class="topic-title">${escapeHtml(node.title)}</div>
            <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:2px;">id: ${escapeHtml(node.id)}</div>
          </div>
          <div class="list-row-actions">
            ${headId !== "knowledge" ? `<button type="button" class="btn-xs" id="btnToggleEditHeader">${isEditingHeader ? "Cancel" : "Edit"}</button>` : ""}
          </div>
        </div>
        <div class="topic-meta-bar">
          ${statusTag}
          ${overrideTag}
          <span class="tag">${pct}% Conduit</span>
          ${isMain
            ? `<span class="tag" style="background:var(--accent-soft);color:var(--accent);border-color:var(--accent);">[MAIN GOAL ✓]</span>`
            : `<button type="button" class="btn-xs accent-btn" id="btnSetAsMain">${stack.length > 0 ? "Checkout HEAD as MAIN" : "Set as MAIN Goal"}</button>`
          }
        </div>
        <div class="progress-track">
          <div class="progress-fill ${node.isBaselineDone ? "done" : ""}" style="width:${pct}%"></div>
        </div>
        ${isEditingHeader ? renderInlineHeaderEditor(node) : ""}
      </div>
    `;

    /* Module 1: Prerequisites Gate */
    const allPrereqsDone = node.prereqIds.every(pId => {
      const p = liveGraph.nodes.get(pId);
      return p && p.isBaselineDone;
    });
    const gateBadge = node.prereqIds.length === 0
      ? `<span class="tag flag-C">[NO PREREQS]</span>`
      : allPrereqsDone
        ? `<span class="tag flag-C">[GATE OPEN]</span>`
        : `<span class="tag flag-X">[GATE LOCKED]</span>`;

    const prereqRows = node.prereqIds.length === 0
      ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">No cross-branch prerequisites attached.</div>`
      : node.prereqIds.map(pId => {
          const p = liveGraph.nodes.get(pId);
          if (!p) return "";
          const badge = p.isBaselineDone
            ? `<span class="tag flag-C">[DOTTED]</span>`
            : `<span class="tag flag-X">[SOLID]</span>`;
          return `
            <div class="list-row">
              <div class="list-row-left">
                ${badge}
                <div class="list-row-main">
                  <div class="list-row-title">${escapeHtml(p.title)} ${p.isStub ? '<span class="tag stub">[STUB]</span>' : ''}</div>
                  <div class="list-row-sub">${escapeHtml(formatTruncatedDirectory(pId, liveGraph.nodes))}</div>
                </div>
              </div>
              <div class="list-row-actions">
                <button type="button" class="btn-xs head-btn" data-detour-id="${escapeHtml(pId)}">Detour →</button>
                <button type="button" class="btn-xs" data-remove-prereq="${escapeHtml(pId)}" title="Remove prerequisite">✕</button>
              </div>
            </div>
          `;
        }).join("");

    const candidatePrereqs = [...liveGraph.nodes.values()]
      .filter(n => n.id !== headId && n.id !== "knowledge" && !node.prereqIds.includes(n.id))
      .filter(n => !prereqSearchQuery || n.title.toLowerCase().includes(prereqSearchQuery.toLowerCase()) || n.id.toLowerCase().includes(prereqSearchQuery.toLowerCase()))
      .slice(0, 40);

    html += `
      <div class="box">
        <div class="box-header">
          <span class="box-title">1. PREREQUISITES GATE</span>
          ${gateBadge}
        </div>
        <div class="item-list">${prereqRows}</div>
        <div class="inline-add-row">
          <input type="text" id="inputPrereqSearch" placeholder="Filter topic to link..." value="${escapeHtml(prereqSearchQuery)}" style="flex:1 1 110px;">
          <select id="selectPrereqCandidate" style="flex:1.4 1 150px;">
            <option value="">-- Select prerequisite --</option>
            ${candidatePrereqs.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.title)} (${escapeHtml(c.id)})</option>`).join("")}
          </select>
          <button type="button" class="btn-xs" id="btnLinkPrereq">+ Link Prerequisite</button>
        </div>
        ${lastPrereqCycleDiag ? `<div class="diag-warn">${escapeHtml(lastPrereqCycleDiag)}</div>` : ""}
      </div>
    `;

    /* Module 2: Concept Intro & Core Model */
    const introTag = node.state.introDone
      ? `<span class="tag flag-C">[COMPLETED]</span>`
      : `<span class="tag flag-W">[PENDING]</span>`;
    html += `
      <div class="box">
        <div class="box-header">
          <span class="box-title">2. CONCEPT INTRO & CORE MODEL</span>
          ${introTag}
        </div>
        <div class="intro-prose" id="sideIntroProse">
          ${node.isStub && !node.intro
            ? `<em style="color:var(--text-muted);">Ghost/Stub node synthesized from cross-branch link. Click <strong>Edit</strong> above or import an LLM patch to hydrate this concept.</em>`
            : escapeHtml(node.intro || "No concept introduction written yet.").replace(/\n/g, "<br>")
          }
        </div>
        <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-family:var(--font-mono);font-size:11.5px;font-weight:600;">
          <input type="checkbox" id="chkIntroDone" ${node.state.introDone ? "checked" : ""}>
          <span>Complete Intro & Core Vocabulary</span>
        </label>
      </div>
    `;

    /* Module 3: Sources & External Deep-Dive */
    const doneSrcCount = node.sources.filter(s => node.state.completedSourceIds.includes(s.id)).length;
    const srcRows = node.sources.length === 0
      ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">No sources attached yet.</div>`
      : node.sources.map(src => {
          const checked = node.state.completedSourceIds.includes(src.id);
          return `
            <div class="list-row">
              <div class="list-row-left">
                <input type="checkbox" data-source-chk="${escapeHtml(src.id)}" ${checked ? "checked" : ""}>
                <div class="list-row-main">
                  <div class="list-row-title ${checked ? "checked" : ""}">${escapeHtml(src.title)}</div>
                  ${src.url ? `<div class="list-row-sub"><a href="${escapeHtml(src.url)}" target="_blank" rel="noopener">${escapeHtml(src.url)}</a></div>` : ""}
                </div>
              </div>
              <div class="list-row-actions">
                <button type="button" class="btn-xs" data-remove-source="${escapeHtml(src.id)}" title="Remove source">✕</button>
              </div>
            </div>
          `;
        }).join("");

    html += `
      <div class="box">
        <div class="box-header">
          <span class="box-title">3. SOURCES & EXTERNAL DEEP-DIVE</span>
          <span class="tag">${doneSrcCount} / ${node.sources.length}</span>
        </div>
        <div class="item-list">${srcRows}</div>
        <div class="inline-add-row">
          <input type="text" id="inputSourceTitle" placeholder="Source title / book / paper...">
          <input type="text" id="inputSourceUrl" placeholder="URL (optional)">
          <button type="button" class="btn-xs" id="btnAddSource">+ Add Source</button>
        </div>
      </div>
    `;

    /* Module 4: Subtopic Task Checklist (Resolution) */
    const isLearningContainer = !!uiSettings.learnChecklistActive[headId] || node.childrenIds.length > 0;
    const subRows = node.childrenIds.length === 0
      ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">Leaf topic — add deeper subtopics below anytime (even after baseline latch).</div>`
      : node.childrenIds.map(cId => {
          const c = liveGraph.nodes.get(cId);
          if (!c) return "";
          const cpct = Math.round(c.progress * 100);
          return `
            <div class="list-row">
              <div class="list-row-left">
                <input type="checkbox" data-subtopic-chk="${escapeHtml(cId)}" ${c.isBaselineDone ? "checked" : ""} title="Toggle baseline completion">
                <div class="list-row-main">
                  <div class="list-row-title ${c.isBaselineDone ? "checked" : ""}">${escapeHtml(c.title)}</div>
                  <div class="list-row-sub">${cpct}% conduit · ${c.childrenIds.length} subtopics</div>
                </div>
              </div>
              <div class="list-row-actions">
                <button type="button" class="btn-xs head-btn" data-open-subtopic="${escapeHtml(cId)}">Open →</button>
              </div>
            </div>
          `;
        }).join("");

    html += `
      <div class="box">
        <div class="box-header">
          <span class="box-title">4. SUBTOPIC TASK CHECKLIST</span>
          <span class="tag">${node.childrenIds.length} Subtopics</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">
          <button type="button" class="btn-xs ${uiSettings.learnChecklistActive[headId] ? "accent-btn" : ""}" id="btnLearnTopic">
            ${uiSettings.learnChecklistActive[headId] ? "Learning Active ✓" : "Learn This Topic"}
          </button>
          <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);">Resolution depth: ${node.depth}</span>
        </div>
        ${isLearningContainer ? `<div class="item-list">${subRows}</div>` : ""}
        <div class="inline-add-row">
          <input type="text" id="inputSubtopicTitle" placeholder="New subtopic title...">
          <button type="button" class="btn-xs" id="btnAddSubtopic">+ Add Subtopic</button>
        </div>
      </div>
    `;

    /* Module 5: Baseline Latch & LLM Expansion */
    html += `
      <div class="box">
        <div class="box-header">
          <span class="box-title">5. BASELINE LATCH & LLM EXPANSION</span>
          ${node.isBaselineDone ? `<span class="tag flag-C">[LATCHED]</span>` : `<span class="tag flag-W">[UNLATCHED]</span>`}
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
          ${node.isBaselineDone
            ? `<button type="button" class="success-btn" disabled>Baseline Latched ✓</button>`
            : `<button type="button" class="primary" id="btnMarkBaseline">Mark Baseline Completed</button>`
          }
          <button type="button" id="btnCopyLlmSlice">Copy LLM Expansion Context</button>
        </div>
        <div style="font-size:11.5px;color:var(--text-muted);margin-top:8px;">
          ${node.isBaselineDone
            ? "Baseline is permanently latched: all outgoing prerequisite arrows are dotted across the map. You may continue adding deeper subtopics in Module 4 without re-locking downstream topics."
            : "Latching baseline permanently marks this topic's core prerequisite requirement satisfied across all downstream topics."
          }
        </div>
      </div>
    `;

    side.innerHTML = html;
    renderMathInContainer(document.getElementById("sideIntroProse"));
    bindSidePanelEvents(node);
  }

  function renderInlineHeaderEditor(node) {
    return `
      <div class="box inset" style="margin-top:10px;">
        <div style="font-family:var(--font-mono);font-size:10.5px;font-weight:700;margin-bottom:6px;color:var(--text-muted);">EDIT NODE (LAYER 1 OVERRIDE)</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <input type="text" id="editNodeTitle" value="${escapeHtml(node.title)}" placeholder="Title">

  /* 12.1 Frontier Radar (Section 8) */
  function computeUndirectedDistancesToMain(graph) {
    const mainId = graph.navigation.MAIN;
    const dist = new Map([[mainId, 0]]);
    const queue = [mainId];
    while (queue.length > 0) {
      const u = queue.shift();
      const d = dist.get(u);
      const n = graph.nodes.get(u);
      if (!n) continue;
      const neighbors = [];
      if (n.parentId) neighbors.push(n.parentId);
      neighbors.push(...n.childrenIds, ...n.prereqIds, ...n.dependentsIds);
      for (const v of neighbors) {
        if (!dist.has(v)) {
          dist.set(v, d + 1);
          queue.push(v);
        }
      }
    }
    return dist;
  }

  function computeTransitiveBlockedDownstream(graph, startId) {
    // Count how many incomplete nodes have a directed prereq path from startId
    const visited = new Set();
    const queue = [startId];
    let count = 0;
    while (queue.length > 0) {
      const u = queue.shift();
      const n = graph.nodes.get(u);
      if (!n) continue;
      for (const depId of n.dependentsIds) {
        if (!visited.has(depId)) {
          visited.add(depId);
          const dep = graph.nodes.get(depId);
          if (dep && !dep.isBaselineDone) count++;
          queue.push(depId);
        }
      }
    }
    return count;
  }

  function openFrontierRadarModal() {
    const distToMain = computeUndirectedDistancesToMain(liveGraph);
    const allTopics = [...liveGraph.nodes.values()].filter(n => n.id !== "knowledge");

    // 1) Ready Frontier Queue: baselineDone === false AND all prereqs baselineDone === true
    const readyQueue = allTopics
      .filter(n => !n.isBaselineDone && !n.isBlocked)
      .sort((a, b) => {
        const da = distToMain.has(a.id) ? distToMain.get(a.id) : 999;
        const db = distToMain.has(b.id) ? distToMain.get(b.id) : 999;
        if (da !== db) return da - db;
        return a.depth - b.depth;
      });

    // 2) High-Leverage Bottlenecks
    const bottlenecks = allTopics
      .filter(n => !n.isBaselineDone)
      .map(n => ({ node: n, blockingCount: computeTransitiveBlockedDownstream(liveGraph, n.id) }))
      .filter(x => x.blockingCount > 0)
      .sort((a, b) => b.blockingCount - a.blockingCount);

    const readyHtml = readyQueue.slice(0, 18).map(n => `
      <div class="list-row">
        <div class="list-row-left">
          <span class="tag ${n.isStub ? "stub" : "flag-W"}">${n.isStub ? "[STUB]" : "[READY]"}</span>
          <div class="list-row-main">
            <div class="list-row-title">${escapeHtml(n.title)}</div>
            <div class="list-row-sub">${escapeHtml(formatTruncatedDirectory(n.id, liveGraph.nodes))} · ${Math.round(n.progress * 100)}%</div>
          </div>
        </div>
        <button type="button" class="btn-xs head-btn" data-radar-jump="${escapeHtml(n.id)}">Inspect →</button>
      </div>
    `).join("") || `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">All topics have reached baseline mastery!</div>`;

    const bottleHtml = bottlenecks.slice(0, 12).map(({ node: n, blockingCount }) => `
      <div class="list-row">
        <div class="list-row-left">
          <span class="tag flag-X">UNBLOCKS ${blockingCount}</span>
          <div class="list-row-main">
            <div class="list-row-title">${escapeHtml(n.title)}</div>
            <div class="list-row-sub">${escapeHtml(formatTruncatedDirectory(n.id, liveGraph.nodes))}</div>
          </div>
        </div>
        <button type="button" class="btn-xs head-btn" data-radar-jump="${escapeHtml(n.id)}">Inspect →</button>
      </div>
    `).join("") || `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">No downstream bottlenecks remaining.</div>`;

    openModal("FRONTIER RADAR // TOPOLOGICAL LEARNING ASSISTANT", `
      <div class="box">
        <div class="box-header">
          <span class="box-title">ACTIVE MAIN DEPENDENCY SUBGRAPH FILTER</span>
          <span class="tag ${uiSettings.spotlightMain ? "edited" : ""}">${uiSettings.spotlightMain ? "[SPOTLIGHT ON]" : "[OFF]"}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
          <span style="font-size:12px;color:var(--text-muted);">Dim unrelated branches on the map and spotlight only the ancestor chain and prerequisite tree feeding into <strong>${escapeHtml(liveGraph.nodes.get(liveGraph.navigation.MAIN)?.title || "")}</strong>.</span>
          <button type="button" class="accent-btn" id="btnToggleSpotlightModal">${uiSettings.spotlightMain ? "Disable Spotlight" : "Spotlight MAIN Subgraph"}</button>
        </div>
      </div>

      <div class="box">
        <div class="box-header">
          <span class="box-title">1. READY FRONTIER QUEUE (UNLOCKED NEXT STEPS)</span>
          <span class="tag flag-C">${readyQueue.length} Unlocked</span>
        </div>
        <div class="item-list">${readyHtml}</div>
      </div>

      <div class="box">
        <div class="box-header">
          <span class="box-title">2. HIGH-LEVERAGE BOTTLENECKS</span>
          <span class="tag flag-X">${bottlenecks.length} Blocking</span>
        </div>
        <div class="item-list">${bottleHtml}</div>
      </div>
    `);

    document.getElementById("btnToggleSpotlightModal").addEventListener("click", () => {
      uiSettings.spotlightMain = !uiSettings.spotlightMain;
      persistAll();
      renderAll();

  function openImportPatchModal() {
    openModal("+ IMPORT LAYER 0 DELTA PATCH", `

          <button type="button" id="btnPreviewPatch">Validate & Preview</button>
          <button type="button" class="primary" id="btnMergePatch">Merge into Layer 0</button>
        </div>
        <div id="patchDiagOutput"></div>
      </div>
    `);

    document.getElementById("patchFileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { document.getElementById("patchJsonInput").value = reader.result; };
      reader.readAsText(file);
    });

    document.getElementById("btnLoadSamplePatch").addEventListener("click", () => {
      document.getElementById("patchJsonInput").value = JSON.stringify({
        patch_id: "002_topology_hydration",
        extensions: [
          {
            targetId: "math.graph_theory.planar_graphs",
            addSources: [{ id: "src_kuratowski_notes", title: "Kuratowski & Wagner Minor Notes" }]
          }
        ],
        nodes: [
          {
            id: "math.topology",
            title: "Topology",
            parentId: "math",
            prereqIds: [],
            intro: "Continuous deformations, open sets, compactness, and connectedness.",
            sources: [{ id: "src_munkres", title: "Munkres — Topology" }]
          },
          {
            id: "math.topology.point_set_basics",
            title: "Point-Set Topology Basics",
            parentId: "math.topology",
            prereqIds: [],
            intro: "Metric & topological spaces, Hausdorff separation, and Jordan Curve Theorem.",
            sources: [{ id: "src_munkres_ch2", title: "Munkres Ch. 2–3" }]
          }
        ]
      }, null, 2);
    });

    function parseAndValidatePatch() {
      const diag = document.getElementById("patchDiagOutput");
      let parsed;
      try {
        parsed = JSON.parse(document.getElementById("patchJsonInput").value);
      } catch (err) {
        diag.innerHTML = `<div class="diag-warn">JSON Parse Error: ${escapeHtml(err.message)}</div>`;
        return null;
      }
      if (!parsed || typeof parsed !== "object" || (!Array.isArray(parsed.nodes) && !Array.isArray(parsed.extensions))) {
        diag.innerHTML = `<div class="diag-warn">Schema Error: Patch must contain a "nodes" array and/or "extensions" array.</div>`;
        return null;
      }

      const testPatches = [...layer0Patches, parsed];
      const { map: mergedMap } = foldLayer0And1(testPatches, layer1Overrides);
      const cycle = validateFullDagAcyclicity(mergedMap);
      if (cycle) {
        diag.innerHTML = `<div class="diag-warn">Acyclicity Violation: Patch introduces a prerequisite cycle: ${escapeHtml(cycle.join(" → "))}</div>`;
        return null;
      }

      const newNodes = (parsed.nodes || []).filter(n => !liveGraph.nodes.has(n.id));
      const hydratedStubs = (parsed.nodes || []).filter(n => liveGraph.nodes.get(n.id)?.isStub);
      const extCount = (parsed.extensions || []).length;

      diag.innerHTML = `<div class="diag-info">VALID DAG PATCH: +${newNodes.length} new nodes, ${hydratedStubs.length} stub(s) hydrated, ${extCount} extension(s). Zero prerequisite cycles detected.</div>`;
      return parsed;
    }

    document.getElementById("btnPreviewPatch").addEventListener("click", parseAndValidatePatch);
    document.getElementById("btnMergePatch").addEventListener("click", () => {
      const parsed = parseAndValidatePatch();
      if (!parsed) return;
      const existingIdx = parsed.patch_id ? layer0Patches.findIndex(p => p.patch_id === parsed.patch_id) : -1;
      if (existingIdx >= 0) {
        layer0Patches[existingIdx] = parsed;
      } else {
        layer0Patches.push(parsed);
      }
      persistAll();
      renderAll();
      closeModal();
      showToast(`Merged patch "${parsed.patch_id || "custom"}" into Layer 0.`);
    });
  }
