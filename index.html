        </div>
        <div id="patchDiagOutput"></div>
      </div>
    `);

    document.getElementById("patchFileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { document.getElementById("patchJsonInput").value = reader.result; };
      reader.readAsText(file);
    });

    function parseAndValidatePatch() {
      const diag = document.getElementById("patchDiagOutput");
      let parsed;
      try {
        parsed = JSON.parse(document.getElementById("patchJsonInput").value);
      } catch (err) {
        diag.innerHTML = `<div class="diag-warn">JSON Syntax Error: ${escapeHtml(err.message)}</div>`;
        return null;
      }
      if (!parsed || typeof parsed !== "object" || (!Array.isArray(parsed.nodes) && !Array.isArray(parsed.extensions))) {
        diag.innerHTML = `<div class="diag-warn">Invalid Format: Must include "nodes" or "extensions" array.</div>`;
        return null;
      }

      const testPatches = [...layer0Patches, parsed];
      const { map: mergedMap } = foldLayer0And1(testPatches, layer1Overrides);
      const cycle = validateFullDagAcyclicity(mergedMap);
      if (cycle) {
        diag.innerHTML = `<div class="diag-warn">Acyclicity Error: Introduces dependency loop: ${escapeHtml(cycle.join(" -> "))}</div>`;
        return null;
      }

      const newNodes = (parsed.nodes || []).filter(n => !liveGraph.nodes.has(n.id));
      diag.innerHTML = `<div class="diag-info">Valid curriculum patch. +${newNodes.length} new topics detected with zero cycles.</div>`;
      return parsed;
    }

    document.getElementById("btnPreviewPatch").addEventListener("click", parseAndValidatePatch);
    document.getElementById("btnMergePatch").addEventListener("click", () => {
      const parsed = parseAndValidatePatch();
      if (!parsed) return;
      layer0Patches.push(parsed);
      persistAll();
      renderAll();
      closeModal();
      showToast(`Imported patch "${parsed.patch_id || "custom"}".`);
    });
  }

  function downloadJson(filename, obj) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

    const canvasPane = document.getElementById("canvasPane");

    let isMousePanning = false;
    let panStart = { x: 0, y: 0, camX: 0, camY: 0 };

    svg.addEventListener("mousedown", (e) => {
      if (e.button !== 0 && e.button !== 1) return;
      cancelCameraAnim();
      isMousePanning = true;
      svg.classList.add("panning");
      panStart = { x: e.clientX, y: e.clientY, camX: camera.x, camY: camera.y };
    });

    window.addEventListener("mousemove", (e) => {
      if (!isMousePanning) return;
      const dx = e.clientX - panStart.x;
      const dy = e.clientY - panStart.y;
      camera.x = panStart.camX + dx;
      camera.y = panStart.camY + dy;
      applyWorldTransform();
    });

    window.addEventListener("mouseup", () => {
      if (!isMousePanning) return;
      isMousePanning = false;
      svg.classList.remove("panning");
    });

    canvasPane.addEventListener("wheel", (e) => {
      e.preventDefault();
      cancelCameraAnim();

      if (e.ctrlKey || e.metaKey || uiSettings.wheelMode === "zoom") {
        const rect = canvasPane.getBoundingClientRect();
        const mx = e.clientX - rect.left - rect.width / 2;
        const my = e.clientY - rect.top - rect.height / 2;
        const worldX = (mx - camera.x) / camera.k;
        const worldY = (my - camera.y) / camera.k;
        const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
        const nextK = Math.max(0.2, Math.min(2.8, camera.k * factor));
        camera.k = nextK;
        camera.x = mx - worldX * nextK;
        camera.y = my - worldY * nextK;
      } else {
        camera.x -= e.deltaX;
        camera.y -= e.deltaY;
      }
      applyWorldTransform();
    }, { passive: false });

    let touchState = {
      active: false,
      mode: null,
      startX: 0,
      startY: 0,
      camStartX: 0,
      camStartY: 0,
      startDist: 0,
      startK: 1
    };

    canvasPane.addEventListener("touchstart", (e) => {
      cancelCameraAnim();
      if (e.touches.length === 1) {
        touchState.active = true;
        touchState.mode = "pan";
        touchState.startX = e.touches[0].clientX;
        touchState.startY = e.touches[0].clientY;
        touchState.camStartX = camera.x;
        touchState.camStartY = camera.y;
      } else if (e.touches.length >= 2) {
        touchState.active = true;
        touchState.mode = "pinch";
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchState.startDist = Math.hypot(dx, dy) || 1;
        touchState.startK = camera.k;
      }
    }, { passive: true });

    canvasPane.addEventListener("touchmove", (e) => {
      if (!touchState.active) return;
      if (touchState.mode === "pan" && e.touches.length === 1) {
        const dx = e.touches[0].clientX - touchState.startX;
        const dy = e.touches[0].clientY - touchState.startY;
        camera.x = touchState.camStartX + dx;
        camera.y = touchState.camStartY + dy;
        applyWorldTransform();
      } else if (touchState.mode === "pinch" && e.touches.length >= 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy) || 1;
        const scale = dist / touchState.startDist;
        camera.k = Math.max(0.2, Math.min(2.8, touchState.startK * scale));
        applyWorldTransform();
      }
    }, { passive: true });

    canvasPane.addEventListener("touchend", () => {
      touchState.active = false;
      touchState.mode = null;
    });

    const miniSvg = document.getElementById("minimapSvg");
    let miniDragging = false;
    function panFromMinimapEvent(e) {
      const rect = miniSvg.getBoundingClientRect();
      const rx = (e.clientX - rect.left) / Math.max(1, rect.width);
      const ry = (e.clientY - rect.top) / Math.max(1, rect.height);
      const wx = minimapBounds.minX + rx * (minimapBounds.maxX - minimapBounds.minX);
      const wy = minimapBounds.minY + ry * (minimapBounds.maxY - minimapBounds.minY);
      cancelCameraAnim();
      camera.x = -wx * camera.k;
      camera.y = -wy * camera.k;
      applyWorldTransform();
    }
    miniSvg.addEventListener("mousedown", (e) => { miniDragging = true; panFromMinimapEvent(e); });
    window.addEventListener("mousemove", (e) => { if (miniDragging) panFromMinimapEvent(e); });
    window.addEventListener("mouseup", () => { miniDragging = false; });

    document.getElementById("btnToggleMinimap").addEventListener("click", () => {
      uiSettings.minimapMinimized = !uiSettings.minimapMinimized;
      document.getElementById("minimapWrap").classList.toggle("minimized", uiSettings.minimapMinimized);
      document.getElementById("btnToggleMinimap").textContent = uiSettings.minimapMinimized ? "+" : "-";
      persistAll();
    });
    if (uiSettings.minimapMinimized) {
      document.getElementById("minimapWrap").classList.add("minimized");
      document.getElementById("btnToggleMinimap").textContent = "+";
    }

    const splitter = document.getElementById("splitter");
    const sidePane = document.getElementById("sidePane");
    if (uiSettings.sidePaneWidth) sidePane.style.width = uiSettings.sidePaneWidth + "px";
    let splitDragging = false;

    splitter.addEventListener("mousedown", () => {
      splitDragging = true;
      splitter.classList.add("dragging");
    });
    window.addEventListener("mousemove", (e) => {
      if (!splitDragging) return;
      const totalW = document.getElementById("workspace").clientWidth;
      const newSideW = Math.max(300, Math.min(totalW - 320, totalW - e.clientX));
      sidePane.style.width = newSideW + "px";
      uiSettings.sidePaneWidth = newSideW;
      applyWorldTransform();
    });
    window.addEventListener("mouseup", () => {
      if (!splitDragging) return;
      splitDragging = false;
      splitter.classList.remove("dragging");
      persistAll();
    });

    document.getElementById("btnLocateMain").addEventListener("click", () => locateNode(liveGraph.navigation.MAIN, 0.98));
    document.getElementById("btnLocateHead").addEventListener("click", () => locateNode(liveGraph.navigation.HEAD, 0.98));
    document.getElementById("btnNewTopicTop").addEventListener("click", () => openNewTopicModal());
    document.getElementById("btnFloatingGetBack").addEventListener("click", popDetour);

    document.getElementById("btnToggleLayout").addEventListener("click", () => {
      uiSettings.layoutMode = uiSettings.layoutMode === "tree" ? "radial" : "tree";
      persistAll();
      renderAll();
      fitVisibleGraph();
    });

    document.getElementById("btnFrontierRadar").addEventListener("click", openFrontierRadarModal);
    document.getElementById("btnImportPatch").addEventListener("click", openImportPatchModal);
    document.getElementById("btnLayerInspector").addEventListener("click", openLayerInspectorModal);
    document.getElementById("btnManual").addEventListener("click", openManualModal);
    document.getElementById("btnCloseModal").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target === document.getElementById("modalBackdrop")) closeModal();
    });

    document.getElementById("btnPanLeft").addEventListener("click", () => panCameraBy(130, 0));
    document.getElementById("btnPanRight").addEventListener("click", () => panCameraBy(-130, 0));
    document.getElementById("btnPanUp").addEventListener("click", () => panCameraBy(0, 130));
    document.getElementById("btnPanDown").addEventListener("click", () => panCameraBy(0, -130));

    document.getElementById("btnZoomIn").addEventListener("click", () => {
      cancelCameraAnim();
      camera.k = Math.min(2.8, camera.k * 1.18);
      applyWorldTransform();
    });
    document.getElementById("btnZoomOut").addEventListener("click", () => {
      cancelCameraAnim();
      camera.k = Math.max(0.2, camera.k / 1.18);
      applyWorldTransform();
    });
    document.getElementById("btnFitMap").addEventListener("click", fitVisibleGraph);

    document.getElementById("btnToggleWheelMode").addEventListener("click", () => {
      uiSettings.wheelMode = uiSettings.wheelMode === "scroll" ? "zoom" : "scroll";
      document.getElementById("btnToggleWheelMode").textContent = uiSettings.wheelMode === "scroll" ? "Wheel: Scroll" : "Wheel: Zoom";
      persistAll();
    });
    document.getElementById("btnToggleWheelMode").textContent = uiSettings.wheelMode === "scroll" ? "Wheel: Scroll" : "Wheel: Zoom";

    document.getElementById("btnExpandAll").addEventListener("click", () => {
      for (const n of liveGraph.nodes.values()) {
        if (n.childrenIds.length > 0) ensureNodeState(n.id).expandedOnMap = true;
      }
      persistAll();
      renderAll();
      fitVisibleGraph();
    });
    document.getElementById("btnCollapseDomains").addEventListener("click", () => {
      for (const n of liveGraph.nodes.values()) {
        ensureNodeState(n.id).expandedOnMap = (n.id === "knowledge");
      }
      persistAll();
      renderAll();
      fitVisibleGraph();
    });
    document.getElementById("btnClearSpotlight").addEventListener("click", () => {
      uiSettings.spotlightMain = false;
      persistAll();
      renderAll();
    });

    window.addEventListener("keydown", (e) => {
      const tag = (document.activeElement?.tagName || "").toLowerCase();
      const inInput = tag === "input" || tag === "textarea" || tag === "select";
      if (e.key === "Escape") {
        if (document.getElementById("modalBackdrop").classList.contains("open")) {
          closeModal();
        } else if (!inInput && liveGraph.navigation.detourStack.length > 0) {
          popDetour();
        }
        return;
      }
      if (inInput) return;
      if (e.key === "m" || e.key === "M") locateNode(liveGraph.navigation.MAIN, 0.98);
      if (e.key === "h" || e.key === "H") locateNode(liveGraph.navigation.HEAD, 0.98);
    });

    window.addEventListener("resize", applyWorldTransform);
  }

  /* =========================================================================
   * 12. INITIALIZATION
   * ========================================================================= */
  setupInteractions();
  renderAll();

  requestAnimationFrame(() => {
    fitVisibleGraph();
  });

  window.addEventListener("load", () => {
    renderMathInContainer(document.getElementById("sidePane"));
  });

  window.polymathy = {
    state: liveGraph,
    computeLayout,
    SEED_PATCH_001
  };
})();
</script>
</body>
</html>
