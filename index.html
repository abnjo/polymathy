<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>POLYMATHY // Knowledge Graph & Learning Assistant</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root {
  /* Surfaces & Ink (STEM Monograph Aesthetic, No Blur, Crisp 1px Borders) */
  --bg: #f8f9fa;
  --bg-alt: #f1f3f5;
  --surface: #ffffff;
  --surface-hover: #f4f6f8;
  --border: #d0d7de;
  --border-strong: #8c959f;
  --border-dark: #1f2328;

  /* Typography */
  --text: #1f2328;
  --text-muted: #59636e;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Semantic Status Colors (Human-readable, No Cryptic Letter Flags) */
  --accent: #0969da;
  --accent-soft: #ddf4ff;
  --head-color: #8250df;
  --head-soft: #fbefff;

  --status-done-bg: #dafbe1;
  --status-done-text: #116329;
  --status-done-border: #4ac26b;

  --status-active-bg: #fff8c5;
  --status-active-text: #7d4e00;
  --status-active-border: #d4a72c;

  --status-needed-bg: #ffebe9;
  --status-needed-text: #a40e26;
  --status-needed-border: #ff8182;

  --status-ready-bg: #ddf4ff;
  --status-ready-text: #0969da;
  --status-ready-border: #54aeff;

  --status-draft-bg: #eaeef2;
  --status-draft-text: #57606a;
  --status-draft-border: #8c959f;

  --shadow-sm: 0 1px 2px rgba(31, 35, 40, 0.06);
  --shadow-md: 0 4px 10px rgba(31, 35, 40, 0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.48;
  display: flex;
  flex-direction: column;
}

/* Form & Button Primitives */
button, input, select, textarea {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  padding: 4px 8px;
  outline: none;
}
button {
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: background 0.1s ease, border-color 0.1s ease, transform 0.06s ease;
}
button:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--border-dark); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}
button.primary:hover:not(:disabled) { background: #32383f; }
button.accent-btn {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}
button.accent-btn:hover:not(:disabled) { background: #cbe8ff; }
button.head-btn {
  background: var(--head-soft);
  color: var(--head-color);
  border-color: var(--head-color);
}
button.head-btn:hover:not(:disabled) { background: #f3dcff; }
button.success-btn {
  background: var(--status-done-bg);
  color: var(--status-done-text);
  border-color: var(--status-done-border);
}
button.danger-btn {
  background: var(--status-needed-bg);
  color: var(--status-needed-text);
  border-color: var(--status-needed-border);
}
button.btn-xs { padding: 2px 7px; font-size: 11px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { font-family: var(--font-sans); resize: vertical; }

/* Top Telemetry & Locator Bar */
.topbar {
  height: 46px;
  min-height: 46px;
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1.5px solid var(--border-dark);
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  z-index: 30;
  overflow-x: auto;
}
.topbar-left, .topbar-center, .topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.brand {
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}
.telemetry-pill {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 3px 8px;
  color: var(--text-muted);
}
.locator-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 7px;
  border-radius: 3px;
  border: 1px solid;
  font-family: var(--font-mono);
  font-size: 11px;
  max-width: 260px;
}
.locator-chip.main {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.locator-chip.head {
  background: var(--head-soft);
  border-color: var(--head-color);
  color: var(--head-color);
}
.locator-label {
  font-weight: 800;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.locator-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  font-weight: 600;
}

/* Main Workspace Split */
.workspace {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  position: relative;
  overflow: hidden;
}
.canvas-pane {
  flex: 1 1 66%;
  min-width: 320px;
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 22px 22px;
  user-select: none;
  touch-action: none;
}
.splitter {
  width: 5px;
  flex-shrink: 0;
  background: var(--bg-alt);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  cursor: col-resize;
  transition: background 0.12s;
  z-index: 20;
}
.splitter:hover, .splitter.dragging { background: var(--accent); }

.side-pane {
  width: 34%;
  min-width: 340px;
  max-width: 680px;
  flex-shrink: 0;
  background: var(--bg);
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* SVG Map Canvas & Overlays */
#dagSvg {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
}
#dagSvg.panning { cursor: grabbing; }

.detour-banner {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 15;
  display: none;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1.5px solid var(--head-color);
  border-radius: 4px;
  padding: 5px 11px;
  box-shadow: var(--shadow-md);
  font-family: var(--font-mono);
  font-size: 11.5px;
}
.detour-banner.visible { display: flex; }

.canvas-hud-bottom {
  position: absolute;
  bottom: 12px;
  left: 12px;
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.hud-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
}
.hud-hint-pill {
  font-family: var(--font-sans);
  font-size: 11px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 8px;
}

.minimap-wrap {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 184px;
  background: rgba(255, 255, 255, 0.95);
  border: 1.5px solid var(--border-dark);
  border-radius: 4px;
  box-shadow: var(--shadow-md);
  z-index: 15;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: height 0.15s ease;
}
.minimap-wrap.minimized {
  width: 110px;
}
.minimap-wrap.minimized #minimapSvg {
  display: none;
}
.minimap-header {
  height: 22px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  padding: 0 6px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#minimapSvg {
  width: 100%;
  height: 120px;
  display: block;
  cursor: crosshair;
}

/* Primitives & Boxes */
.box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.box.inset {
  background: var(--bg-alt);
  padding: 9px 11px;
  margin-bottom: 8px;
  box-shadow: none;
}
.box-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 8px;
  gap: 8px;
}
.box-title {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  text-transform: uppercase;
}
.section-hint {
  font-size: 11.5px;
  color: var(--text-muted);
  margin-bottom: 9px;
  line-height: 1.4;
}

/* Clear Semantic Tags (No Emojis) */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--bg-alt);
  color: var(--text-muted);
  line-height: 1.2;
  white-space: nowrap;
}
.tag.done {
  background: var(--status-done-bg);
  color: var(--status-done-text);
  border-color: var(--status-done-border);
}
.tag.active {
  background: var(--status-active-bg);
  color: var(--status-active-text);
  border-color: var(--status-active-border);
}
.tag.needed {
  background: var(--status-needed-bg);
  color: var(--status-needed-text);
  border-color: var(--status-needed-border);
}
.tag.ready {
  background: var(--status-ready-bg);
  color: var(--status-ready-text);
  border-color: var(--status-ready-border);
}
.tag.draft {
  background: var(--status-draft-bg);
  color: var(--status-draft-text);
  border-color: var(--status-draft-border);
  border-style: dashed;
}
.tag.edited {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}
.tag.head-tag {
  background: var(--head-soft);
  color: var(--head-color);
  border-color: var(--head-color);
}

/* Detour Drawer */
details.audit-drawer {
  border: 1.5px solid var(--border-dark);
  border-radius: 4px;
  background: var(--bg-alt);
  padding: 8px 11px;
  margin-bottom: 12px;
}
details.audit-drawer.detour-drawer {
  border-color: var(--head-color);
  background: var(--head-soft);
}
details.audit-drawer summary {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.04em;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  list-style: none;
}
details.audit-drawer summary::-webkit-details-marker { display: none; }
details.audit-drawer[open] summary {
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 8px;
}

.detour-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.5;
}
.detour-link {
  color: var(--head-color);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
  font-weight: 600;
}
.detour-link:hover { background: rgba(130, 80, 223, 0.14); }
.detour-current {
  font-weight: 800;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--head-color);
  border-radius: 3px;
  padding: 1px 5px;
}

/* Side Panel Layout */
.topic-breadcrumb {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
  word-break: break-word;
}
.topic-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.topic-title {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 800;
  line-height: 1.25;
  color: var(--text);
}
.topic-meta-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.progress-track {
  width: 100%;
  height: 8px;
  background: var(--bg-alt);
  border: 1px solid var(--border-strong);
  border-radius: 2px;
  overflow: hidden;
  margin: 8px 0 4px 0;
}
.progress-fill {
  height: 100%;
  background: var(--status-active-border);
  transition: width 0.2s ease;
}
.progress-fill.done { background: var(--status-done-border); }

.item-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.list-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 8px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 3px;
}
.list-row-left {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  min-width: 0;
  flex: 1 1 auto;
}
.list-row-left input[type="checkbox"] {
  margin-top: 2px;
  flex-shrink: 0;
  width: 14px;
  height: 14px;
  accent-color: var(--accent);
  cursor: pointer;
}
.list-row-main {
  min-width: 0;
  flex: 1 1 auto;
}
.list-row-title {
  font-weight: 600;
  font-size: 12.5px;
  color: var(--text);
  word-break: break-word;
}
.list-row-title.checked {
  text-decoration: line-through;
  color: var(--text-muted);
}
.list-row-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 1px;
  word-break: break-all;
}
.list-row-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.intro-prose {
  font-size: 13px;
  line-height: 1.55;
  color: var(--text);
  margin-bottom: 10px;
  padding: 8px 10px;
  background: var(--bg-alt);
  border-left: 3px solid var(--border-strong);
  border-radius: 2px;
}
.inline-add-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.inline-add-row input {
  flex: 1 1 140px;
  min-width: 0;
}
.diag-warn {
  margin-top: 8px;
  padding: 7px 9px;
  background: var(--status-needed-bg);
  border: 1px solid var(--status-needed-border);
  color: var(--status-needed-text);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.diag-info {
  margin-top: 8px;
  padding: 7px 9px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
}

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(31, 35, 40, 0.48);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1.5px solid var(--border-dark);
  border-radius: 5px;
  width: 100%;
  max-width: 780px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-md);
}
.modal-head {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.04em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-body {
  padding: 14px;
  overflow-y: auto;
  flex: 1 1 auto;
}

/* Manual Tabs */
.manual-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1.5px solid var(--border-dark);
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.manual-tab-btn {
  border-bottom: none;
  border-radius: 3px 3px 0 0;
  background: var(--bg-alt);
  color: var(--text-muted);
  padding: 5px 10px;
  font-size: 11px;
}
.manual-tab-btn.active {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}
.manual-tab-panel { display: none; }
.manual-tab-panel.active { display: block; }

table.spec-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin: 8px 0;
}
table.spec-table th, table.spec-table td {
  border: 1px solid var(--border);
  padding: 6px 8px;
  text-align: left;
  vertical-align: top;
}
table.spec-table th {
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-size: 11px;
}
pre.code-block {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 9px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
code.inline {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1px 4px;
}

/* SVG Interactive Elements */
.svg-node { cursor: pointer; }
.svg-node:hover .node-card { stroke: var(--text); stroke-width: 1.8px; }
.svg-expand-badge { cursor: pointer; }
.svg-expand-badge:hover rect { fill: var(--text); }
.svg-expand-badge:hover text { fill: var(--surface); }
.prereq-arrow-hit { cursor: pointer; }
.prereq-arrow-hit:hover path.visible-arrow { stroke-width: 3.2px; filter: drop-shadow(0 0 3px rgba(0,0,0,0.25)); }
.dimmed { opacity: 0.18; transition: opacity 0.15s; }

@keyframes mainPulse {
  0%, 100% { stroke-opacity: 0.95; r: 10; }
  50% { stroke-opacity: 0.25; r: 14; }
}
.main-beacon-pulse { animation: mainPulse 2s ease-in-out infinite; }

.toast {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 200;
  background: var(--text);
  color: var(--surface);
  font-family: var(--font-mono);
  font-size: 11.5px;
  padding: 7px 12px;
  border-radius: 4px;
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transform: translateY(6px);
  transition: opacity 0.18s, transform 0.18s;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 900px) {
  .workspace { flex-direction: column; }
  .canvas-pane { flex: 1 1 50%; min-width: 0; }
  .splitter { width: 100%; height: 5px; cursor: row-resize; border: none; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .side-pane { width: 100% !important; max-width: none; min-width: 0; flex: 1 1 50%; }
  .minimap-wrap { width: 130px; }
  #minimapSvg { height: 90px; }
}
</style>
</head>
<body>

<!-- TOP TELEMETRY & LOCATOR BAR -->
<header class="topbar">
  <div class="topbar-left">
    <div class="brand">
      <span>POLYMATHY</span>
    </div>
    <span class="telemetry-pill" id="globalProgressPill" title="Mastered topics / Total topics">Completed: 0 / 0</span>
  </div>

  <div class="topbar-center">
    <div class="locator-chip main" title="Your main study target. Always highlighted on the map.">
      <span class="locator-label">MAIN:</span>
      <span class="locator-title" id="topMainTitle">Loading...</span>
      <button class="btn-xs accent-btn" id="btnLocateMain" title="Center camera on your MAIN goal (HotKey: M)">Locate</button>
    </div>
    <div class="locator-chip head" title="The topic currently open in the side panel.">
      <span class="locator-label">HEAD:</span>

  function safeReadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return structuredClone(fallback);
      return JSON.parse(raw);
    } catch {
      return structuredClone(fallback);
    }
  }

  function safeWriteJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch { /* Ignore storage quota limits in private mode */ }
  }
