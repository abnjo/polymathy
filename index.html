            <div class="list-row-sub">${(p.nodes || []).length} nodes · ${(p.extensions || []).length} extensions</div>
          </div>
        </div>
      </div>
    `).join("");

    const overriddenRows = [...liveGraph.overriddenIds].map(id => {
      const n = liveGraph.nodes.get(id);
      return `
        <div class="list-row">
          <div class="list-row-left">
            <span class="tag edited">[L1]</span>
            <div class="list-row-main">
              <div class="list-row-title">${escapeHtml(n ? n.title : id)}</div>
              <div class="list-row-sub">${escapeHtml(id)}</div>
            </div>
          </div>
          <button type="button" class="btn-xs" data-revert-override="${escapeHtml(id)}">Revert to Layer 0</button>
        </div>
      `;
    }).join("") || `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">No active Layer 1 UI overrides.</div>`;

    openModal("LAYER INSPECTOR // 3-LAYER OVERLAYFS", `
      <div class="box">
        <div class="box-header">
          <span class="box-title">LAYER 0 — APPEND-ONLY CURRICULUM PATCHES</span>
          <span class="tag">${layer0Patches.length} Patches</span>
        </div>
        <div class="item-list">${patchRows}</div>
      </div>

      <div class="box">
        <div class="box-header">
          <span class="box-title">LAYER 1 — USER UI OVERRIDES (2P-SET DELTAS)</span>
          <span class="tag edited">${customCount} custom · ${fieldCount} fields · ${edgeCount} edges · ${tombCount} tombstones</span>
        </div>
        <div class="item-list" style="margin-bottom:10px;">${overriddenRows}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="accent-btn" id="btnSquashOverrides" ${liveGraph.overriddenIds.size === 0 && tombCount === 0 ? "disabled" : ""}>Squash Layer 1 → Layer 0 Patch</button>
          <button type="button" class="danger-btn" id="btnClearLayer1">Clear All Layer 1 Overrides</button>
        </div>
      </div>

      <div class="box">
        <div class="box-header">
          <span class="box-title">BACKUP, PORTABILITY & RECOVERY</span>
          <span class="tag">[JSON]</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
          <button type="button" id="btnExportBundle">Export Full Bundle (.json)</button>
          <button type="button" id="btnExportState">Export Layer 2 state.json</button>
          <button type="button" id="btnExportOverrides">Export Layer 1 user_overrides.json</button>
          <button type="button" class="danger-btn" id="btnResetDemo">Reset to Seed Demo</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">Restore Full Bundle:</span>
          <input type="file" id="importBundleInput" accept=".json,application/json">
        </div>
      </div>
    `);

    document.querySelectorAll("[data-revert-override]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.revertOverride;
        delete layer1Overrides.field_overrides[id];
        delete layer1Overrides.edge_deltas[id];
        delete layer1Overrides.reparents[id];
        layer1Overrides.custom_nodes = layer1Overrides.custom_nodes.filter(n => n.id !== id);
        persistAll();
        renderAll();
        openLayerInspectorModal();
        showToast(`Reverted "${id}" to Layer 0 base.`);
      });
    });

    document.getElementById("btnSquashOverrides").addEventListener("click", () => {
      const squashedNum = String(layer0Patches.length + 1).padStart(3, "0");
      const squashedPatch = {
        patch_id: `${squashedNum}_user_squashed`,
        extensions: [],
        nodes: []
      };
      // Include custom nodes and overridden nodes cleanly
      for (const cn of layer1Overrides.custom_nodes) {
        const resolved = liveGraph.nodes.get(cn.id);
        if (resolved) {
          squashedPatch.nodes.push({
            id: resolved.id,
            title: resolved.title,
            parentId: resolved.parentId,
            prereqIds: resolved.prereqIds,
            intro: resolved.intro,
            sources: resolved.sources
          });
        }
      }
      for (const id of Object.keys(layer1Overrides.field_overrides)) {
        const resolved = liveGraph.nodes.get(id);
        if (resolved && !squashedPatch.nodes.some(n => n.id === id)) {
          squashedPatch.nodes.push({
            id: resolved.id,
            title: resolved.title,
            parentId: resolved.parentId,
            prereqIds: resolved.prereqIds,
            intro: resolved.intro,
            sources: resolved.sources
          });
        }
      }
      for (const [id, delta] of Object.entries(layer1Overrides.edge_deltas)) {
        if (!squashedPatch.nodes.some(n => n.id === id)) {
          squashedPatch.extensions.push({
            targetId: id,
            addPrereqs: delta.addPrereqs || [],
            addSources: delta.addSources || []
          });
        }
      }
      layer0Patches.push(squashedPatch);
      layer1Overrides = EMPTY_OVERRIDES();
      persistAll();
      renderAll();
      downloadJson(`${squashedPatch.patch_id}.json`, squashedPatch);
      openLayerInspectorModal();
      showToast(`Squashed Layer 1 into ${squashedPatch.patch_id}.json`);
    });

    document.getElementById("btnClearLayer1").addEventListener("click", () => {
      if (!confirm("Discard all Layer 1 UI overrides?")) return;
      layer1Overrides = EMPTY_OVERRIDES();
      persistAll();
      renderAll();
      openLayerInspectorModal();
    });

    document.getElementById("btnExportBundle").addEventListener("click", () => {
      downloadJson("polymathy_backup_bundle.json", {
        patches: layer0Patches,
        user_overrides: layer1Overrides,
        state: layer2State
      });
    });
    document.getElementById("btnExportState").addEventListener("click", () => downloadJson("state.json", layer2State));
    document.getElementById("btnExportOverrides").addEventListener("click", () => downloadJson("user_overrides.json", layer1Overrides));
    document.getElementById("btnResetDemo").addEventListener("click", () => {
      if (!confirm("Reset patches, overrides, and progress back to the initial Seed Demo?")) return;
      layer0Patches = [structuredClone(SEED_PATCH_001)];
      layer1Overrides = EMPTY_OVERRIDES();
      layer2State = structuredClone(SEED_STATE);
      uiSettings.spotlightMain = false;
      persistAll();
      renderAll();
      closeModal();
      fitVisibleGraph();
      showToast("Reset to Seed Demo.");
    });

    document.getElementById("importBundleInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (Array.isArray(data.patches)) layer0Patches = data.patches;
          if (data.user_overrides) layer1Overrides = Object.assign(EMPTY_OVERRIDES(), data.user_overrides);
          if (data.state) layer2State = data.state;
          persistAll();
          renderAll();
          closeModal();
          fitVisibleGraph();
          showToast("Backup bundle restored.");
        } catch (err) {
          alert("Invalid backup JSON: " + err.message);
        }
      };
      reader.readAsText(file);
    });
  }

  function downloadJson(filename, obj) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  /* 12.4 In-App [? Manual] Tabbed Modal (Section 10.3) */
  function openManualModal() {
    openModal("POLYMATHY // FIELD MANUAL", `
      <div class="manual-tabs">
        <button type="button" class="manual-tab-btn active" data-mtab="tab1">1. Map Legend</button>
        <button type="button" class="manual-tab-btn" data-mtab="tab2">2. Detours & Locators</button>
        <button type="button" class="manual-tab-btn" data-mtab="tab3">3. LLM Patches</button>
        <button type="button" class="manual-tab-btn" data-mtab="tab4">4. Shortcuts</button>
      </div>

      <div class="manual-tab-panel active" id="tab1">
        <div class="box">
          <div class="box-header"><span class="box-title">COMPOUND DAG VISUAL GRAMMAR</span><span class="tag">[G = (V, E_tree, E_prereq, S)]</span></div>
          <table class="spec-table">
            <thead><tr><th>Visual Element</th><th>Meaning & Behavior</th></tr></thead>
            <tbody>
              <tr><td><strong>Origin Dot (o)</strong></td><td>Root <code class="inline">Knowledge</code> vertex at $(0,0)$. Click domains to progressively multifurcate.</td></tr>
              <tr><td><strong>Hollow Conduit + Crossbar</strong></td><td>Hierarchy containment edge ($E_{\\text{tree}}$). Inner fill tracks completion ratio $r_v$; perpendicular crossbar marks achievement frontier.</td></tr>
              <tr><td><strong>Double-Bar Gate</strong></td><td>Stamped on a conduit when <code class="inline">baselineDone = true</code> and deeper subtopics are added later, preserving downstream unlocks.</td></tr>
              <tr><td><strong><span class="tag flag-X">SOLID RED ARROW</span></strong></td><td>Incomplete cross-branch prerequisite ($p.\\text{baselineDone} = \\text{false}$). Click arrow or directory pill to detour.</td></tr>
              <tr><td><strong><span class="tag flag-C">DOTTED GREEN ARROW</span></strong></td><td>Completed prerequisite ($p.\\text{baselineDone} = \\text{true}$). Latched permanently once baseline is marked complete.</td></tr>
              <tr><td><strong><span class="tag stub">[STUB NODE]</span></strong></td><td>Auto-hydrated placeholder created by a forward cross-branch reference; hydrates cleanly when a patch defines it.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="manual-tab-panel" id="tab2">
        <div class="box">
          <div class="box-header"><span class="box-title">GIT-STYLE LOCATORS & DETOUR CALL STACK</span><span class="tag head-tag">[MAIN vs HEAD]</span></div>
          <p style="margin-bottom:8px;"><strong>MAIN</strong> (Blue Beacon) anchors your primary study objective. <strong>HEAD</strong> (Purple Reticle) tracks the topic currently inspected in the side panel.</p>
          <ul style="padding-left:18px;margin-bottom:8px;">
            <li>Click any solid/dotted prerequisite arrow or <strong>[Detour →]</strong> button to glide smoothly to that prerequisite and push your previous <strong>HEAD</strong> onto the <strong>Detour Call Stack</strong>.</li>
            <li>Use <strong>[← Get Back]</strong> (or <code class="inline">Esc</code>) to pop the stack and glide back, or click any ancestor frame in the breadcrumb chain.</li>
            <li>Click <strong>[Checkout HEAD as MAIN]</strong> to re-anchor your primary goal to your current inspection node.</li>
          </ul>
        </div>
      </div>

      <div class="manual-tab-panel" id="tab3">
        <div class="box">
          <div class="box-header"><span class="box-title">3-LAYER OVERLAYFS & LLM EXPANSION WORKFLOW</span><span class="tag">[L0 ⊕ L1 ⋈ L2]</span></div>
          <ol style="padding-left:18px;margin-bottom:10px;">
            <li>Select any topic and click <strong>[Copy LLM Expansion Context]</strong> in Module 5 to copy a token-minimal slice with canonical IDs.</li>
            <li>Paste into any LLM to generate a strict Layer 0 Delta Patch JSON.</li>
            <li>Click <strong>[+ Import Patch]</strong> in the top bar to validate acyclicity (DFS) and merge without overwriting your progress (<code class="inline">state</code>) or UI edits (<code class="inline">user_overrides</code>).</li>
          </ol>
          <pre class="code-block">{
  "patch_id": "2026-11-12_topic_ext",
  "extensions": [{ "targetId": "math.graph_theory", "addPrereqs": [], "addSources": [] }],
  "nodes": [{ "id": "math.graph_theory.colorings", "title": "Graph Colorings", "parentId": "math.graph_theory", "prereqIds": ["math.graph_theory.planar_graphs"], "intro": "...", "sources": [] }]
}</pre>
        </div>
      </div>

      <div class="manual-tab-panel" id="tab4">
        <div class="box">
          <div class="box-header"><span class="box-title">KEYBOARD & CANVAS SHORTCUTS</span><span class="tag">[HOTKEYS]</span></div>
          <table class="spec-table">
            <thead><tr><th>Input</th><th>Action</th></tr></thead>
            <tbody>
              <tr><td><code class="inline">Drag Canvas</code> or <code class="inline">Space + Drag</code></td><td>Pan infinite 2D SVG canvas</td></tr>
              <tr><td><code class="inline">Mouse Wheel</code></td><td>Zoom anchored at cursor</td></tr>
              <tr><td><code class="inline">M</code></td><td>Smoothly locate <strong>MAIN</strong> beacon</td></tr>
              <tr><td><code class="inline">H</code></td><td>Smoothly locate <strong>HEAD</strong> reticle</td></tr>
              <tr><td><code class="inline">Esc</code></td><td>Close active modal, or pop top frame from Detour Stack</td></tr>
              <tr><td><code class="inline">Drag Minimap</code></td><td>Jump viewport camera directly from minimap</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    `);

    document.querySelectorAll(".manual-tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".manual-tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".manual-tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        const panel = document.getElementById(btn.dataset.mtab);
        panel.classList.add("active");
        renderMathInContainer(panel);
      });
    });
  }

  /* =========================================================================
   * 13. CANVAS PAN / ZOOM, MINIMAP DRAG, SPLITTER & HOTKEYS
   * ========================================================================= */
  function setupInteractions() {
    const svg = document.getElementById("dagSvg");
    const canvasPane = document.getElementById("canvasPane");
    let isPanning = false;
    let panStart = { x: 0, y: 0, camX: 0, camY: 0 };
    let spaceHeld = false;

    svg.addEventListener("mousedown", (e) => {
      if (e.button !== 0 && e.button !== 1) return;
      if (e.target.closest(".svg-node") || e.target.closest(".prereq-hit") || e.target.closest(".svg-expand-badge")) {
        if (!spaceHeld) return;
      }
      cancelCameraAnim();
      isPanning = true;
      svg.classList.add("panning");
      panStart = { x: e.clientX, y: e.clientY, camX: camera.x, camY: camera.y };
    });

    window.addEventListener("mousemove", (e) => {
      if (!isPanning) return;
      camera.x = panStart.camX + (e.clientX - panStart.x);
      camera.y = panStart.camY + (e.clientY - panStart.y);
      applyWorldTransform();
    });

    window.addEventListener("mouseup", () => {
      if (!isPanning) return;
      isPanning = false;
      svg.classList.remove("panning");
    });

    canvasPane.addEventListener("wheel", (e) => {
      e.preventDefault();
      cancelCameraAnim();
      const rect = canvasPane.getBoundingClientRect();
      const mx = e.clientX - rect.left - rect.width / 2;
      const my = e.clientY - rect.top - rect.height / 2;
      const worldX = (mx - camera.x) / camera.k;
      const worldY = (my - camera.y) / camera.k;
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      const nextK = Math.max(0.22, Math.min(2.6, camera.k * factor));
      camera.k = nextK;
      camera.x = mx - worldX * nextK;
      camera.y = my - worldY * nextK;
      applyWorldTransform();
    }, { passive: false });

    // Minimap Drag-to-Pan
    const miniSvg = document.getElementById("minimapSvg");
    let miniDragging = false;
    function panFromMinimapEvent(e) {
      const rect = miniSvg.getBoundingClientRect();
      const rx = (e.clientX - rect.left) / Math.max(1, rect.width);
      const ry = (e.clientY - rect.top) / Math.max(1, rect.height);
      const wx = minimapBounds.minX + rx * (minimapBounds.maxX - minimapBounds.minX);
      const wy = minimapBounds.minY + ry * (minimapBounds.maxY - minimapBounds.minY);
      cancelCameraAnim();
      camera.x = -wx * camera.k;
      camera.y = -wy * camera.k;
      applyWorldTransform();
    }
    miniSvg.addEventListener("mousedown", (e) => { miniDragging = true; panFromMinimapEvent(e); });
    window.addEventListener("mousemove", (e) => { if (miniDragging) panFromMinimapEvent(e); });
    window.addEventListener("mouseup", () => { miniDragging = false; });

    // Resizable Splitter
    const splitter = document.getElementById("splitter");
    const sidePane = document.getElementById("sidePane");
    if (uiSettings.sidePaneWidth) {
      sidePane.style.width = uiSettings.sidePaneWidth + "px";
    }
    let splitDragging = false;
    splitter.addEventListener("mousedown", () => {
      splitDragging = true;
      splitter.classList.add("dragging");
    });
    window.addEventListener("mousemove", (e) => {
      if (!splitDragging) return;
      const totalW = document.getElementById("workspace").clientWidth;
      const newSideW = Math.max(320, Math.min(totalW - 340, totalW - e.clientX));
      sidePane.style.width = newSideW + "px";
      uiSettings.sidePaneWidth = newSideW;
      applyWorldTransform();
    });
    window.addEventListener("mouseup", () => {
      if (!splitDragging) return;
      splitDragging = false;
      splitter.classList.remove("dragging");
      persistAll();
    });

    // Topbar & HUD Controls
    document.getElementById("btnLocateMain").addEventListener("click", () => locateNode(liveGraph.navigation.MAIN, 0.98));
    document.getElementById("btnLocateHead").addEventListener("click", () => locateNode(liveGraph.navigation.HEAD, 0.98));
    document.getElementById("btnFloatingGetBack").addEventListener("click", popDetour);

    document.getElementById("btnToggleLayout").addEventListener("click", () => {
      uiSettings.layoutMode = uiSettings.layoutMode === "radial" ? "tree" : "radial";
      persistAll();
      renderAll();
      fitVisibleGraph();
    });
    document.getElementById("btnFrontierRadar").addEventListener("click", openFrontierRadarModal);
    document.getElementById("btnImportPatch").addEventListener("click", openImportPatchModal);
    document.getElementById("btnLayerInspector").addEventListener("click", openLayerInspectorModal);
    document.getElementById("btnManual").addEventListener("click", openManualModal);
    document.getElementById("btnCloseModal").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target === document.getElementById("modalBackdrop")) closeModal();
    });

    document.getElementById("btnZoomIn").addEventListener("click", () => {
      cancelCameraAnim();
      camera.k = Math.min(2.6, camera.k * 1.18);
      applyWorldTransform();
    });
    document.getElementById("btnZoomOut").addEventListener("click", () => {
      cancelCameraAnim();
      camera.k = Math.max(0.22, camera.k / 1.18);
      applyWorldTransform();
    });
    document.getElementById("btnFitMap").addEventListener("click", fitVisibleGraph);
    document.getElementById("btnExpandAll").addEventListener("click", () => {
      for (const n of liveGraph.nodes.values()) {
        if (n.childrenIds.length > 0) ensureNodeState(n.id).expandedOnMap = true;
      }
      persistAll();
      renderAll();
      fitVisibleGraph();
    });
    document.getElementById("btnCollapseDomains").addEventListener("click", () => {
      for (const n of liveGraph.nodes.values()) {
        ensureNodeState(n.id).expandedOnMap = (n.id === "knowledge");
      }
      persistAll();
      renderAll();
      fitVisibleGraph();
    });
    document.getElementById("btnClearSpotlight").addEventListener("click", () => {
      uiSettings.spotlightMain = false;
      persistAll();
      renderAll();
    });

    // Global Keyboard Shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") spaceHeld = true;
      const tag = (document.activeElement?.tagName || "").toLowerCase();
      const inInput = tag === "input" || tag === "textarea" || tag === "select";
      if (e.key === "Escape") {
        if (document.getElementById("modalBackdrop").classList.contains("open")) {
          closeModal();
        } else if (!inInput && liveGraph.navigation.detourStack.length > 0) {
          popDetour();
        }
        return;
      }
      if (inInput) return;
      if (e.key === "m" || e.key === "M") {
        locateNode(liveGraph.navigation.MAIN, 0.98);
      } else if (e.key === "h" || e.key === "H") {
        locateNode(liveGraph.navigation.HEAD, 0.98);
      }
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "Space") spaceHeld = false;
    });
    window.addEventListener("resize", applyWorldTransform);
  }

  /* =========================================================================
   * 14. BOOTSTRAP
   * ========================================================================= */
  setupInteractions();
  renderAll();
  // Gently center HEAD on initial load after layout
  requestAnimationFrame(() => {
    const headPos = layoutPositions.get(liveGraph.navigation.HEAD);
    if (headPos) {
      camera.k = 0.82;
      camera.x = -headPos.x * 0.45 * camera.k;
      camera.y = -headPos.y * 0.45 * camera.k;
    }
    applyWorldTransform();
  });
  window.addEventListener("load", () => {
    renderMathInContainer(document.getElementById("sidePane"));
  });
})();
</script>
