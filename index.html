        btn.classList.add("active");
        const pane = document.getElementById(`pane_${tab}`);
        if (pane) pane.classList.add("active");
      });
    });

    const plState = layer2State.playlistState;
    const chkRoute = document.getElementById("chkPlRoute");
    if (chkRoute) {
      chkRoute.addEventListener("change", () => {
        plState.showRouteOnMap = chkRoute.checked;
        persistAll();
        renderAll();
      });
    }
    const chkAutoAdv = document.getElementById("chkPlAutoAdvance");
    if (chkAutoAdv) {
      chkAutoAdv.addEventListener("change", () => {
        plState.autoAdvanceMain = chkAutoAdv.checked;
        persistAll();
      });
    }
    const chkIncPrereq = document.getElementById("chkPlIncludePrereqs");
    if (chkIncPrereq) {
      chkIncPrereq.addEventListener("change", () => {
        plState.spotlightIncludePrereqs = chkIncPrereq.checked;
        persistAll();
        if (uiSettings.spotlightMode === "playlist") renderAll();
      });
    }
    const chkAutoExp = document.getElementById("chkPlAutoExpandSpine");
    if (chkAutoExp) {
      chkAutoExp.addEventListener("change", () => {
        plState.autoExpandSpine = chkAutoExp.checked;
        persistAll();
      });
    }

    document.querySelectorAll("[data-pl-activate]").forEach(btn => {
      btn.addEventListener("click", () => {
        const pId = btn.dataset.plActivate;
        plState.activePlaylistId = pId;
        plState.activeStepIndex = 0;
        setPlaylistStep(0);
        closeModal();
        showToast(`Activated playlist: ${getActivePlaylist()?.title || pId}`);
      });
    });

    document.querySelectorAll("[data-pl-spotlight]").forEach(btn => {
      btn.addEventListener("click", () => {
        const pId = btn.dataset.plSpotlight;
        plState.activePlaylistId = pId;
        plState.activeStepIndex = 0;
        setPlaylistStep(0);
        togglePlaylistSpotlight(true);
        closeModal();
      });
    });

    document.querySelectorAll("[data-pl-export]").forEach(btn => {
      btn.addEventListener("click", () => {
        const pId = btn.dataset.plExport;
        const pl = storedPlaylists.find(p => p.playlist_id === pId);
        if (pl) {
          downloadJSONFile(`${pl.playlist_id}.json`, pl);
          showToast(`Exported playlist: ${pl.title}`);
        }
      });
    });

    document.querySelectorAll("[data-pl-delete]").forEach(btn => {
      btn.addEventListener("click", () => {
        const pId = btn.dataset.plDelete;
        const pl = storedPlaylists.find(p => p.playlist_id === pId);
        if (!confirm(`Delete playlist "${pl ? pl.title : pId}"?`)) return;
        storedPlaylists = storedPlaylists.filter(p => p.playlist_id !== pId);
        if (plState.activePlaylistId === pId) {
          plState.activePlaylistId = storedPlaylists[0] ? storedPlaylists[0].playlist_id : null;
          plState.activeStepIndex = 0;
        }
        persistAll();
        openPlaylistsModal("library");
        renderTopbar();
        showToast("Playlist deleted.");
      });
    });

    const btnNewBuilder = document.getElementById("btnPlOpenNewBuilder");
    if (btnNewBuilder) {
      btnNewBuilder.addEventListener("click", () => {
        playlistBuilderState = {
          title: "",
          category: "Specialization",
          description: "",
          steps: []
        };
        openPlaylistsModal("builder");
      });
    }

    const bTitle = document.getElementById("inputBuilderTitle");
    if (bTitle) bTitle.addEventListener("input", () => { playlistBuilderState.title = bTitle.value; });
    const bCat = document.getElementById("selectBuilderCategory");
    if (bCat) bCat.addEventListener("change", () => { playlistBuilderState.category = bCat.value; });
    const bDesc = document.getElementById("inputBuilderDesc");
    if (bDesc) bDesc.addEventListener("input", () => { playlistBuilderState.description = bDesc.value; });

    document.querySelectorAll("[data-builder-step-note]").forEach(inp => {
      inp.addEventListener("input", () => {
        const idx = Number(inp.dataset.builderStepNote);
        if (playlistBuilderState.steps[idx]) playlistBuilderState.steps[idx].note = inp.value;
      });
    });

    document.querySelectorAll("[data-builder-step-level]").forEach(sel => {
      sel.addEventListener("change", () => {
        const idx = Number(sel.dataset.builderStepLevel);
        if (playlistBuilderState.steps[idx]) playlistBuilderState.steps[idx].targetLevel = sel.value;
      });
    });

    document.querySelectorAll("[data-builder-step-up]").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.builderStepUp);
        if (idx > 0) {
          const tmp = playlistBuilderState.steps[idx - 1];
          playlistBuilderState.steps[idx - 1] = playlistBuilderState.steps[idx];
          playlistBuilderState.steps[idx] = tmp;
          openPlaylistsModal("builder");
        }
      });
    });

    document.querySelectorAll("[data-builder-step-down]").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.builderStepDown);
        if (idx < playlistBuilderState.steps.length - 1) {
          const tmp = playlistBuilderState.steps[idx + 1];
          playlistBuilderState.steps[idx + 1] = playlistBuilderState.steps[idx];
          playlistBuilderState.steps[idx] = tmp;
          openPlaylistsModal("builder");
        }
      });
    });

    document.querySelectorAll("[data-builder-step-del]").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.builderStepDel);
        playlistBuilderState.steps.splice(idx, 1);
        openPlaylistsModal("builder");
      });
    });

    const builderSearch = document.getElementById("inputBuilderSearch");
    if (builderSearch) {
      builderSearch.addEventListener("input", () => {
        const q = builderSearch.value.toLowerCase().trim();
        const sel = document.getElementById("selectBuilderCandidate");
        const candidates = [...liveGraph.nodes.values()]
          .filter(n => n.id !== "knowledge")
          .filter(n => !q || n.title.toLowerCase().includes(q) || n.id.toLowerCase().includes(q))
          .slice(0, 50);
        sel.innerHTML = `<option value="">-- Choose Topic to Add --</option>` +
          candidates.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.title)} (${escapeHtml(c.id)})</option>`).join("");
      });
    }

    const btnAddStep = document.getElementById("btnBuilderAddStep");
    if (btnAddStep) {
      btnAddStep.addEventListener("click", () => {
        const sel = document.getElementById("selectBuilderCandidate");
        const candId = sel ? sel.value : null;
        if (!candId) return;
        playlistBuilderState.steps.push({
          nodeId: candId,
          targetLevel: "baseline",
          note: ""
        });
        openPlaylistsModal("builder");
      });
    }

    const btnClearBuilder = document.getElementById("btnBuilderClear");
    if (btnClearBuilder) {
      btnClearBuilder.addEventListener("click", () => {
        playlistBuilderState = { title: "", category: "Specialization", description: "", steps: [] };
        openPlaylistsModal("builder");
      });
    }

    const btnSaveBuilder = document.getElementById("btnBuilderSave");
    if (btnSaveBuilder) {
      btnSaveBuilder.addEventListener("click", () => {
        const title = playlistBuilderState.title.trim();
        if (!title) {
          alert("Please enter a title for the playlist.");
          return;
        }
        if (playlistBuilderState.steps.length === 0) {
          alert("Please add at least one step to the playlist.");
          return;
        }

        const slug = "pl_" + title.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
        const newPl = {
          playlist_id: slug,
          title,
          category: playlistBuilderState.category || "Custom",
          description: playlistBuilderState.description || "",
          steps: structuredClone(playlistBuilderState.steps)
        };

        const existingIdx = storedPlaylists.findIndex(p => p.playlist_id === newPl.playlist_id);
        if (existingIdx !== -1) {
          storedPlaylists[existingIdx] = newPl;
        } else {
          storedPlaylists.push(newPl);
        }

        plState.activePlaylistId = newPl.playlist_id;
        plState.activeStepIndex = 0;
        persistAll();
        closeModal();
        setPlaylistStep(0);
        showToast(`Saved and activated playlist: ${newPl.title}`);
      });
    }

    const btnCopyPrompt = document.getElementById("btnCopyLlmPlaylistPrompt");
    if (btnCopyPrompt) {
      btnCopyPrompt.addEventListener("click", () => {
        copyLlmPlaylistPrompt();
      });
    }

    const fileInp = document.getElementById("fileImportPlaylist");
    if (fileInp) {
      fileInp.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const txt = document.getElementById("txtImportPlaylistJson");
          if (txt) txt.value = reader.result;
        };
        reader.readAsText(file);
      });
    }

    const btnImport = document.getElementById("btnSubmitImportPlaylist");
    if (btnImport) {
      btnImport.addEventListener("click", () => {
        const raw = document.getElementById("txtImportPlaylistJson")?.value.trim();
        if (!raw) return;
        try {
          const parsed = JSON.parse(raw);
          if (!parsed.playlist_id || !parsed.title || !Array.isArray(parsed.steps) || parsed.steps.length === 0) {
            alert("Invalid Playlist schema: playlist_id, title, and steps array are required.");
            return;
          }

          let stubsCreated = 0;
          for (const st of parsed.steps) {
            if (st.nodeId && !liveGraph.nodes.has(st.nodeId)) {
              if (!layer1Overrides.custom_nodes.some(cn => cn.id === st.nodeId)) {
                layer1Overrides.custom_nodes.push({
                  id: st.nodeId,
                  title: prettifySlug(st.nodeId),
                  parentId: "knowledge",
                  prereqIds: [],
                  intro: "Placeholder stub topic auto-synthesized during playlist import.",
                  sources: [],
                  isStub: true,
                  isCustom: true
                });
                stubsCreated++;
              }
            }
          }

          const existingIdx = storedPlaylists.findIndex(p => p.playlist_id === parsed.playlist_id);
          if (existingIdx !== -1) {
            storedPlaylists[existingIdx] = parsed;
          } else {
            storedPlaylists.push(parsed);
          }

          plState.activePlaylistId = parsed.playlist_id;
          plState.activeStepIndex = 0;
          persistAll();
          liveGraph = buildLiveGraph();
          computeLayout(liveGraph);
          closeModal();
          setPlaylistStep(0);
          showToast(`Imported playlist: ${parsed.title}${stubsCreated > 0 ? ` (${stubsCreated} stub topics created)` : ""}`);
        } catch (err) {
          alert("Error parsing JSON: " + err.message);
        }
      });
    }
  }

      .filter(n => !n.isBaselineDone)
      .map(n => {
        let count = 0;
        const visited = new Set();
        const queue = [n.id];
        while (queue.length > 0) {
          const u = queue.shift();
          const node = liveGraph.nodes.get(u);
          if (!node) continue;
          for (const depId of node.dependentsIds) {
            if (!visited.has(depId)) {
              visited.add(depId);
              const dep = liveGraph.nodes.get(depId);
              if (dep && !dep.isBaselineDone) count++;
              queue.push(depId);
            }
          }
        }
        return { node: n, blockingCount: count };

      .sort((a, b) => b.blockingCount - a.blockingCount);

    openModal("+ IMPORT CURRICULUM PATCH", `

    function parseAndValidatePatch() {
      const diag = document.getElementById("patchDiagOutput");
      let parsed;
      try {
        parsed = JSON.parse(document.getElementById("patchJsonInput").value);
      } catch (err) {
        diag.innerHTML = `<div class="diag-warn">JSON Syntax Error: ${escapeHtml(err.message)}</div>`;
        return null;
      }
      if (!parsed || typeof parsed !== "object" || (!Array.isArray(parsed.nodes) && !Array.isArray(parsed.extensions))) {
        diag.innerHTML = `<div class="diag-warn">Invalid Format: Must include "nodes" or "extensions" array.</div>`;
        return null;
      }

      const testPatches = [...layer0Patches, parsed];
      const { map: mergedMap } = foldLayer0And1(testPatches, layer1Overrides);
      const cycle = validateFullDagAcyclicity(mergedMap);
      if (cycle) {
        diag.innerHTML = `<div class="diag-warn">Acyclicity Error: Introduces dependency loop: ${escapeHtml(cycle.join(" -> "))}</div>`;
        return null;
      }

      const newNodes = (parsed.nodes || []).filter(n => !liveGraph.nodes.has(n.id));
      diag.innerHTML = `<div class="diag-info">Valid curriculum patch. +${newNodes.length} new topics detected with zero cycles.</div>`;
      return parsed;
    }

  function downloadJson(filename, obj) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

    const svg = document.getElementById("dagSvg");
    const canvasPane = document.getElementById("canvasPane");

    let isMousePanning = false;
    let panStart = { x: 0, y: 0, camX: 0, camY: 0 };

    svg.addEventListener("mousedown", (e) => {
      if (e.button !== 0 && e.button !== 1) return;
      cancelCameraAnim();
      isMousePanning = true;
      svg.classList.add("panning");
      panStart = { x: e.clientX, y: e.clientY, camX: camera.x, camY: camera.y };
    });

    window.addEventListener("mousemove", (e) => {
      if (!isMousePanning) return;
      const dx = e.clientX - panStart.x;
      const dy = e.clientY - panStart.y;
      camera.x = panStart.camX + dx;
      camera.y = panStart.camY + dy;
      applyWorldTransform();
    });

    window.addEventListener("mouseup", () => {
      if (!isMousePanning) return;
      isMousePanning = false;
      svg.classList.remove("panning");
    });

    canvasPane.addEventListener("wheel", (e) => {
      e.preventDefault();
      cancelCameraAnim();

      if (e.ctrlKey || e.metaKey || uiSettings.wheelMode === "zoom") {
        const rect = canvasPane.getBoundingClientRect();
        const mx = e.clientX - rect.left - rect.width / 2;
        const my = e.clientY - rect.top - rect.height / 2;
        const worldX = (mx - camera.x) / camera.k;
        const worldY = (my - camera.y) / camera.k;
        const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
        const nextK = Math.max(0.2, Math.min(2.8, camera.k * factor));
        camera.k = nextK;
        camera.x = mx - worldX * nextK;
        camera.y = my - worldY * nextK;
      } else {
        camera.x -= e.deltaX;
        camera.y -= e.deltaY;
      }
      applyWorldTransform();
    }, { passive: false });

    let touchState = {
      active: false,
      mode: null,
      startX: 0,
      startY: 0,
      camStartX: 0,
      camStartY: 0,
      startDist: 0,
      startK: 1
    };

    canvasPane.addEventListener("touchstart", (e) => {
      cancelCameraAnim();
      if (e.touches.length === 1) {
        touchState.active = true;
        touchState.mode = "pan";
        touchState.startX = e.touches[0].clientX;
        touchState.startY = e.touches[0].clientY;
        touchState.camStartX = camera.x;
        touchState.camStartY = camera.y;
      } else if (e.touches.length >= 2) {
        touchState.active = true;
        touchState.mode = "pinch";
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchState.startDist = Math.hypot(dx, dy) || 1;
        touchState.startK = camera.k;
      }
    }, { passive: true });

    canvasPane.addEventListener("touchmove", (e) => {
      if (!touchState.active) return;
      if (touchState.mode === "pan" && e.touches.length === 1) {
        const dx = e.touches[0].clientX - touchState.startX;
        const dy = e.touches[0].clientY - touchState.startY;
        camera.x = touchState.camStartX + dx;
        camera.y = touchState.camStartY + dy;
        applyWorldTransform();
      } else if (touchState.mode === "pinch" && e.touches.length >= 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy) || 1;
        const scale = dist / touchState.startDist;
        camera.k = Math.max(0.2, Math.min(2.8, touchState.startK * scale));
        applyWorldTransform();
      }
    }, { passive: true });

    canvasPane.addEventListener("touchend", () => {
      touchState.active = false;
      touchState.mode = null;
    });

    const miniSvg = document.getElementById("minimapSvg");
    let miniDragging = false;
    function panFromMinimapEvent(e) {
      const rect = miniSvg.getBoundingClientRect();
      const rx = (e.clientX - rect.left) / Math.max(1, rect.width);
      const ry = (e.clientY - rect.top) / Math.max(1, rect.height);
      const wx = minimapBounds.minX + rx * (minimapBounds.maxX - minimapBounds.minX);
      const wy = minimapBounds.minY + ry * (minimapBounds.maxY - minimapBounds.minY);
      cancelCameraAnim();
      camera.x = -wx * camera.k;
      camera.y = -wy * camera.k;
      applyWorldTransform();
    }
    miniSvg.addEventListener("mousedown", (e) => { miniDragging = true; panFromMinimapEvent(e); });
    window.addEventListener("mousemove", (e) => { if (miniDragging) panFromMinimapEvent(e); });
    window.addEventListener("mouseup", () => { miniDragging = false; });

    document.getElementById("btnToggleMinimap").addEventListener("click", () => {
      uiSettings.minimapMinimized = !uiSettings.minimapMinimized;
      document.getElementById("minimapWrap").classList.toggle("minimized", uiSettings.minimapMinimized);
      document.getElementById("btnToggleMinimap").textContent = uiSettings.minimapMinimized ? "+" : "-";
      persistAll();
    });
    if (uiSettings.minimapMinimized) {
      document.getElementById("minimapWrap").classList.add("minimized");
      document.getElementById("btnToggleMinimap").textContent = "+";
    }

    const splitter = document.getElementById("splitter");
    const sidePane = document.getElementById("sidePane");
    if (uiSettings.sidePaneWidth) sidePane.style.width = uiSettings.sidePaneWidth + "px";
    let splitDragging = false;

    splitter.addEventListener("mousedown", () => {
      splitDragging = true;
      splitter.classList.add("dragging");
    });
    window.addEventListener("mousemove", (e) => {
      if (!splitDragging) return;
      const totalW = document.getElementById("workspace").clientWidth;
      const newSideW = Math.max(300, Math.min(totalW - 320, totalW - e.clientX));
      sidePane.style.width = newSideW + "px";
      uiSettings.sidePaneWidth = newSideW;
      applyWorldTransform();
    });
    window.addEventListener("mouseup", () => {
      if (!splitDragging) return;
      splitDragging = false;
      splitter.classList.remove("dragging");
      persistAll();
    });

    document.getElementById("btnLocateMain").addEventListener("click", () => locateNode(liveGraph.navigation.MAIN, 0.98));
    document.getElementById("btnLocateHead").addEventListener("click", () => locateNode(liveGraph.navigation.HEAD, 0.98));

    const btnMainSpot = document.getElementById("btnMainSpotlight");
    if (btnMainSpot) btnMainSpot.addEventListener("click", () => toggleMainSpotlight());

    const btnTopGoalMode = document.getElementById("btnGoalSpotlightTypeTop");
    if (btnTopGoalMode) btnTopGoalMode.addEventListener("click", () => cycleGoalSpotlightType());

    const btnHudSpot = document.getElementById("btnHudMainSpotlight");
    if (btnHudSpot) btnHudSpot.addEventListener("click", () => toggleMainSpotlight());

    const btnHudGoalMode = document.getElementById("btnHudGoalSpotlightMode");
    if (btnHudGoalMode) btnHudGoalMode.addEventListener("click", () => cycleGoalSpotlightType());

    const btnToggleDown = document.getElementById("btnToggleDownstreamArrows");
    if (btnToggleDown) btnToggleDown.addEventListener("click", () => toggleDownstreamArrows());

    document.getElementById("btnPlaylistPrev").addEventListener("click", () => stepPlaylist(-1));
    document.getElementById("btnPlaylistNext").addEventListener("click", () => stepPlaylist(1));
    document.getElementById("btnPlaylistSpotlight").addEventListener("click", () => togglePlaylistSpotlight());
    document.getElementById("btnPlaylistFit").addEventListener("click", () => fitPlaylistNodes(450));
    document.getElementById("btnOpenPlaylists").addEventListener("click", () => openPlaylistsModal());
    const btnOpenPlTop = document.getElementById("btnOpenPlaylistsTop");
    if (btnOpenPlTop) btnOpenPlTop.addEventListener("click", () => openPlaylistsModal());

    document.getElementById("btnNewTopicTop").addEventListener("click", () => openNewTopicModal());
    document.getElementById("btnFloatingGetBack").addEventListener("click", popDetour);

    document.getElementById("btnToggleLayout").addEventListener("click", () => {
      uiSettings.layoutMode = uiSettings.layoutMode === "tree" ? "radial" : "tree";
      persistAll();
      renderAll();
      fitVisibleGraph();
    });

    document.getElementById("btnFrontierRadar").addEventListener("click", openFrontierRadarModal);
    document.getElementById("btnImportPatch").addEventListener("click", openImportPatchModal);
    document.getElementById("btnLayerInspector").addEventListener("click", openLayerInspectorModal);
    document.getElementById("btnManual").addEventListener("click", openManualModal);
    document.getElementById("btnCloseModal").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target === document.getElementById("modalBackdrop")) closeModal();
    });

    document.getElementById("btnPanLeft").addEventListener("click", () => panCameraBy(130, 0));
    document.getElementById("btnPanRight").addEventListener("click", () => panCameraBy(-130, 0));
    document.getElementById("btnPanUp").addEventListener("click", () => panCameraBy(0, 130));
    document.getElementById("btnPanDown").addEventListener("click", () => panCameraBy(0, -130));

    document.getElementById("btnZoomIn").addEventListener("click", () => {
      cancelCameraAnim();
      camera.k = Math.min(2.8, camera.k * 1.18);
      applyWorldTransform();
    });
    document.getElementById("btnZoomOut").addEventListener("click", () => {
      cancelCameraAnim();
      camera.k = Math.max(0.2, camera.k / 1.18);
      applyWorldTransform();
    });
    document.getElementById("btnFitMap").addEventListener("click", fitVisibleGraph);

    document.getElementById("btnToggleWheelMode").addEventListener("click", () => {
      uiSettings.wheelMode = uiSettings.wheelMode === "scroll" ? "zoom" : "scroll";
      document.getElementById("btnToggleWheelMode").textContent = uiSettings.wheelMode === "scroll" ? "Wheel: Scroll" : "Wheel: Zoom";
      persistAll();
    });
    document.getElementById("btnToggleWheelMode").textContent = uiSettings.wheelMode === "scroll" ? "Wheel: Scroll" : "Wheel: Zoom";

    document.getElementById("btnExpandAll").addEventListener("click", () => {
      for (const n of liveGraph.nodes.values()) {
        if (n.childrenIds.length > 0) ensureNodeState(n.id).expandedOnMap = true;
      }
      persistAll();
      renderAll();
      fitVisibleGraph();
    });
    document.getElementById("btnCollapseDomains").addEventListener("click", () => {
      for (const n of liveGraph.nodes.values()) {
        ensureNodeState(n.id).expandedOnMap = (n.id === "knowledge");
      }
      persistAll();
      renderAll();
      fitVisibleGraph();
    });
    const btnClrSpot = document.getElementById("btnClearSpotlight");
    if (btnClrSpot) btnClrSpot.addEventListener("click", clearSpotlightMode);

    const inputLoadGraphFile = document.getElementById("inputLoadGraphFile");
    if (inputLoadGraphFile) {
      inputLoadGraphFile.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          loadGraphFromJSONString(reader.result, file.name);
        };
        reader.readAsText(file);
        e.target.value = "";
      });
    }

    const btnLoadGraphTop = document.getElementById("btnLoadGraphTop");
    if (btnLoadGraphTop) {
      btnLoadGraphTop.addEventListener("click", () => {
        document.getElementById("inputLoadGraphFile")?.click();
      });
    }

    window.addEventListener("keydown", (e) => {
      const tag = (document.activeElement?.tagName || "").toLowerCase();
      const inInput = tag === "input" || tag === "textarea" || tag === "select";
      if (e.key === "Escape") {
        if (document.getElementById("modalBackdrop").classList.contains("open")) {
          closeModal();
        } else if (!inInput && liveGraph.navigation.detourStack.length > 0) {
          popDetour();
        }
        return;
      }
      if (inInput) return;
      if (e.key === "m" || e.key === "M") locateNode(liveGraph.navigation.MAIN, 0.98);
      if (e.key === "h" || e.key === "H") locateNode(liveGraph.navigation.HEAD, 0.98);
      if (e.key === "s" || e.key === "S") {
        if (e.shiftKey) {
          cycleGoalSpotlightType();
        } else {
          toggleMainSpotlight();
        }
      }
    });

    window.addEventListener("resize", applyWorldTransform);

    const btnInstallPwa = document.getElementById("btnInstallPwa");
    if (btnInstallPwa) {
      btnInstallPwa.addEventListener("click", triggerPwaInstall);
    }
  }

  let deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const topBtn = document.getElementById("btnInstallPwa");
    if (topBtn) topBtn.style.display = "inline-flex";
    const modalHint = document.getElementById("pwaModalInstallHint");
    if (modalHint) modalHint.textContent = "Ready to install on this device";
  });

  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    const topBtn = document.getElementById("btnInstallPwa");
    if (topBtn) topBtn.style.display = "none";
    showToast("Polymathy installed successfully as PWA.");
  });

  async function triggerPwaInstall() {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      if (outcome === "accepted") {
        showToast("Polymathy install accepted.");
      }
      deferredInstallPrompt = null;
      const topBtn = document.getElementById("btnInstallPwa");
      if (topBtn) topBtn.style.display = "none";
    } else {
      alert("Polymathy is PWA ready! If your browser did not show an automated prompt, click your browser menu (or share icon) and choose 'Add to Home screen' or 'Install App'.");
    }
  }

  /* =========================================================================
   * 12. INITIALIZATION
   * ========================================================================= */
  async function initApp() {
    setupInteractions();
    renderAll();

    requestAnimationFrame(() => {
      fitVisibleGraph();
    });

    // Service Worker Registration for Offline PWA
    if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js")
        .then((reg) => {
          reg.addEventListener("updatefound", () => {
            const newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener("statechange", () => {
                if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                  showToast("Polymathy updated: reload to view latest changes.");
                }
              });
            }
          });
        })
        .catch((err) => {
          console.warn("PWA ServiceWorker registration failed:", err);
        });
    }

    // Check if running on HTTP/HTTPS and dynamic fetch of curriculum.json succeeds
    if (window.location.protocol.startsWith("http")) {
      try {
        const fetched = await fetchCurriculumJSON();
        if (fetched && fetched.data && Array.isArray(fetched.data.nodes) && fetched.data.nodes.length > 0) {
          activeCurriculumData = fetched.data;
          activeCurriculumSource = fetched.source;
          const curBase = extractBasePatch(activeCurriculumData);
          const curInit = extractInitialState(activeCurriculumData);

          layer0Patches = layer0Patches.filter(p => p && p.patch_id !== "001_stem_polymath_curriculum");
          const idx = layer0Patches.findIndex(p => p.patch_id === curBase.patch_id);
          if (idx !== -1) {
            layer0Patches[idx] = structuredClone(curBase);
          } else {
            layer0Patches[0] = structuredClone(curBase);
          }

          if (!layer2State.navigation || !layer2State.navigation.MAIN) {
            layer2State.navigation = structuredClone(curInit.navigation);
          }
          if (Object.keys(layer2State.nodes).length === 0 && curInit.nodes) {
            layer2State.nodes = structuredClone(curInit.nodes);
          }
          persistAll();
          liveGraph = buildLiveGraph();
          computeLayout(liveGraph);
          renderAll();
        }
      } catch (err) {
        console.warn("Async fetch of curriculum.json failed:", err);
      }

      try {
        const fetchedPresets = await fetchPlaylistPresets();
        if (fetchedPresets && Array.isArray(fetchedPresets.data) && fetchedPresets.data.length > 0) {
          BUILTIN_PLAYLIST_PRESETS = fetchedPresets.data;
          activePlaylistPresetsSource = fetchedPresets.source;
          for (const preset of fetchedPresets.data) {
            const idx = storedPlaylists.findIndex(p => p.playlist_id === preset.playlist_id);
            if (idx !== -1) {
              storedPlaylists[idx] = structuredClone(preset);
            } else {
              storedPlaylists.push(structuredClone(preset));
            }
          }
          persistAll();
          renderTopbar();
        }
      } catch (err) {
        console.warn("Async fetch of playlist presets failed:", err);
      }
    }

    renderMathInContainer(document.getElementById("sidePane"));
  }

  initApp();

  window.addEventListener("load", () => {
    renderMathInContainer(document.getElementById("sidePane"));
  });

  window.polymathy = {
    get state() { return liveGraph; },
    computeLayout,
    getCurriculum: () => activeCurriculumData,
    getSource: () => activeCurriculumSource,
    loadGraphFromJSONString,
    reloadFromFile: async () => {
      const res = await fetchCurriculumJSON();
      if (res?.data) {
        loadGraphFromJSONString(JSON.stringify(res.data), res.source);
      }
    },
    getPlaylists: () => storedPlaylists,
    getActivePlaylist,
    setPlaylistStep,
    stepPlaylist,
    togglePlaylistSpotlight,
    openPlaylistsModal,
    reloadPresetsFromDirectory: async () => {
      const res = await fetchPlaylistPresets();
      if (res?.data && Array.isArray(res.data) && res.data.length > 0) {
        BUILTIN_PLAYLIST_PRESETS = res.data;
        activePlaylistPresetsSource = res.source;
        for (const preset of res.data) {
          const idx = storedPlaylists.findIndex(p => p.playlist_id === preset.playlist_id);
          if (idx !== -1) {
            storedPlaylists[idx] = structuredClone(preset);
          } else {
            storedPlaylists.push(structuredClone(preset));
          }
        }
        persistAll();
        renderTopbar();
        return res;
      }
      return null;
    },
    getPresetsSource: () => activePlaylistPresetsSource
  };
})();
</script>
</body>
