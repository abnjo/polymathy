          <button type="button" class="btn-xs" id="btnLinkPrereq" title="Add this prerequisite">+ Add Prerequisite</button>
        </div>
        ${lastPrereqCycleDiag ? `<div class="diag-warn">${escapeHtml(lastPrereqCycleDiag)}</div>` : ""}
      </div>
    `;

    /* Section 2: Overview & Notes */
    const introTag = node.state.introDone
      ? `<span class="tag done">Completed</span>`
      : `<span class="tag active">Pending</span>`;
    html += `
      <div class="box">
        <div class="box-header">
          <span class="box-title">Overview & Notes</span>
          ${introTag}
        </div>
        <div class="section-hint">Technical definition and summary of this concept. Click <strong>✏️ Edit Topic</strong> above to edit or add formulas ($LaTeX$ supported).</div>
        <div class="intro-prose" id="sideIntroProse">
          ${node.isStub && !node.intro
            ? `<em style="color:var(--text-muted);">Draft topic. Click <strong>✏️ Edit Topic</strong> above to write an overview or add formulas.</em>`
            : escapeHtml(node.intro || "No overview notes written yet.").replace(/\n/g, "<br>")
          }
        </div>
        <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-family:var(--font-mono);font-size:11.5px;font-weight:600;" title="Check when you understand the overview">
          <input type="checkbox" id="chkIntroDone" ${node.state.introDone ? "checked" : ""}>
          <span>Concept understood & vocabulary mastered</span>
        </label>
      </div>
    `;

    /* Section 3: Resources & Links (Fully Editable Inline) */
    const doneSrcCount = node.sources.filter(s => node.state.completedSourceIds.includes(s.id)).length;
    const srcRows = node.sources.length === 0
      ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">No resources attached. Add books, lecture playlists, or links below!</div>`
      : node.sources.map(src => {
          const checked = node.state.completedSourceIds.includes(src.id);
          const isEditingThis = editingSourceId === src.id;

          if (isEditingThis) {
            return `
              <div class="box inset" style="margin-bottom:6px;">
                <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;margin-bottom:4px;color:var(--text-muted);">EDIT RESOURCE</div>
                <div style="display:flex;flex-direction:column;gap:5px;">
                  <input type="text" id="editSrcTitle_${escapeHtml(src.id)}" value="${escapeHtml(src.title)}" placeholder="Resource Title">
                  <input type="text" id="editSrcUrl_${escapeHtml(src.id)}" value="${escapeHtml(src.url || "")}" placeholder="URL (optional)">
                  <div style="display:flex;justify-content:flex-end;gap:5px;">
                    <button type="button" class="btn-xs" data-cancel-edit-src>Cancel</button>
                    <button type="button" class="btn-xs primary" data-save-edit-src="${escapeHtml(src.id)}">Save</button>
                  </div>
                </div>
              </div>
            `;
          }

          return `
            <div class="list-row">
              <div class="list-row-left">
                <input type="checkbox" data-source-chk="${escapeHtml(src.id)}" ${checked ? "checked" : ""} title="Mark resource studied">
                <div class="list-row-main">
                  <div class="list-row-title ${checked ? "checked" : ""}">${escapeHtml(src.title)}</div>
                  ${src.url ? `<div class="list-row-sub"><a href="${escapeHtml(src.url)}" target="_blank" rel="noopener">${escapeHtml(src.url)}</a></div>` : ""}
                </div>
              </div>
              <div class="list-row-actions">
                <button type="button" class="btn-xs" data-edit-source="${escapeHtml(src.id)}" title="Edit resource title or link">✏️</button>
                <button type="button" class="btn-xs danger-btn" data-remove-source="${escapeHtml(src.id)}" title="Delete resource">✕</button>
              </div>
            </div>
          `;
        }).join("");

    html += `
      <div class="box">
        <div class="box-header">
          <span class="box-title">Resources & Study Materials</span>
          <span class="tag" title="Studied / Total">${doneSrcCount} / ${node.sources.length} Studied</span>
        </div>
        <div class="section-hint">Textbooks, video lectures, papers, or cheat sheets. Click <strong>✏️</strong> to edit or check them off as you study.</div>
        <div class="item-list">${srcRows}</div>
        <div class="inline-add-row">
          <input type="text" id="inputSourceTitle" placeholder="Book / Lecture / Article title..." title="Resource name">
          <input type="text" id="inputSourceUrl" placeholder="URL link (optional)" title="Optional link">
          <button type="button" class="btn-xs" id="btnAddSource" title="Attach new study resource">+ Add Resource</button>
        </div>
      </div>
    `;

    /* Section 4: Subtopics & Tasks (Fully Editable Inline) */
    const isLearningContainer = !!uiSettings.learnChecklistActive[headId] || node.childrenIds.length > 0;
    const subRows = node.childrenIds.length === 0
      ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">No subtopics yet. Add smaller component topics below to break down this concept!</div>`
      : node.childrenIds.map(cId => {
          const c = liveGraph.nodes.get(cId);
          if (!c) return "";
          const cpct = Math.round(c.progress * 100);
          const isEditingThis = editingSubtopicId === cId;

          if (isEditingThis) {
            return `
              <div class="box inset" style="margin-bottom:6px;">
                <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;margin-bottom:4px;color:var(--text-muted);">RENAME SUBTOPIC</div>
                <div style="display:flex;gap:5px;">
                  <input type="text" id="editSubTitle_${escapeHtml(cId)}" value="${escapeHtml(c.title)}" style="flex:1;">
                  <button type="button" class="btn-xs" data-cancel-edit-sub>Cancel</button>
                  <button type="button" class="btn-xs primary" data-save-edit-sub="${escapeHtml(cId)}">Save</button>
                </div>
              </div>
            `;
          }

          return `
            <div class="list-row">
              <div class="list-row-left">
                <input type="checkbox" data-subtopic-chk="${escapeHtml(cId)}" ${c.isBaselineDone ? "checked" : ""} title="Toggle completion for this subtopic">
                <div class="list-row-main">
                  <div class="list-row-title ${c.isBaselineDone ? "checked" : ""}">${escapeHtml(c.title)}</div>
                  <div class="list-row-sub">${cpct}% complete · ${c.childrenIds.length} subtopics</div>
                </div>
              </div>
              <div class="list-row-actions">
                <button type="button" class="btn-xs" data-edit-subtopic="${escapeHtml(cId)}" title="Rename subtopic">✏️</button>
                <button type="button" class="btn-xs head-btn" data-open-subtopic="${escapeHtml(cId)}" title="Open and inspect this subtopic">Open →</button>
                <button type="button" class="btn-xs danger-btn" data-delete-subtopic="${escapeHtml(cId)}" title="Delete this subtopic">✕</button>
              </div>
            </div>
          `;
        }).join("");

    html += `
      <div class="box">
        <div class="box-header">
          <span class="box-title">Subtopics & Tasks</span>
          <span class="tag" title="Direct child subtopics">${node.childrenIds.length} Subtopics</span>
        </div>
        <div class="section-hint">Divide this topic into component subtopics. Checking a subtopic advances the map conduit.</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">
          <button type="button" class="btn-xs ${uiSettings.learnChecklistActive[headId] ? "accent-btn" : ""}" id="btnLearnTopic" title="Toggle active checklist view">
            ${uiSettings.learnChecklistActive[headId] ? "Checklist Open ✓" : "Open Checklist"}
          </button>
          <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);">Hierarchy depth: ${node.depth}</span>
        </div>
        ${isLearningContainer ? `<div class="item-list">${subRows}</div>` : ""}
        <div class="inline-add-row">
          <input type="text" id="inputSubtopicTitle" placeholder="New subtopic title..." title="Type title and press enter">
          <button type="button" class="btn-xs" id="btnAddSubtopic" title="Add component subtopic">+ Add Subtopic</button>
        </div>
      </div>
    `;

    /* Section 5: Completion & Actions */
    html += `
      <div class="box">
        <div class="box-header">
          <span class="box-title">Completion & AI Tools</span>
          ${node.isBaselineDone ? `<span class="tag done">Completed ✓</span>` : `<span class="tag active">In Progress</span>`}
        </div>
        <div class="section-hint">Marking this topic complete permanently unlocks all downstream topics that depend on it.</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
          ${node.isBaselineDone
            ? `<button type="button" class="success-btn" disabled>Topic Completed ✓</button>`
            : `<button type="button" class="primary" id="btnMarkBaseline" title="Mark this topic complete to unblock downstream topics">Mark Topic Completed</button>`
          }
          <button type="button" id="btnCopyLlmSlice" title="Copy an AI prompt formatted for ChatGPT/Claude to expand this topic">Copy AI Prompt for Expanding</button>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:8px;">
          ${node.isBaselineDone
            ? "✓ Outgoing prerequisite arrows from this topic are dotted green across the graph. You can still add deeper subtopics anytime without re-locking downstream topics."
            : "Tip: You can return and deepen this topic with more subtopics later even after marking it complete."
          }
        </div>
      </div>
    `;

    side.innerHTML = html;
    renderMathInContainer(document.getElementById("sideIntroProse"));
    bindSidePanelEvents(node);
  }

  /* Inline Topic Editor (Edit Title, Move Parent Category, Edit Notes, Delete) */
  function renderTopicEditor(node) {
    const parentOptions = [...liveGraph.nodes.values()]
      .filter(n => n.id !== node.id && !isDescendantOf(n.id, node.id, liveGraph.nodes))
      .map(n => `<option value="${escapeHtml(n.id)}" ${n.id === node.parentId ? "selected" : ""}>${escapeHtml(n.title)} (${escapeHtml(n.id)})</option>`)
      .join("");

    return `
      <div class="box inset" style="margin-top:10px;">
        <div style="font-family:var(--font-mono);font-size:10.5px;font-weight:700;margin-bottom:6px;color:var(--text-muted);">EDIT TOPIC PROPERTIES</div>
        <div style="display:flex;flex-direction:column;gap:7px;">
          <div>
            <label style="display:block;font-size:11px;font-weight:600;margin-bottom:2px;">Title:</label>
            <input type="text" id="editNodeTitle" value="${escapeHtml(node.title)}" style="width:100%;" title="Topic name">
          </div>
          ${node.id !== "knowledge" ? `
            <div>
              <label style="display:block;font-size:11px;font-weight:600;margin-bottom:2px;">Parent Category (Move topic):</label>
              <select id="editNodeParent" style="width:100%;" title="Change where this topic sits in the hierarchy">
                ${parentOptions}
              </select>
            </div>
          ` : ""}
          <div>
            <label style="display:block;font-size:11px;font-weight:600;margin-bottom:2px;">Overview Notes ($LaTeX$ math supported):</label>
            <textarea id="editNodeIntro" rows="4" style="width:100%;">${escapeHtml(node.intro)}</textarea>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:4px;">
            ${node.id !== "knowledge" ? `<button type="button" class="btn-xs danger-btn" id="btnDeleteNode" title="Delete this topic">Delete Topic</button>` : "<span></span>"}
            <div style="display:flex;gap:6px;">
              <button type="button" class="btn-xs" id="btnCancelEditTopic">Cancel</button>
              <button type="button" class="btn-xs primary" id="btnSaveHeaderEdit">Save Changes</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function isDescendantOf(candidateId, ancestorId, nodeMap) {
    let cur = nodeMap.get(candidateId);
    const seen = new Set();
    while (cur && cur.parentId && !seen.has(cur.id)) {
      seen.add(cur.id);
      if (cur.parentId === ancestorId) return true;
      cur = nodeMap.get(cur.parentId);
    }
    return false;
  }

  /* Bind Side Panel Interactive Events */
  function bindSidePanelEvents(node) {
    const headId = node.id;

    // Detour links & Back
    document.querySelectorAll("[data-detour-idx]").forEach(el => {
      el.addEventListener("click", () => jumpToDetourFrame(Number(el.dataset.detourIdx)));
    });
    const btnSideBack = document.getElementById("btnSideGetBack");
    if (btnSideBack) btnSideBack.addEventListener("click", (e) => { e.preventDefault(); popDetour(); });

    // Set as MAIN Target
    const btnSetMain = document.getElementById("btnSetAsMain");
    if (btnSetMain) btnSetMain.addEventListener("click", setHeadAsMain);

    // Edit Topic Toggle
    const btnEdit = document.getElementById("btnToggleEditTopic");
    if (btnEdit) {
      btnEdit.addEventListener("click", () => {
        isEditingTopicDetails = !isEditingTopicDetails;
        renderSidePanel();
      });
    }
    const btnCancelEdit = document.getElementById("btnCancelEditTopic");
    if (btnCancelEdit) {
      btnCancelEdit.addEventListener("click", () => {
        isEditingTopicDetails = false;
        renderSidePanel();
      });
    }

    // Save Topic Details
    const btnSaveEdit = document.getElementById("btnSaveHeaderEdit");
    if (btnSaveEdit) {
      btnSaveEdit.addEventListener("click", () => {
        const newTitle = document.getElementById("editNodeTitle").value.trim();
        const newIntro = document.getElementById("editNodeIntro").value;
        const newParentSelect = document.getElementById("editNodeParent");
        const newParent = newParentSelect ? newParentSelect.value : null;

        if (!newTitle) return;

        // Save title and intro override
        if (!layer1Overrides.field_overrides[headId]) layer1Overrides.field_overrides[headId] = {};
        layer1Overrides.field_overrides[headId].title = newTitle;
        layer1Overrides.field_overrides[headId].intro = newIntro;

        // Save reparenting if changed
        if (newParent && newParent !== node.parentId) {
          layer1Overrides.reparents[headId] = newParent;
        }

        isEditingTopicDetails = false;
        persistAll();
        renderAll();
        showToast("Topic details saved.");
      });
    }

    // Delete Topic
    const btnDel = document.getElementById("btnDeleteNode");
    if (btnDel) {
      btnDel.addEventListener("click", () => {
        if (headId === "knowledge") return;
        if (!confirm(`Delete topic "${node.title}"?`)) return;
        if (!layer1Overrides.tombstones.includes(headId)) layer1Overrides.tombstones.push(headId);
        layer2State.navigation.HEAD = node.parentId || "knowledge";
        isEditingTopicDetails = false;
        persistAll();
        renderAll();
        showToast("Topic deleted.");
      });
    }

    // Prerequisites Gate: Detour & Remove
    document.querySelectorAll("[data-detour-id]").forEach(btn => {
      btn.addEventListener("click", () => detourTo(btn.dataset.detourId));
    });
    document.querySelectorAll("[data-remove-prereq]").forEach(btn => {
      btn.addEventListener("click", () => {
        const pId = btn.dataset.removePrereq;
        const delta = ensureEdgeDelta(headId);
        delta.addPrereqs = delta.addPrereqs.filter(x => x !== pId);
        if (!delta.removePrereqs.includes(pId)) delta.removePrereqs.push(pId);
        lastPrereqCycleDiag = "";
        persistAll();
        renderAll();
        showToast("Prerequisite removed.");
      });
    });

    const searchInp = document.getElementById("inputPrereqSearch");
    if (searchInp) {
      searchInp.addEventListener("input", () => {
        prereqSearchQuery = searchInp.value;
        const sel = document.getElementById("selectPrereqCandidate");
        const candidates = [...liveGraph.nodes.values()]
          .filter(n => n.id !== headId && n.id !== "knowledge" && !node.prereqIds.includes(n.id))
          .filter(n => !prereqSearchQuery || n.title.toLowerCase().includes(prereqSearchQuery.toLowerCase()) || n.id.toLowerCase().includes(prereqSearchQuery.toLowerCase()))
          .slice(0, 40);
        sel.innerHTML = `<option value="">-- Choose prerequisite --</option>` +
          candidates.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.title)} (${escapeHtml(c.id)})</option>`).join("");
      });
    }

    const btnLinkPrereq = document.getElementById("btnLinkPrereq");
    if (btnLinkPrereq) {
      btnLinkPrereq.addEventListener("click", () => {
        const candId = document.getElementById("selectPrereqCandidate").value;
        if (!candId) return;
        const cycle = findPrereqCycle(liveGraph.nodes, candId, headId);
        if (cycle) {
          const names = cycle.map(id => (liveGraph.nodes.get(id)?.title || id)).join(" → ");
          lastPrereqCycleDiag = `CYCLE DETECTED: Linking "${candId}" → "${headId}" creates an impossible dependency loop: ${names}`;
          renderSidePanel();
          return;
        }
        lastPrereqCycleDiag = "";
        const delta = ensureEdgeDelta(headId);
        delta.removePrereqs = delta.removePrereqs.filter(x => x !== candId);
        if (!delta.addPrereqs.includes(candId)) delta.addPrereqs.push(candId);
        persistAll();
        renderAll();
        showToast("Prerequisite added.");
      });
    }

    // Concept Intro Checkbox
    const chkIntro = document.getElementById("chkIntroDone");
    if (chkIntro) {
      chkIntro.addEventListener("change", () => {
        ensureNodeState(headId).introDone = chkIntro.checked;
        persistAll();
        renderAll();
      });
    }

    // Resources / Sources: Checkbox, Edit, Remove, Add
    document.querySelectorAll("[data-source-chk]").forEach(chk => {
      chk.addEventListener("change", () => {
        const sId = chk.dataset.sourceChk;
        const st = ensureNodeState(headId);
        if (chk.checked) {
          if (!st.completedSourceIds.includes(sId)) st.completedSourceIds.push(sId);
        } else {
          st.completedSourceIds = st.completedSourceIds.filter(x => x !== sId);
        }
        persistAll();
        renderAll();
      });
    });

    document.querySelectorAll("[data-edit-source]").forEach(btn => {
      btn.addEventListener("click", () => {
        editingSourceId = btn.dataset.editSource;
        renderSidePanel();
      });
    });

    document.querySelectorAll("[data-cancel-edit-src]").forEach(btn => {
      btn.addEventListener("click", () => {
        editingSourceId = null;
        renderSidePanel();
      });
    });

    document.querySelectorAll("[data-save-edit-src]").forEach(btn => {
      btn.addEventListener("click", () => {
        const sId = btn.dataset.saveEditSrc;
        const newTitle = document.getElementById(`editSrcTitle_${sId}`).value.trim();
        const newUrl = document.getElementById(`editSrcUrl_${sId}`).value.trim();
        if (!newTitle) return;

        const delta = ensureEdgeDelta(headId);
        // If in delta addSources, update directly
        const inAdd = delta.addSources.find(s => s.id === sId);
        if (inAdd) {
          inAdd.title = newTitle;
          inAdd.url = newUrl || undefined;
        } else {
          // Remove old base source and add updated version
          if (!delta.removeSourceIds.includes(sId)) delta.removeSourceIds.push(sId);
          delta.addSources.push({ id: sId, title: newTitle, url: newUrl || undefined });
        }

        editingSourceId = null;
        persistAll();
        renderAll();
        showToast("Resource updated.");
      });
    });

    document.querySelectorAll("[data-remove-source]").forEach(btn => {
      btn.addEventListener("click", () => {
        const sId = btn.dataset.removeSource;
        const delta = ensureEdgeDelta(headId);
        delta.addSources = delta.addSources.filter(s => s.id !== sId);
        if (!delta.removeSourceIds.includes(sId)) delta.removeSourceIds.push(sId);
        persistAll();
        renderAll();
        showToast("Resource deleted.");
      });
    });

    const btnAddSrc = document.getElementById("btnAddSource");
    if (btnAddSrc) {
      btnAddSrc.addEventListener("click", () => {
        const title = document.getElementById("inputSourceTitle").value.trim();
        const url = document.getElementById("inputSourceUrl").value.trim();
        if (!title) return;
        const delta = ensureEdgeDelta(headId);
        const newSrc = { id: `src_u_${Date.now().toString(36)}`, title };
        if (url) newSrc.url = url;
        delta.addSources.push(newSrc);
        persistAll();
        renderAll();
        showToast("Resource added.");
      });
    }

    // Subtopics: Checklist open, Completion, Rename, Delete, Add
    const btnLearn = document.getElementById("btnLearnTopic");
    if (btnLearn) {
      btnLearn.addEventListener("click", () => {
        uiSettings.learnChecklistActive[headId] = !uiSettings.learnChecklistActive[headId];
        if (uiSettings.learnChecklistActive[headId]) ensureNodeState(headId).expandedOnMap = true;
        persistAll();
        renderAll();
      });
    }

    document.querySelectorAll("[data-subtopic-chk]").forEach(chk => {
      chk.addEventListener("change", () => {
        const cId = chk.dataset.subtopicChk;
        ensureNodeState(cId).baselineDone = chk.checked;
        persistAll();
        renderAll();
      });
    });

    document.querySelectorAll("[data-open-subtopic]").forEach(btn => {
      btn.addEventListener("click", () => {
        const cId = btn.dataset.openSubtopic;
        layer2State.navigation.detourStack.push(headId);
        layer2State.navigation.HEAD = cId;
        ensureNodeState(headId).expandedOnMap = true;
        persistAll();
        ensureAncestorsExpanded(cId);
        renderAll();
        locateNode(cId, 0.96);
      });
    });

    document.querySelectorAll("[data-edit-subtopic]").forEach(btn => {
      btn.addEventListener("click", () => {
        editingSubtopicId = btn.dataset.editSubtopic;
        renderSidePanel();
      });
    });

    document.querySelectorAll("[data-cancel-edit-sub]").forEach(btn => {
      btn.addEventListener("click", () => {
        editingSubtopicId = null;
        renderSidePanel();
      });
    });

    document.querySelectorAll("[data-save-edit-sub]").forEach(btn => {
      btn.addEventListener("click", () => {
        const cId = btn.dataset.saveEditSub;
        const newTitle = document.getElementById(`editSubTitle_${cId}`).value.trim();
        if (!newTitle) return;
        if (!layer1Overrides.field_overrides[cId]) layer1Overrides.field_overrides[cId] = {};
        layer1Overrides.field_overrides[cId].title = newTitle;
        editingSubtopicId = null;
        persistAll();
        renderAll();
        showToast("Subtopic renamed.");
      });
    });

    document.querySelectorAll("[data-delete-subtopic]").forEach(btn => {
      btn.addEventListener("click", () => {
        const cId = btn.dataset.deleteSubtopic;
        if (!confirm(`Delete subtopic "${liveGraph.nodes.get(cId)?.title || cId}"?`)) return;
        if (!layer1Overrides.tombstones.includes(cId)) layer1Overrides.tombstones.push(cId);
        persistAll();
        renderAll();
        showToast("Subtopic deleted.");
      });
    });

    const btnAddSub = document.getElementById("btnAddSubtopic");
    if (btnAddSub) {
      const addSubFn = () => {
        const title = document.getElementById("inputSubtopicTitle").value.trim();
        if (!title) return;
        const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "subtopic";
        let newId = `${headId === "knowledge" ? "" : headId + "."}${slug}`;
        let counter = 2;
        while (liveGraph.nodes.has(newId)) {
          newId = `${headId === "knowledge" ? "" : headId + "."}${slug}_${counter++}`;
        }
        layer1Overrides.custom_nodes.push({
          id: newId,
          title,
          parentId: headId,
          prereqIds: [],
          intro: "",
          sources: []
        });
        ensureNodeState(headId).expandedOnMap = true;
        uiSettings.learnChecklistActive[headId] = true;
        persistAll();
        renderAll();
        showToast(`Added subtopic "${title}".`);
      };
      btnAddSub.addEventListener("click", addSubFn);
      document.getElementById("inputSubtopicTitle").addEventListener("keydown", (e) => {
        if (e.key === "Enter") addSubFn();
      });
    }

    // Mark Baseline Completed
    const btnBase = document.getElementById("btnMarkBaseline");
    if (btnBase) {
      btnBase.addEventListener("click", () => {
        const st = ensureNodeState(headId);
        st.baselineDone = true;
        st.introDone = true;
        persistAll();
        renderAll();
        showToast("Topic marked completed! Dependent topics unlocked.");
      });
    }

    const btnCopyLlm = document.getElementById("btnCopyLlmSlice");
    if (btnCopyLlm) {
      btnCopyLlm.addEventListener("click", () => copyLlmExpansionSlice(node));
    }
  }

  function ensureEdgeDelta(id) {
    if (!layer1Overrides.edge_deltas[id]) {
      layer1Overrides.edge_deltas[id] = {
        addPrereqs: [],
        removePrereqs: [],
        addSources: [],
        removeSourceIds: []
      };
    }
    return layer1Overrides.edge_deltas[id];
  }

  /* =========================================================================
   * 9. LLM EXPANSION SLICER
   * ========================================================================= */
  function buildLlmExpansionPrompt(node) {
    const existingChildren = node.childrenIds.map(cId => liveGraph.nodes.get(cId)?.title || cId);
    const catalog = [...liveGraph.nodes.values()]
      .filter(n => n.id !== "knowledge" && n.parentId !== node.id)
      .slice(0, 50)
      .map(n => `${n.id}: ${n.title}`);

    return [
      `Extend this Polymathy knowledge topic with deeper subtopics and cross-branch prerequisites.`,
      ``,
      `TARGET TOPIC:`,
      `- id: ${node.id}`,
      `- title: ${node.title}`,
      `- path: ${formatTruncatedDirectory(node.id, liveGraph.nodes)}`,
      `- summary: ${node.intro || "(empty)"}`,
      ``,
      `EXISTING DIRECT SUBTOPICS (do not duplicate):`,
      existingChildren.length ? existingChildren.map(t => `- ${t}`).join("\n") : "- (none)",
      ``,
      `EXISTING GRAPH TOPICS (use these IDs for cross-branch prerequisites when applicable):`,
      catalog.join("\n"),
      ``,
      `OUTPUT STRICT JSON ONLY matching this Delta Patch schema:`,
      `{`,
      `  "patch_id": "${node.id.replace(/\./g, "_")}_expansion",`,
      `  "extensions": [`,
      `    { "targetId": "${node.id}", "addPrereqs": [], "addSources": [{ "id": "src_...", "title": "..." }] }`,
      `  ],`,
      `  "nodes": [`,
      `    {`,
      `      "id": "${node.id}.<subtopic_slug>",`,
      `      "title": "Subtopic Name",`,
      `      "parentId": "${node.id}",`,
      `      "prereqIds": [],`,
      `      "intro": "Concise technical summary ($LaTeX$ supported).",`,
      `      "sources": []`,
      `    }`,
      `  ]`,
      `}`
    ].join("\n");
  }

  async function copyLlmExpansionSlice(node) {
    const promptText = buildLlmExpansionPrompt(node);
    let copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(promptText);
        copied = true;
      }
    } catch { /* Fallback */ }

    if (copied) {
      showToast("AI expansion prompt copied to clipboard!");
    } else {
      openModal("AI EXPANSION PROMPT", `
        <div class="box">
          <div class="box-header"><span class="box-title">COPY THIS PROMPT INTO ANY AI</span><span class="tag ready">Prompt</span></div>
          <div class="section-hint">Paste this into ChatGPT, Claude, or Gemini to automatically generate subtopics. Then import the output via <strong>+ Import</strong> in the topbar.</div>
          <textarea rows="18" style="width:100%;font-family:var(--font-mono);font-size:11px;" readonly>${escapeHtml(promptText)}</textarea>
        </div>
      `);
    }
  }

  /* Frontier Radar */
  function openFrontierRadarModal() {
    const allTopics = [...liveGraph.nodes.values()].filter(n => n.id !== "knowledge");
    const readyQueue = allTopics.filter(n => !n.isBaselineDone && !n.isBlocked);
    const bottlenecks = allTopics
      .filter(n => !n.isBaselineDone)
      .map(n => {
        let count = 0;
        const visited = new Set();
        const queue = [n.id];
        while (queue.length > 0) {
          const u = queue.shift();
          const node = liveGraph.nodes.get(u);
          if (!node) continue;
          for (const depId of node.dependentsIds) {
            if (!visited.has(depId)) {
              visited.add(depId);
              const dep = liveGraph.nodes.get(depId);
              if (dep && !dep.isBaselineDone) count++;
              queue.push(depId);
            }
          }
        }
        return { node: n, blockingCount: count };
      })
      .filter(x => x.blockingCount > 0)
      .sort((a, b) => b.blockingCount - a.blockingCount);

    const readyHtml = readyQueue.slice(0, 18).map(n => `
      <div class="list-row">
        <div class="list-row-left">
          <span class="tag ready">Ready to Learn</span>
          <div class="list-row-main">
            <div class="list-row-title">${escapeHtml(n.title)}</div>
            <div class="list-row-sub">${escapeHtml(formatTruncatedDirectory(n.id, liveGraph.nodes))}</div>
          </div>
        </div>
        <button type="button" class="btn-xs head-btn" data-radar-jump="${escapeHtml(n.id)}">Inspect →</button>
      </div>
    `).join("") || `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">All prerequisites cleared!</div>`;

    const bottleHtml = bottlenecks.slice(0, 12).map(({ node: n, blockingCount }) => `
      <div class="list-row">
        <div class="list-row-left">
          <span class="tag needed">Unblocks ${blockingCount} topics</span>
          <div class="list-row-main">
            <div class="list-row-title">${escapeHtml(n.title)}</div>
            <div class="list-row-sub">${escapeHtml(formatTruncatedDirectory(n.id, liveGraph.nodes))}</div>
          </div>
        </div>
        <button type="button" class="btn-xs head-btn" data-radar-jump="${escapeHtml(n.id)}">Inspect →</button>
      </div>
    `).join("") || `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">No blocking bottlenecks remaining.</div>`;

    openModal("FRONTIER RADAR // STUDY ASSISTANT", `
      <div class="box">
        <div class="box-header">
          <span class="box-title">MAIN GOAL SPOTLIGHT</span>
          <span class="tag ${uiSettings.spotlightMain ? "edited" : ""}">${uiSettings.spotlightMain ? "Spotlight Active" : "Off"}</span>
        </div>
        <div class="section-hint">Dim unrelated branches on the map to spotlight only the pathway leading into your main study goal: <strong>${escapeHtml(liveGraph.nodes.get(liveGraph.navigation.MAIN)?.title || "")}</strong>.</div>
        <button type="button" class="accent-btn" id="btnToggleSpotlightModal">${uiSettings.spotlightMain ? "Turn Off Spotlight" : "Spotlight Main Goal Path"}</button>
      </div>

      <div class="box">
        <div class="box-header">
          <span class="box-title">1. Ready to Study (Prerequisites Met)</span>
          <span class="tag done">${readyQueue.length} Ready</span>
        </div>
        <div class="section-hint">Topics that are unlocked right now. You have all prerequisite foundations ready!</div>
        <div class="item-list">${readyHtml}</div>
      </div>

      <div class="box">
        <div class="box-header">
          <span class="box-title">2. High-Leverage Bottlenecks</span>
          <span class="tag needed">${bottlenecks.length} Key Topics</span>
        </div>
        <div class="section-hint">Topics that unlock the largest number of downstream subjects once completed.</div>
        <div class="item-list">${bottleHtml}</div>
      </div>
    `);

    document.getElementById("btnToggleSpotlightModal").addEventListener("click", () => {
      uiSettings.spotlightMain = !uiSettings.spotlightMain;
      persistAll();
      renderAll();
      closeModal();
    });
    document.querySelectorAll("[data-radar-jump]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.radarJump;
        layer2State.navigation.HEAD = id;
        layer2State.navigation.detourStack = [];
        persistAll();
        closeModal();
        ensureAncestorsExpanded(id);
        renderAll();
        locateNode(id, 0.98);
      });
    });
  }

  /* Import Patch Modal */
  function openImportPatchModal() {
    openModal("+ IMPORT CURRICULUM PATCH", `
      <div class="box">
        <div class="box-header">
          <span class="box-title">PASTE JSON OR UPLOAD .JSON PATCH FILE</span>
          <span class="tag ready">Schema Validated</span>
        </div>
        <div class="section-hint">Import AI-generated curriculum expansions or topic bundles. Validates acyclicity to prevent dependency loops.</div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;">
          <input type="file" id="patchFileInput" accept=".json,application/json">
        </div>
        <textarea id="patchJsonInput" rows="12" style="width:100%;font-family:var(--font-mono);font-size:11px;" placeholder='{ "patch_id": "...", "extensions": [], "nodes": [] }'></textarea>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;">
          <button type="button" id="btnPreviewPatch">Validate</button>
          <button type="button" class="primary" id="btnMergePatch">Import & Merge</button>
        </div>
        <div id="patchDiagOutput"></div>
      </div>
    `);

    document.getElementById("patchFileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { document.getElementById("patchJsonInput").value = reader.result; };
      reader.readAsText(file);
    });

    function parseAndValidatePatch() {
      const diag = document.getElementById("patchDiagOutput");
      let parsed;
      try {
        parsed = JSON.parse(document.getElementById("patchJsonInput").value);
      } catch (err) {
        diag.innerHTML = `<div class="diag-warn">JSON Syntax Error: ${escapeHtml(err.message)}</div>`;
        return null;
      }
      if (!parsed || typeof parsed !== "object" || (!Array.isArray(parsed.nodes) && !Array.isArray(parsed.extensions))) {
        diag.innerHTML = `<div class="diag-warn">Invalid Format: Must include "nodes" or "extensions" array.</div>`;
        return null;
      }

      const testPatches = [...layer0Patches, parsed];
      const { map: mergedMap } = foldLayer0And1(testPatches, layer1Overrides);
      const cycle = validateFullDagAcyclicity(mergedMap);
      if (cycle) {
        diag.innerHTML = `<div class="diag-warn">Acyclicity Error: Introduces dependency loop: ${escapeHtml(cycle.join(" → "))}</div>`;
        return null;
      }

      const newNodes = (parsed.nodes || []).filter(n => !liveGraph.nodes.has(n.id));
      diag.innerHTML = `<div class="diag-info">✓ Valid curriculum patch! +${newNodes.length} new topics detected with zero cycles.</div>`;
      return parsed;
    }

    document.getElementById("btnPreviewPatch").addEventListener("click", parseAndValidatePatch);
    document.getElementById("btnMergePatch").addEventListener("click", () => {
      const parsed = parseAndValidatePatch();
      if (!parsed) return;
      layer0Patches.push(parsed);
      persistAll();
      renderAll();
      closeModal();
      showToast(`Imported patch "${parsed.patch_id || "custom"}".`);
    });
  }

  /* Storage & Backups Modal */
  function openLayerInspectorModal() {
    const fieldCount = Object.keys(layer1Overrides.field_overrides || {}).length;
    const edgeCount = Object.keys(layer1Overrides.edge_deltas || {}).length;
    const customCount = (layer1Overrides.custom_nodes || []).length;
    const tombCount = (layer1Overrides.tombstones || []).length;

    const overriddenRows = [...liveGraph.overriddenIds].map(id => {
      const n = liveGraph.nodes.get(id);
      return `
        <div class="list-row">
          <div class="list-row-left">
            <span class="tag edited">Modified</span>
            <div class="list-row-main">
              <div class="list-row-title">${escapeHtml(n ? n.title : id)}</div>
              <div class="list-row-sub">${escapeHtml(id)}</div>
            </div>
          </div>
          <button type="button" class="btn-xs" data-revert-override="${escapeHtml(id)}">Reset to Default</button>
        </div>
      `;
    }).join("") || `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">No modified topics. All topics are on default curriculum settings.</div>`;

    openModal("STORAGE, EDITS & BACKUPS", `
      <div class="box">
        <div class="box-header">
          <span class="box-title">YOUR LOCAL EDITS</span>
          <span class="tag edited">${customCount} new topics · ${fieldCount} renamed · ${edgeCount} edge edits · ${tombCount} deleted</span>
        </div>
        <div class="section-hint">All edits you make in the UI are safely stored locally in your browser.</div>
        <div class="item-list" style="margin-bottom:10px;">${overriddenRows}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="accent-btn" id="btnExportBundle">Download Full Backup Bundle (.json)</button>
          <button type="button" class="danger-btn" id="btnClearLayer1">Discard All Local Edits</button>
        </div>
      </div>

      <div class="box">
        <div class="box-header">
          <span class="box-title">RESTORE BACKUP</span>
          <span class="tag ready">JSON</span>
        </div>
        <div class="section-hint">Select a backup file (.json) to restore your topics and progress:</div>
        <input type="file" id="importBundleInput" accept=".json,application/json">
        <div style="margin-top:10px;">
          <button type="button" class="danger-btn" id="btnResetDemo">Reset Graph to Initial Starter Demo</button>
        </div>
      </div>
    `);

    document.querySelectorAll("[data-revert-override]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.revertOverride;
        delete layer1Overrides.field_overrides[id];
        delete layer1Overrides.edge_deltas[id];
        delete layer1Overrides.reparents[id];
        layer1Overrides.custom_nodes = layer1Overrides.custom_nodes.filter(n => n.id !== id);
        persistAll();
        renderAll();
        openLayerInspectorModal();
        showToast(`Reset "${id}" to default.`);
      });
    });

    document.getElementById("btnClearLayer1").addEventListener("click", () => {
      if (!confirm("Are you sure you want to discard all local edits and custom topics?")) return;
      layer1Overrides = EMPTY_OVERRIDES();
      persistAll();
      renderAll();
      openLayerInspectorModal();
    });

    document.getElementById("btnExportBundle").addEventListener("click", () => {
      downloadJson("polymathy_backup_bundle.json", {
        patches: layer0Patches,
        user_overrides: layer1Overrides,
        state: layer2State
      });
    });

    document.getElementById("btnResetDemo").addEventListener("click", () => {
      if (!confirm("Reset all topics, progress, and edits back to initial demo?")) return;
      layer0Patches = [structuredClone(SEED_PATCH_001)];
      layer1Overrides = EMPTY_OVERRIDES();
      layer2State = structuredClone(SEED_STATE);
      uiSettings.spotlightMain = false;
      persistAll();
      renderAll();
      closeModal();
      fitVisibleGraph();
      showToast("Reset to initial starter demo.");
    });

    document.getElementById("importBundleInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (Array.isArray(data.patches)) layer0Patches = data.patches;
          if (data.user_overrides) layer1Overrides = Object.assign(EMPTY_OVERRIDES(), data.user_overrides);
          if (data.state) layer2State = data.state;
          persistAll();
          renderAll();
          closeModal();
          fitVisibleGraph();
          showToast("Backup restored successfully.");
        } catch (err) {
          alert("Invalid backup file: " + err.message);
        }
      };
      reader.readAsText(file);
    });
  }

  function downloadJson(filename, obj) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

              <tr><td><strong>Pan / Scroll Canvas</strong></td><td>Mouse drag on background • 2-finger swipe on trackpad • 1-finger swipe on touch screens • On-screen arrow buttons ◀ ▲ ▼ ▶</td></tr>
              <tr><td><strong>Zoom In / Out</strong></td><td>Mouse wheel (or Ctrl+Scroll) • Pinch gesture with 2 fingers on touch screens / trackpads • HUD [+][-] buttons</td></tr>
              <tr><td><strong>Jump to Main Goal</strong></td><td>Press key <code class="inline">M</code> or click <strong>[Locate]</strong> in topbar</td></tr>
              <tr><td><strong>Jump to Inspected Topic</strong></td><td>Press key <code class="inline">H</code> or click <strong>[Locate]</strong> in topbar</td></tr>
              <tr><td><strong>Return from Detour / Close Modal</strong></td><td>Press key <code class="inline">Esc</code> or click <strong>[← Back]</strong></td></tr>

    document.querySelectorAll(".manual-tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".manual-tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".manual-tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        const panel = document.getElementById(btn.dataset.mtab);
        panel.classList.add("active");
        renderMathInContainer(panel);
      });

  }

  /* =========================================================================
   * 11. CANVAS INTERACTION ENGINE (Mouse Pan, Wheel Scroll/Zoom, Touch Gestures)
   * ========================================================================= */
  function setupInteractions() {
    const svg = document.getElementById("dagSvg");
    const canvasPane = document.getElementById("canvasPane");

    let isMousePanning = false;
    let panStart = { x: 0, y: 0, camX: 0, camY: 0 };
    let dragDistance = 0;

    /* Mouse Panning */
    svg.addEventListener("mousedown", (e) => {
      if (e.button !== 0 && e.button !== 1) return;
      cancelCameraAnim();
      isMousePanning = true;
      svg.classList.add("panning");
      dragDistance = 0;
      panStart = { x: e.clientX, y: e.clientY, camX: camera.x, camY: camera.y };
    });

    window.addEventListener("mousemove", (e) => {
      if (!isMousePanning) return;
      const dx = e.clientX - panStart.x;
      const dy = e.clientY - panStart.y;
      dragDistance = Math.hypot(dx, dy);
      camera.x = panStart.camX + dx;
      camera.y = panStart.camY + dy;
      applyWorldTransform();
    });

    window.addEventListener("mouseup", () => {
      if (!isMousePanning) return;
      isMousePanning = false;
      svg.classList.remove("panning");
    });

    /* Wheel Handling: Natural Canvas Scrolling vs Zooming */
    canvasPane.addEventListener("wheel", (e) => {
      e.preventDefault();
      cancelCameraAnim();

      if (e.ctrlKey || e.metaKey || uiSettings.wheelMode === "zoom") {
        // Zoom anchored at cursor
        const rect = canvasPane.getBoundingClientRect();
        const mx = e.clientX - rect.left - rect.width / 2;
        const my = e.clientY - rect.top - rect.height / 2;
        const worldX = (mx - camera.x) / camera.k;
        const worldY = (my - camera.y) / camera.k;
        const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
        const nextK = Math.max(0.2, Math.min(2.8, camera.k * factor));
        camera.k = nextK;
        camera.x = mx - worldX * nextK;
        camera.y = my - worldY * nextK;
      } else {
        // Natural Pan / Scroll by wheel / 2-finger trackpad delta
        camera.x -= e.deltaX;
        camera.y -= e.deltaY;
      }
      applyWorldTransform();
    }, { passive: false });

    /* Native Multi-Touch Handling (1-finger Pan, 2-finger Pinch Zoom) */
    let touchState = {
      active: false,
      mode: null,
      startX: 0,
      startY: 0,
      camStartX: 0,
      camStartY: 0,
      startDist: 0,
      startK: 1
    };

    canvasPane.addEventListener("touchstart", (e) => {
      cancelCameraAnim();
      if (e.touches.length === 1) {
        touchState.active = true;
        touchState.mode = "pan";
        touchState.startX = e.touches[0].clientX;
        touchState.startY = e.touches[0].clientY;
        touchState.camStartX = camera.x;
        touchState.camStartY = camera.y;
      } else if (e.touches.length >= 2) {
        touchState.active = true;
        touchState.mode = "pinch";
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchState.startDist = Math.hypot(dx, dy) || 1;
        touchState.startK = camera.k;
      }
    }, { passive: true });

    canvasPane.addEventListener("touchmove", (e) => {
      if (!touchState.active) return;
      if (touchState.mode === "pan" && e.touches.length === 1) {
        const dx = e.touches[0].clientX - touchState.startX;
        const dy = e.touches[0].clientY - touchState.startY;
        camera.x = touchState.camStartX + dx;
        camera.y = touchState.camStartY + dy;
        applyWorldTransform();
      } else if (touchState.mode === "pinch" && e.touches.length >= 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy) || 1;
        const scale = dist / touchState.startDist;
        camera.k = Math.max(0.2, Math.min(2.8, touchState.startK * scale));
        applyWorldTransform();
      }
    }, { passive: true });

    canvasPane.addEventListener("touchend", () => {
      touchState.active = false;
      touchState.mode = null;
    });

    /* Minimap Drag & Toggle */
    const miniSvg = document.getElementById("minimapSvg");
    let miniDragging = false;
    function panFromMinimapEvent(e) {
      const rect = miniSvg.getBoundingClientRect();
      const rx = (e.clientX - rect.left) / Math.max(1, rect.width);
      const ry = (e.clientY - rect.top) / Math.max(1, rect.height);
      const wx = minimapBounds.minX + rx * (minimapBounds.maxX - minimapBounds.minX);
      const wy = minimapBounds.minY + ry * (minimapBounds.maxY - minimapBounds.minY);
      cancelCameraAnim();
      camera.x = -wx * camera.k;
      camera.y = -wy * camera.k;
      applyWorldTransform();
    }
    miniSvg.addEventListener("mousedown", (e) => { miniDragging = true; panFromMinimapEvent(e); });
    window.addEventListener("mousemove", (e) => { if (miniDragging) panFromMinimapEvent(e); });
    window.addEventListener("mouseup", () => { miniDragging = false; });

    document.getElementById("btnToggleMinimap").addEventListener("click", () => {
      uiSettings.minimapMinimized = !uiSettings.minimapMinimized;
      document.getElementById("minimapWrap").classList.toggle("minimized", uiSettings.minimapMinimized);
      document.getElementById("btnToggleMinimap").textContent = uiSettings.minimapMinimized ? "+" : "−";
      persistAll();
    });
    if (uiSettings.minimapMinimized) {
      document.getElementById("minimapWrap").classList.add("minimized");
      document.getElementById("btnToggleMinimap").textContent = "+";
    }

    /* Resizable Splitter */
    const splitter = document.getElementById("splitter");
    const sidePane = document.getElementById("sidePane");
    if (uiSettings.sidePaneWidth) sidePane.style.width = uiSettings.sidePaneWidth + "px";
    let splitDragging = false;

    splitter.addEventListener("mousedown", () => {
      splitDragging = true;
      splitter.classList.add("dragging");
    });
    window.addEventListener("mousemove", (e) => {
      if (!splitDragging) return;
      const totalW = document.getElementById("workspace").clientWidth;
      const newSideW = Math.max(300, Math.min(totalW - 320, totalW - e.clientX));
      sidePane.style.width = newSideW + "px";
      uiSettings.sidePaneWidth = newSideW;
      applyWorldTransform();
    });
    window.addEventListener("mouseup", () => {
      if (!splitDragging) return;
      splitDragging = false;
      splitter.classList.remove("dragging");
      persistAll();
    });

    /* Topbar Controls */
    document.getElementById("btnLocateMain").addEventListener("click", () => locateNode(liveGraph.navigation.MAIN, 0.98));
    document.getElementById("btnLocateHead").addEventListener("click", () => locateNode(liveGraph.navigation.HEAD, 0.98));
    document.getElementById("btnNewTopicTop").addEventListener("click", () => openNewTopicModal());
    document.getElementById("btnFloatingGetBack").addEventListener("click", popDetour);

    document.getElementById("btnToggleLayout").addEventListener("click", () => {
      uiSettings.layoutMode = uiSettings.layoutMode === "tree" ? "radial" : "tree";
      persistAll();
      renderAll();
      fitVisibleGraph();
    });

    document.getElementById("btnFrontierRadar").addEventListener("click", openFrontierRadarModal);
    document.getElementById("btnImportPatch").addEventListener("click", openImportPatchModal);
    document.getElementById("btnLayerInspector").addEventListener("click", openLayerInspectorModal);
    document.getElementById("btnManual").addEventListener("click", openManualModal);
    document.getElementById("btnCloseModal").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target === document.getElementById("modalBackdrop")) closeModal();
    });

    /* HUD Directional Pan Controls */
    document.getElementById("btnPanLeft").addEventListener("click", () => panCameraBy(130, 0));
    document.getElementById("btnPanRight").addEventListener("click", () => panCameraBy(-130, 0));
    document.getElementById("btnPanUp").addEventListener("click", () => panCameraBy(0, 130));
    document.getElementById("btnPanDown").addEventListener("click", () => panCameraBy(0, -130));

    document.getElementById("btnZoomIn").addEventListener("click", () => {
      cancelCameraAnim();
      camera.k = Math.min(2.8, camera.k * 1.18);
      applyWorldTransform();
    });
    document.getElementById("btnZoomOut").addEventListener("click", () => {
      cancelCameraAnim();
      camera.k = Math.max(0.2, camera.k / 1.18);
      applyWorldTransform();
    });
    document.getElementById("btnFitMap").addEventListener("click", fitVisibleGraph);

    document.getElementById("btnToggleWheelMode").addEventListener("click", () => {
      uiSettings.wheelMode = uiSettings.wheelMode === "scroll" ? "zoom" : "scroll";
      document.getElementById("btnToggleWheelMode").textContent = uiSettings.wheelMode === "scroll" ? "Wheel: Scroll" : "Wheel: Zoom";
      persistAll();
    });
    document.getElementById("btnToggleWheelMode").textContent = uiSettings.wheelMode === "scroll" ? "Wheel: Scroll" : "Wheel: Zoom";

    document.getElementById("btnExpandAll").addEventListener("click", () => {
      for (const n of liveGraph.nodes.values()) {
        if (n.childrenIds.length > 0) ensureNodeState(n.id).expandedOnMap = true;
      }
      persistAll();
      renderAll();
      fitVisibleGraph();
    });
    document.getElementById("btnCollapseDomains").addEventListener("click", () => {
      for (const n of liveGraph.nodes.values()) {
        ensureNodeState(n.id).expandedOnMap = (n.id === "knowledge");
      }
      persistAll();
      renderAll();
      fitVisibleGraph();
    });
    document.getElementById("btnClearSpotlight").addEventListener("click", () => {
      uiSettings.spotlightMain = false;
      persistAll();
      renderAll();
    });

    /* Global Keyboard Hotkeys */
    window.addEventListener("keydown", (e) => {
      const tag = (document.activeElement?.tagName || "").toLowerCase();
      const inInput = tag === "input" || tag === "textarea" || tag === "select";
      if (e.key === "Escape") {
        if (document.getElementById("modalBackdrop").classList.contains("open")) {
          closeModal();
        } else if (!inInput && liveGraph.navigation.detourStack.length > 0) {
          popDetour();
        }
        return;
      }
      if (inInput) return;
      if (e.key === "m" || e.key === "M") locateNode(liveGraph.navigation.MAIN, 0.98);
      if (e.key === "h" || e.key === "H") locateNode(liveGraph.navigation.HEAD, 0.98);
    });

    window.addEventListener("resize", applyWorldTransform);
  }

  /* =========================================================================
   * 12. INITIALIZATION
   * ========================================================================= */
  setupInteractions();
  renderAll();

  // Focus and fit visible graph nicely on first load
  requestAnimationFrame(() => {
    fitVisibleGraph();
  });

  window.addEventListener("load", () => {
    renderMathInContainer(document.getElementById("sidePane"));
  });
})();
</script>
