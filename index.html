<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLYMATHY // Compound DAG Knowledge Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root {
  /* Core Surfaces (Technical Paper & Blueprint Ink) */
  --bg: #f8f9fa;
  --bg-alt: #f1f3f5;
  --surface: #ffffff;
  --surface-hover: #f4f6f8;
  --border: #d0d7de;
  --border-strong: #8c959f;
  --border-dark: #1f2328;

  /* Typography */
  --text: #1f2328;
  --text-muted: #59636e;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Semantic Status & Locator Colors */
  --accent: #0969da;
  --accent-soft: #ddf4ff;
  --head-color: #8250df;
  --head-soft: #fbefff;

  --flag-c-bg: #dafbe1;
  --flag-c-text: #116329;
  --flag-c-border: #4ac26b;

  --flag-w-bg: #fff8c5;
  --flag-w-text: #7d4e00;
  --flag-w-border: #d4a72c;

  --flag-x-bg: #ffebe9;
  --flag-x-text: #a40e26;
  --flag-x-border: #ff8182;

  --stub-bg: #eaeef2;
  --stub-text: #57606a;

  --shadow-sm: 0 1px 2px rgba(31, 35, 40, 0.06);
  --shadow-md: 0 4px 10px rgba(31, 35, 40, 0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.48;
  display: flex;
  flex-direction: column;
}

/* Form & Button Primitives (STEM Manual) */
button, input, select, textarea {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  padding: 4px 8px;
  outline: none;
}
button {
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: background 0.1s ease, border-color 0.1s ease, transform 0.06s ease;
}
button:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--border-dark); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}
button.primary:hover:not(:disabled) { background: #32383f; }
button.accent-btn {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}
button.accent-btn:hover:not(:disabled) { background: #cbe8ff; }
button.head-btn {
  background: var(--head-soft);
  color: var(--head-color);
  border-color: var(--head-color);
}
button.head-btn:hover:not(:disabled) { background: #f3dcff; }
button.success-btn {
  background: var(--flag-c-bg);
  color: var(--flag-c-text);
  border-color: var(--flag-c-border);
}
button.danger-btn {
  background: var(--flag-x-bg);
  color: var(--flag-x-text);
  border-color: var(--flag-x-border);
}
button.btn-xs { padding: 2px 6px; font-size: 10.5px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { font-family: var(--font-sans); resize: vertical; }

/* Top Telemetry & Locator Bar */
.topbar {
  height: 44px;
  min-height: 44px;
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1.5px solid var(--border-dark);
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  z-index: 30;
  overflow-x: auto;
}
.topbar-left, .topbar-center, .topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.brand {
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}
.telemetry-pill {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 2px 7px;
  color: var(--text-muted);
}
.locator-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid;
  font-family: var(--font-mono);
  font-size: 11px;
  max-width: 260px;
}
.locator-chip.main {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.locator-chip.head {
  background: var(--head-soft);
  border-color: var(--head-color);
  color: var(--head-color);
}
.locator-label {
  font-weight: 800;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.locator-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  font-weight: 600;
}

/* Main Workspace Split */
.workspace {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  position: relative;
  overflow: hidden;
}
.canvas-pane {
  flex: 1 1 68%;
  min-width: 320px;
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 20px 20px;
  user-select: none;
}
.splitter {
  width: 5px;
  flex-shrink: 0;
  background: var(--bg-alt);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  cursor: col-resize;
  transition: background 0.12s;
  z-index: 20;
}
.splitter:hover, .splitter.dragging { background: var(--accent); }

.side-pane {
  width: 34%;
  min-width: 340px;
  max-width: 680px;
  flex-shrink: 0;
  background: var(--bg);
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* SVG Map Canvas & Overlays */
#dagSvg {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
}
#dagSvg.panning { cursor: grabbing; }

.detour-banner {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 15;
  display: none;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1.5px solid var(--head-color);
  border-radius: 4px;
  padding: 5px 10px;
  box-shadow: var(--shadow-md);
  font-family: var(--font-mono);
  font-size: 11px;
}
.detour-banner.visible { display: flex; }

.canvas-hud-bottom {
  position: absolute;
  bottom: 12px;
  left: 12px;
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.hud-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
}

.minimap-wrap {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 184px;
  height: 144px;
  background: rgba(255, 255, 255, 0.94);
  border: 1.5px solid var(--border-dark);
  border-radius: 4px;
  box-shadow: var(--shadow-md);
  z-index: 15;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.minimap-header {
  height: 18px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  padding: 0 6px;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#minimapSvg {
  width: 100%;
  flex: 1 1 0;
  display: block;
  cursor: crosshair;
}

/* Signature STEM Manual UI Primitives */
.box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.box.inset {
  background: var(--bg-alt);
  padding: 9px 11px;
  margin-bottom: 8px;
  box-shadow: none;
}
.box-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 10px;
  gap: 8px;
}
.box-title {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  text-transform: uppercase;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--bg-alt);
  color: var(--text-muted);
  line-height: 1.2;
  white-space: nowrap;
}
.tag.flag-C {
  background: var(--flag-c-bg);
  color: var(--flag-c-text);
  border-color: var(--flag-c-border);
}
.tag.flag-W {
  background: var(--flag-w-bg);
  color: var(--flag-w-text);
  border-color: var(--flag-w-border);
}
.tag.flag-X {
  background: var(--flag-x-bg);
  color: var(--flag-x-text);
  border-color: var(--flag-x-border);
}
.tag.stub {
  background: var(--stub-bg);
  color: var(--stub-text);
  border-color: var(--border-strong);
  border-style: dashed;
}
.tag.edited {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}
.tag.head-tag {
  background: var(--head-soft);
  color: var(--head-color);
  border-color: var(--head-color);
}

/* Collapsible Drawers */
details.audit-drawer {
  border: 1.5px solid var(--border-dark);
  border-radius: 4px;
  background: var(--bg-alt);
  padding: 8px 11px;
  margin-bottom: 12px;
}
details.audit-drawer.detour-drawer {
  border-color: var(--head-color);
  background: var(--head-soft);
}
details.audit-drawer summary {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.04em;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  list-style: none;
}
details.audit-drawer summary::-webkit-details-marker { display: none; }
details.audit-drawer[open] summary {
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 8px;
}

.detour-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.5;
}
.detour-link {
  color: var(--head-color);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
  font-weight: 600;
}
.detour-link:hover { background: rgba(130, 80, 223, 0.14); }
.detour-current {
  font-weight: 800;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--head-color);
  border-radius: 3px;
  padding: 1px 5px;
}

/* Side Panel Topic Header & Module Items */
.topic-breadcrumb {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
  word-break: break-word;
}
.topic-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.topic-title {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 800;
  line-height: 1.25;
  color: var(--text);
}
.topic-meta-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.progress-track {
  width: 100%;
  height: 8px;
  background: var(--bg-alt);
  border: 1px solid var(--border-strong);
  border-radius: 2px;
  overflow: hidden;
  margin: 8px 0 4px 0;
}
.progress-fill {
  height: 100%;
  background: var(--flag-w-border);
  transition: width 0.2s ease;
}
.progress-fill.done { background: var(--flag-c-border); }

.item-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.list-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 8px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 3px;
}
.list-row-left {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  min-width: 0;
  flex: 1 1 auto;
}
.list-row-left input[type="checkbox"] {
  margin-top: 2px;
  flex-shrink: 0;
  width: 14px;
  height: 14px;
  accent-color: var(--accent);
  cursor: pointer;
}
.list-row-main {
  min-width: 0;
  flex: 1 1 auto;
}
.list-row-title {
  font-weight: 600;
  font-size: 12.5px;
  color: var(--text);
  word-break: break-word;
}
.list-row-title.checked {
  text-decoration: line-through;
  color: var(--text-muted);
}
.list-row-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 1px;
  word-break: break-all;
}
.list-row-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.intro-prose {
  font-size: 13px;
  line-height: 1.55;
  color: var(--text);
  margin-bottom: 10px;
  padding: 8px 10px;
  background: var(--bg-alt);
  border-left: 3px solid var(--border-strong);
  border-radius: 2px;
}
.inline-add-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.inline-add-row input {
  flex: 1 1 140px;
  min-width: 0;
}
.diag-warn {
  margin-top: 8px;
  padding: 7px 9px;
  background: var(--flag-x-bg);
  border: 1px solid var(--flag-x-border);
  color: var(--flag-x-text);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.diag-info {
  margin-top: 8px;
  padding: 7px 9px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
}

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(31, 35, 40, 0.48);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1.5px solid var(--border-dark);
  border-radius: 5px;
  width: 100%;
  max-width: 780px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-md);
}
.modal-head {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.04em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-body {
  padding: 14px;
  overflow-y: auto;
  flex: 1 1 auto;
}

/* Manual Tabs */
.manual-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1.5px solid var(--border-dark);
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.manual-tab-btn {
  border-bottom: none;
  border-radius: 3px 3px 0 0;
  background: var(--bg-alt);
  color: var(--text-muted);
  padding: 5px 10px;
  font-size: 11px;
}
.manual-tab-btn.active {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}
.manual-tab-panel { display: none; }
.manual-tab-panel.active { display: block; }

table.spec-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin: 8px 0;
}
table.spec-table th, table.spec-table td {
  border: 1px solid var(--border);
  padding: 6px 8px;
  text-align: left;
  vertical-align: top;
}
table.spec-table th {
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-size: 11px;
}
pre.code-block {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 9px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
code.inline {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1px 4px;
}

/* SVG Element Classes */
.svg-node { cursor: pointer; }
.svg-node:hover .node-card { stroke: var(--text); stroke-width: 1.8px; }
.svg-expand-badge { cursor: pointer; }
.svg-expand-badge:hover rect { fill: var(--text); }
.svg-expand-badge:hover text { fill: var(--surface); }
.prereq-hit { cursor: pointer; }
.prereq-hit:hover .prereq-pill-rect { stroke-width: 1.8px; filter: brightness(0.96); }
.dimmed { opacity: 0.2; transition: opacity 0.15s; }

@keyframes mainPulse {
  0%, 100% { stroke-opacity: 0.95; r: 10; }
  50% { stroke-opacity: 0.25; r: 14; }
}
.main-beacon-pulse { animation: mainPulse 2s ease-in-out infinite; }

.toast {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 200;
  background: var(--text);
  color: var(--surface);
  font-family: var(--font-mono);
  font-size: 11.5px;
  padding: 7px 12px;
  border-radius: 4px;
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transform: translateY(6px);
  transition: opacity 0.18s, transform 0.18s;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 900px) {
  .workspace { flex-direction: column; }
  .canvas-pane { flex: 1 1 52%; min-width: 0; }
  .splitter { width: 100%; height: 5px; cursor: row-resize; border: none; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .side-pane { width: 100% !important; max-width: none; min-width: 0; flex: 1 1 48%; }
  .minimap-wrap { width: 140px; height: 110px; }
}
</style>
</head>
<body>

<!-- TOP TELEMETRY & LOCATOR BAR -->
<header class="topbar">
  <div class="topbar-left">
    <div class="brand">
      <span>[POLYMATHY // COMPOUND DAG]</span>
    </div>
    <span class="telemetry-pill" id="globalProgressPill">Baseline: 0 / 0 Topics</span>
  </div>

  <div class="topbar-center">
    <div class="locator-chip main" title="Primary Study Goal (MAIN)">
      <span class="locator-label">MAIN:</span>
      <span class="locator-title" id="topMainTitle">—</span>
      <button class="btn-xs accent-btn" id="btnLocateMain" title="Locate MAIN (M)">Locate</button>
    </div>
    <div class="locator-chip head" title="Active Side-Panel Topic (HEAD)">
      <span class="locator-label">HEAD:</span>
      <span class="locator-title" id="topHeadTitle">—</span>
      <button class="btn-xs head-btn" id="btnLocateHead" title="Locate HEAD (H)">Locate</button>
    </div>
  </div>

  <div class="topbar-right">
    <button class="btn-xs" id="btnToggleLayout" title="Toggle Radial Wedge / Top-Down Tree">Layout: Radial</button>
    <button class="btn-xs" id="btnFrontierRadar">Frontier Radar</button>
    <button class="btn-xs" id="btnImportPatch">+ Import Patch</button>
    <button class="btn-xs" id="btnLayerInspector">Layer Inspector</button>
    <button class="btn-xs" id="btnManual">? Manual</button>
  </div>
</header>

<!-- MAIN WORKSPACE -->
<main class="workspace" id="workspace">
  <!-- LEFT: COMPOUND DAG CANVAS -->
  <section class="canvas-pane" id="canvasPane">
    <div class="detour-banner" id="floatingDetourBanner">
      <button class="btn-xs head-btn" id="btnFloatingGetBack">← Get Back</button>
      <span id="floatingDetourLabel">Detour active</span>
    </div>

    <div class="minimap-wrap" id="minimapWrap">
      <div class="minimap-header">
