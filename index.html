<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>POLYMATHY // Knowledge Graph & Learning Assistant</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root {
  /* Surfaces & Ink (Clean STEM Manual Monograph Aesthetic) */
  --bg: #f8f9fa;
  --bg-alt: #f1f3f5;
  --surface: #ffffff;
  --surface-hover: #f4f6f8;
  --border: #d0d7de;
  --border-strong: #8c959f;
  --border-dark: #1f2328;

  /* Typography */
  --text: #1f2328;
  --text-muted: #59636e;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Semantic Colors (Human-friendly status names, NO cryptic letters) */
  --accent: #0969da;
  --accent-soft: #ddf4ff;
  --head-color: #8250df;
  --head-soft: #fbefff;

  --status-done-bg: #dafbe1;
  --status-done-text: #116329;
  --status-done-border: #4ac26b;

  --status-active-bg: #fff8c5;
  --status-active-text: #7d4e00;
  --status-active-border: #d4a72c;

  --status-needed-bg: #ffebe9;
  --status-needed-text: #a40e26;
  --status-needed-border: #ff8182;

  --status-ready-bg: #ddf4ff;
  --status-ready-text: #0969da;
  --status-ready-border: #54aeff;

  --status-draft-bg: #eaeef2;
  --status-draft-text: #57606a;
  --status-draft-border: #8c959f;

  --shadow-sm: 0 1px 2px rgba(31, 35, 40, 0.06);
  --shadow-md: 0 4px 10px rgba(31, 35, 40, 0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.48;
  display: flex;
  flex-direction: column;
}

/* Form & Button Primitives */
button, input, select, textarea {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  padding: 4px 8px;
  outline: none;
}
button {
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: background 0.1s ease, border-color 0.1s ease, transform 0.06s ease;
}
button:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--border-dark); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}
button.primary:hover:not(:disabled) { background: #32383f; }
button.accent-btn {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}
button.accent-btn:hover:not(:disabled) { background: #cbe8ff; }
button.head-btn {
  background: var(--head-soft);
  color: var(--head-color);
  border-color: var(--head-color);
}
button.head-btn:hover:not(:disabled) { background: #f3dcff; }
button.success-btn {
  background: var(--status-done-bg);
  color: var(--status-done-text);
  border-color: var(--status-done-border);
}
button.danger-btn {
  background: var(--status-needed-bg);
  color: var(--status-needed-text);
  border-color: var(--status-needed-border);
}
button.btn-xs { padding: 2px 7px; font-size: 11px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { font-family: var(--font-sans); resize: vertical; }

/* Top Telemetry & Locator Bar */
.topbar {
  height: 46px;
  min-height: 46px;
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1.5px solid var(--border-dark);
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  z-index: 30;
  overflow-x: auto;
}
.topbar-left, .topbar-center, .topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.brand {
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}
.telemetry-pill {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 3px 8px;
  color: var(--text-muted);
}
.locator-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 7px;
  border-radius: 3px;
  border: 1px solid;
  font-family: var(--font-mono);
  font-size: 11px;
  max-width: 260px;
}
.locator-chip.main {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.locator-chip.head {
  background: var(--head-soft);
  border-color: var(--head-color);
  color: var(--head-color);
}
.locator-label {
  font-weight: 800;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.locator-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  font-weight: 600;
}

/* Main Workspace Split */
.workspace {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  position: relative;
  overflow: hidden;
}
.canvas-pane {
  flex: 1 1 66%;
  min-width: 320px;
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 22px 22px;
  user-select: none;
  touch-action: none;
}
.splitter {
  width: 5px;
  flex-shrink: 0;
  background: var(--bg-alt);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  cursor: col-resize;
  transition: background 0.12s;
  z-index: 20;
}
.splitter:hover, .splitter.dragging { background: var(--accent); }

.side-pane {
  width: 34%;
  min-width: 340px;
  max-width: 680px;
  flex-shrink: 0;
  background: var(--bg);
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* SVG Map Canvas & Overlays */
#dagSvg {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
}
#dagSvg.panning { cursor: grabbing; }

.detour-banner {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 15;
  display: none;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1.5px solid var(--head-color);
  border-radius: 4px;
  padding: 5px 11px;
  box-shadow: var(--shadow-md);
  font-family: var(--font-mono);
  font-size: 11.5px;
}
.detour-banner.visible { display: flex; }

.canvas-hud-bottom {
  position: absolute;
  bottom: 12px;
  left: 12px;
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.hud-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
}
.hud-hint-pill {
  font-family: var(--font-sans);
  font-size: 11px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 8px;
}

.minimap-wrap {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 184px;
  background: rgba(255, 255, 255, 0.95);
  border: 1.5px solid var(--border-dark);
  border-radius: 4px;
  box-shadow: var(--shadow-md);
  z-index: 15;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: height 0.15s ease;
}
.minimap-wrap.minimized {
  width: 110px;
}
.minimap-wrap.minimized #minimapSvg {
  display: none;
}
.minimap-header {
  height: 22px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  padding: 0 6px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#minimapSvg {
  width: 100%;
  height: 120px;
  display: block;
  cursor: crosshair;
}

/* Primitives & Boxes */
.box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.box.inset {
  background: var(--bg-alt);
  padding: 9px 11px;
  margin-bottom: 8px;
  box-shadow: none;
}
.box-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 8px;
  gap: 8px;
}
.box-title {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  text-transform: uppercase;
}
.section-hint {
  font-size: 11.5px;
  color: var(--text-muted);
  margin-bottom: 9px;
  line-height: 1.4;
}

/* Clear Semantic Tags */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--bg-alt);
  color: var(--text-muted);
  line-height: 1.2;
  white-space: nowrap;
}
.tag.done {
  background: var(--status-done-bg);
  color: var(--status-done-text);
  border-color: var(--status-done-border);
}
.tag.active {
  background: var(--status-active-bg);
  color: var(--status-active-text);
  border-color: var(--status-active-border);
}
.tag.needed {
  background: var(--status-needed-bg);
  color: var(--status-needed-text);
  border-color: var(--status-needed-border);
}
.tag.ready {
  background: var(--status-ready-bg);
  color: var(--status-ready-text);
  border-color: var(--status-ready-border);
}
.tag.draft {
  background: var(--status-draft-bg);
  color: var(--status-draft-text);
  border-color: var(--status-draft-border);
  border-style: dashed;
}
.tag.edited {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}
.tag.head-tag {
  background: var(--head-soft);
  color: var(--head-color);
  border-color: var(--head-color);
}

/* Detour Drawer */
details.audit-drawer {
  border: 1.5px solid var(--border-dark);
  border-radius: 4px;
  background: var(--bg-alt);
  padding: 8px 11px;
  margin-bottom: 12px;
}
details.audit-drawer.detour-drawer {
  border-color: var(--head-color);
  background: var(--head-soft);
}
details.audit-drawer summary {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.04em;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  list-style: none;
}
details.audit-drawer summary::-webkit-details-marker { display: none; }
details.audit-drawer[open] summary {
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 8px;
}

.detour-chain {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.5;
}
.detour-link {
  color: var(--head-color);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
  font-weight: 600;
}
.detour-link:hover { background: rgba(130, 80, 223, 0.14); }
.detour-current {
  font-weight: 800;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--head-color);
  border-radius: 3px;
  padding: 1px 5px;
}

/* Side Panel Content */
.topic-breadcrumb {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
  word-break: break-word;
}
.topic-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.topic-title {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 800;
  line-height: 1.25;
  color: var(--text);
}
.topic-meta-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.progress-track {
  width: 100%;
  height: 8px;
  background: var(--bg-alt);
  border: 1px solid var(--border-strong);
  border-radius: 2px;
  overflow: hidden;
  margin: 8px 0 4px 0;
}
.progress-fill {
  height: 100%;
  background: var(--status-active-border);
  transition: width 0.2s ease;
}
.progress-fill.done { background: var(--status-done-border); }

.item-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.list-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 8px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 3px;
}
.list-row-left {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  min-width: 0;
  flex: 1 1 auto;
}
.list-row-left input[type="checkbox"] {
  margin-top: 2px;
  flex-shrink: 0;
  width: 14px;
  height: 14px;
  accent-color: var(--accent);
  cursor: pointer;
}
.list-row-main {
  min-width: 0;
  flex: 1 1 auto;
}
.list-row-title {
  font-weight: 600;
  font-size: 12.5px;
  color: var(--text);
  word-break: break-word;
}
.list-row-title.checked {
  text-decoration: line-through;
  color: var(--text-muted);
}
.list-row-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 1px;
  word-break: break-all;
}
.list-row-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.intro-prose {
  font-size: 13px;
  line-height: 1.55;
  color: var(--text);
  margin-bottom: 10px;
  padding: 8px 10px;
  background: var(--bg-alt);
  border-left: 3px solid var(--border-strong);
  border-radius: 2px;
}
.inline-add-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.inline-add-row input {
  flex: 1 1 140px;
  min-width: 0;
}
.diag-warn {
  margin-top: 8px;
  padding: 7px 9px;
  background: var(--status-needed-bg);
  border: 1px solid var(--status-needed-border);
  color: var(--status-needed-text);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.diag-info {
  margin-top: 8px;
  padding: 7px 9px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
}

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(31, 35, 40, 0.48);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1.5px solid var(--border-dark);
  border-radius: 5px;
  width: 100%;
  max-width: 780px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-md);
}
.modal-head {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.04em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-body {
  padding: 14px;
  overflow-y: auto;
  flex: 1 1 auto;
}

/* Manual Tabs */
.manual-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1.5px solid var(--border-dark);
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.manual-tab-btn {
  border-bottom: none;
  border-radius: 3px 3px 0 0;
  background: var(--bg-alt);
  color: var(--text-muted);
  padding: 5px 10px;
  font-size: 11px;
}
.manual-tab-btn.active {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}
.manual-tab-panel { display: none; }
.manual-tab-panel.active { display: block; }

table.spec-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin: 8px 0;
}
table.spec-table th, table.spec-table td {
  border: 1px solid var(--border);
  padding: 6px 8px;
  text-align: left;
  vertical-align: top;
}
table.spec-table th {
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-size: 11px;
}
pre.code-block {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 9px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
code.inline {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1px 4px;
}

/* SVG Interactive Styles */
.svg-node { cursor: pointer; }
.svg-node:hover .node-card { stroke: var(--text); stroke-width: 1.8px; }
.svg-expand-badge { cursor: pointer; }
.svg-expand-badge:hover rect { fill: var(--text); }
.svg-expand-badge:hover text { fill: var(--surface); }
.prereq-arrow-hit { cursor: pointer; }
.prereq-arrow-hit:hover path.visible-arrow { stroke-width: 3.2px; filter: drop-shadow(0 0 3px rgba(0,0,0,0.25)); }
.dimmed { opacity: 0.18; transition: opacity 0.15s; }

@keyframes mainPulse {
  0%, 100% { stroke-opacity: 0.95; r: 10; }
  50% { stroke-opacity: 0.25; r: 14; }
}
.main-beacon-pulse { animation: mainPulse 2s ease-in-out infinite; }

.toast {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 200;
  background: var(--text);
  color: var(--surface);
  font-family: var(--font-mono);
  font-size: 11.5px;
  padding: 7px 12px;
  border-radius: 4px;
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transform: translateY(6px);
  transition: opacity 0.18s, transform 0.18s;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 900px) {
  .workspace { flex-direction: column; }
  .canvas-pane { flex: 1 1 50%; min-width: 0; }
  .splitter { width: 100%; height: 5px; cursor: row-resize; border: none; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .side-pane { width: 100% !important; max-width: none; min-width: 0; flex: 1 1 50%; }
  .minimap-wrap { width: 130px; }
  #minimapSvg { height: 90px; }
}
</style>
</head>
<body>

<!-- TOP TELEMETRY & LOCATOR BAR -->
<header class="topbar">
  <div class="topbar-left">
    <div class="brand">
      <span>POLYMATHY</span>
    </div>
    <span class="telemetry-pill" id="globalProgressPill" title="Mastered topics / Total topics">Completed: 0 / 0</span>
  </div>

  <div class="topbar-center">
    <div class="locator-chip main" title="Your main study target. Always highlighted on the map.">
      <span class="locator-label">MAIN:</span>
      <span class="locator-title" id="topMainTitle">—</span>
      <button class="btn-xs accent-btn" id="btnLocateMain" title="Center camera on your MAIN goal (HotKey: M)">Locate</button>
    </div>
    <div class="locator-chip head" title="The topic currently open in the side panel.">
      <span class="locator-label">HEAD:</span>
      <span class="locator-title" id="topHeadTitle">—</span>

      "math.graph_theory.connectivity": { introDone: true, baselineDone: true, completedSourceIds: ["src_gt_conn"], expandedOnMap: false },

      "math.probability": { introDone: false, baselineDone: false, completedSourceIds: [], expandedOnMap: false },
      "math.probability.axioms_distributions": { introDone: true, baselineDone: true, completedSourceIds: ["src_prob_1"], expandedOnMap: false },

      "physics.classical_mechanics": { introDone: true, baselineDone: false, completedSourceIds: [], expandedOnMap: false },
      "physics.classical_mechanics.newtonian": { introDone: true, baselineDone: true, completedSourceIds: ["src_newt_1"], expandedOnMap: false },

      "physics.relativity": { introDone: true, baselineDone: false, completedSourceIds: [], expandedOnMap: true },
      "physics.relativity.special_relativity": {
        introDone: true,
        baselineDone: true,
        completedSourceIds: ["src_sr_taylor"],
        expandedOnMap: false
      },
      "physics.relativity.general_relativity": {
        introDone: true,
        baselineDone: false,
        completedSourceIds: [],
        expandedOnMap: false
      },

      "philosophy.formal_logic.propositional_predicate": {
        introDone: true,
        baselineDone: true,
        completedSourceIds: ["src_fol_1"],
        expandedOnMap: false
      }
    }
  };

  const EMPTY_OVERRIDES = () => ({
    custom_nodes: [],
    field_overrides: {},
    edge_deltas: {},
    reparents: {},
    tombstones: []
  });

  /* =========================================================================
   * 2. STORAGE & 3-LAYER OVERLAYFS ENGINE
   * ========================================================================= */
  const STORAGE_KEYS = {
    patches: "polymathy_v2_patches",
    overrides: "polymathy_v2_overrides",
    state: "polymathy_v2_state",
    ui: "polymathy_v2_ui"
  };

  function safeReadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return structuredClone(fallback);
      return JSON.parse(raw);
    } catch {
      return structuredClone(fallback);
    }
  }

  function safeWriteJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch { /* Ignore storage quota limits in private mode */ }
  }

  let layer0Patches = safeReadJSON(STORAGE_KEYS.patches, [SEED_PATCH_001]);
  if (!Array.isArray(layer0Patches) || layer0Patches.length === 0) {
    layer0Patches = [structuredClone(SEED_PATCH_001)];
  }
  let layer1Overrides = Object.assign(EMPTY_OVERRIDES(), safeReadJSON(STORAGE_KEYS.overrides, EMPTY_OVERRIDES()));
  let layer2State = safeReadJSON(STORAGE_KEYS.state, SEED_STATE);
  if (!layer2State.navigation) layer2State.navigation = structuredClone(SEED_STATE.navigation);
  if (!layer2State.nodes) layer2State.nodes = {};

  let uiSettings = safeReadJSON(STORAGE_KEYS.ui, {
    layoutMode: "tree", // Default to tree for maximum clarity and zero overlaps
    learnChecklistActive: {},
    spotlightMain: false,
    wheelMode: "scroll", // "scroll" | "zoom"
    minimapMinimized: false,
    sidePaneWidth: null
  });

  function persistAll() {
    safeWriteJSON(STORAGE_KEYS.patches, layer0Patches);
    safeWriteJSON(STORAGE_KEYS.overrides, layer1Overrides);
    safeWriteJSON(STORAGE_KEYS.state, layer2State);
    safeWriteJSON(STORAGE_KEYS.ui, uiSettings);
  }

  function cloneNode(n) {
    return {
      id: n.id,
      title: n.title || prettifySlug(n.id),
      parentId: n.parentId ?? null,
      prereqIds: Array.isArray(n.prereqIds) ? [...n.prereqIds] : [],
      intro: n.intro || "",
      sources: Array.isArray(n.sources) ? n.sources.map(s => ({ ...s })) : [],
      isStub: !!n.isStub,
      isCustom: !!n.isCustom,
      isOverridden: !!n.isOverridden
    };
  }

  function prettifySlug(id) {
    const last = String(id).split(".").pop() || id;
    return last.replace(/[_-]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  }

  function inferParentFromSlug(id, nodeMap) {
    if (id === "knowledge") return null;
    const parts = String(id).split(".");
    while (parts.length > 1) {
      parts.pop();
      const candidate = parts.join(".");
      if (nodeMap.has(candidate)) return candidate;
      return candidate;
    }
    return "knowledge";
  }

  /* Fold Layer 0 Patches */
  function foldLayer0(patches) {
    const map = new Map();
    for (const patch of patches) {
      if (Array.isArray(patch.nodes)) {
        for (const raw of patch.nodes) {
          if (!raw || !raw.id) continue;
          const existing = map.get(raw.id);
          if (!existing) {
            map.set(raw.id, cloneNode(raw));
          } else {
            if (raw.title) existing.title = raw.title;
            if (raw.parentId !== undefined) existing.parentId = raw.parentId;
            if (raw.intro) existing.intro = raw.intro;
            if (Array.isArray(raw.prereqIds)) {
              for (const p of raw.prereqIds) {
                if (!existing.prereqIds.includes(p)) existing.prereqIds.push(p);
              }
            }
            if (Array.isArray(raw.sources)) {
              for (const s of raw.sources) {
                if (!existing.sources.some(es => es.id === s.id)) existing.sources.push({ ...s });
              }
            }
          }
        }
      }
      if (Array.isArray(patch.extensions)) {
        for (const ext of patch.extensions) {
          const target = map.get(ext.targetId);
          if (!target) continue;
          if (Array.isArray(ext.addPrereqs)) {
            for (const p of ext.addPrereqs) {
              if (!target.prereqIds.includes(p)) target.prereqIds.push(p);
            }
          }
          if (Array.isArray(ext.addSources)) {
            for (const s of ext.addSources) {
              if (!target.sources.some(es => es.id === s.id)) target.sources.push({ ...s });
            }
          }
        }
      }
    }
    return map;
  }

  /* Fold Layer 0 (+) Layer 1 Overrides */
  function foldLayer0And1(patches, overrides) {
    const baseMap = foldLayer0(patches);
    const map = new Map();
    for (const [id, n] of baseMap) map.set(id, cloneNode(n));

    const tombstones = new Set(overrides.tombstones || []);
    const overriddenIds = new Set();

    // Custom user nodes
    for (const raw of (overrides.custom_nodes || [])) {
      if (!raw || !raw.id || tombstones.has(raw.id)) continue;
      const node = cloneNode(raw);
      node.isCustom = true;
      map.set(node.id, node);
      overriddenIds.add(node.id);
    }

    // Tombstones
    for (const deadId of tombstones) {
      if (deadId !== "knowledge") map.delete(deadId);
    }

    // Field overrides (title, intro)
    for (const [id, patchFields] of Object.entries(overrides.field_overrides || {})) {
      const node = map.get(id);
      if (!node) continue;
      if (patchFields.title !== undefined) node.title = patchFields.title;
      if (patchFields.intro !== undefined) node.intro = patchFields.intro;
      node.isOverridden = true;
      overriddenIds.add(id);
    }

    // Reparents (moving topic to another parent)
    for (const [id, newParent] of Object.entries(overrides.reparents || {})) {
      const node = map.get(id);
      if (!node || id === "knowledge") continue;
      node.parentId = newParent;
      node.isOverridden = true;
      overriddenIds.add(id);
    }

    // 2P-Set Edge Deltas (prerequisites & sources)
    for (const [id, delta] of Object.entries(overrides.edge_deltas || {})) {
      const node = map.get(id);
      if (!node) continue;
      const addP = new Set(delta.addPrereqs || []);
      const remP = new Set(delta.removePrereqs || []);
      for (const p of addP) {
        if (!node.prereqIds.includes(p)) node.prereqIds.push(p);
      }
      node.prereqIds = node.prereqIds.filter(p => !remP.has(p));

      const remS = new Set(delta.removeSourceIds || []);
      node.sources = node.sources.filter(s => !remS.has(s.id));
      for (const s of (delta.addSources || [])) {
        if (!node.sources.some(es => es.id === s.id)) node.sources.push({ ...s });
      }
      node.isOverridden = true;
      overriddenIds.add(id);
    }

    // Stub Auto-Hydration for unresolved referenced IDs
    let addedStub = true;
    while (addedStub) {
      addedStub = false;
      const missingIds = new Set();
      for (const node of map.values()) {
        if (node.parentId && !map.has(node.parentId) && !tombstones.has(node.parentId)) {
          missingIds.add(node.parentId);
        }
        for (const pId of node.prereqIds) {
          if (!map.has(pId) && !tombstones.has(pId)) {
            missingIds.add(pId);
          }
        }
      }
      for (const mId of missingIds) {
        const inferredParent = inferParentFromSlug(mId, map);
        map.set(mId, {
          id: mId,
          title: prettifySlug(mId),
          parentId: inferredParent,
          prereqIds: [],
          intro: "",
          sources: [],
          isStub: true,
          isCustom: false,
          isOverridden: false
        });
        addedStub = true;
      }
    }

    // Clean broken parent or self loops
    for (const node of map.values()) {
      if (node.id !== "knowledge" && (!node.parentId || !map.has(node.parentId))) {
        node.parentId = "knowledge";
      }
      node.prereqIds = node.prereqIds.filter(p => map.has(p) && p !== node.id);
    }

    return { map, baseMap, overriddenIds };
  }

  /* Compute live graph and progress ratios */
  function buildLiveGraph() {
    const { map, baseMap, overriddenIds } = foldLayer0And1(layer0Patches, layer1Overrides);

    const childrenMap = new Map();
    const dependentsMap = new Map();
    for (const id of map.keys()) {
      childrenMap.set(id, []);
      dependentsMap.set(id, []);
    }
    for (const node of map.values()) {
      if (node.parentId && childrenMap.has(node.parentId)) {
        childrenMap.get(node.parentId).push(node.id);
      }
      for (const pId of node.prereqIds) {
        if (dependentsMap.has(pId)) dependentsMap.get(pId).push(node.id);
      }
    }

    const nodeState = (id) => {
      const s = layer2State.nodes[id];
      return {
        introDone: !!(s && s.introDone),
        baselineDone: !!(s && s.baselineDone),
        completedSourceIds: Array.isArray(s && s.completedSourceIds) ? s.completedSourceIds : [],
        expandedOnMap: !!(s && s.expandedOnMap)
      };
    };

    const progressMap = new Map();
    function computeProgress(id, visiting = new Set()) {
      if (progressMap.has(id)) return progressMap.get(id);
      if (visiting.has(id)) return 0;
      visiting.add(id);

      const node = map.get(id);
      const st = nodeState(id);
      const kids = childrenMap.get(id) || [];

      let r = 0;
      if (kids.length === 0) {
        const introVal = st.introDone ? 1 : 0;
        const baseVal = st.baselineDone ? 1 : 0;
        const totalSrc = node.sources.length;
        if (totalSrc === 0) {
          r = 0.50 * introVal + 0.50 * baseVal;
        } else {
          const doneSrc = node.sources.filter(s => st.completedSourceIds.includes(s.id)).length;
          r = 0.30 * introVal + 0.40 * (doneSrc / totalSrc) + 0.30 * baseVal;
        }
      } else {
        let sum = 0;
        for (const cId of kids) sum += computeProgress(cId, visiting);
        r = sum / kids.length;
      }

      progressMap.set(id, r);
      visiting.delete(id);
      return r;
    }

    for (const id of map.keys()) computeProgress(id);

    for (const [id, node] of map) {
      const st = nodeState(id);
      const kids = childrenMap.get(id) || [];
      node.state = st;
      node.childrenIds = kids;
      node.dependentsIds = dependentsMap.get(id) || [];
      node.progress = progressMap.get(id) || 0;
      node.isBaselineDone = st.baselineDone;
      node.isBlocked = !st.baselineDone && node.prereqIds.some(pId => !nodeState(pId).baselineDone);
      node.isPostBaselineDeepened = st.baselineDone && kids.length > 0 && node.progress < 0.999;
      node.depth = computeDepth(id, map);
    }

    if (!map.has(layer2State.navigation.MAIN)) layer2State.navigation.MAIN = "knowledge";
    if (!map.has(layer2State.navigation.HEAD)) layer2State.navigation.HEAD = layer2State.navigation.MAIN;
    layer2State.navigation.detourStack = (layer2State.navigation.detourStack || []).filter(id => map.has(id));

    return {
      nodes: map,
      baseNodes: baseMap,
      overriddenIds,
      navigation: layer2State.navigation
    };
  }

  function computeDepth(id, map) {
    let d = 0;
    let cur = map.get(id);
    const seen = new Set();
    while (cur && cur.parentId && map.has(cur.parentId) && !seen.has(cur.id)) {
      seen.add(cur.id);
      d++;
      cur = map.get(cur.parentId);
    }
    return d;
  }

  /* Cycle detection on prerequisites */
  function findPrereqCycle(graphNodes, prereqId, targetId) {
    if (prereqId === targetId) return [targetId, prereqId];
    const adj = new Map();
    for (const n of graphNodes.values()) adj.set(n.id, []);
    for (const n of graphNodes.values()) {
      for (const p of n.prereqIds) {
        if (adj.has(p)) adj.get(p).push(n.id);
      }
    }
    const visited = new Set();
    const path = [];
    function dfs(curr) {
      if (curr === prereqId) {
        path.push(curr);
        return true;
      }
      if (visited.has(curr)) return false;
      visited.add(curr);
      path.push(curr);
      for (const nxt of (adj.get(curr) || [])) {
        if (dfs(nxt)) return true;
      }
      path.pop();
      return false;
    }
    if (dfs(targetId)) return path;
    return null;
  }

  function validateFullDagAcyclicity(nodeMap) {
    const adj = new Map();
    for (const id of nodeMap.keys()) adj.set(id, []);
    for (const n of nodeMap.values()) {
      for (const p of n.prereqIds) {
        if (adj.has(p)) adj.get(p).push(n.id);
      }
    }
    const color = new Map();
    const stack = [];
    for (const id of nodeMap.keys()) {
      if ((color.get(id) || 0) !== 0) continue;
      const cycle = dfsCycleCheck(id, adj, color, stack);
      if (cycle) return cycle;
    }
    return null;
  }

  function dfsCycleCheck(u, adj, color, stack) {
    color.set(u, 1);
    stack.push(u);
    for (const v of (adj.get(u) || [])) {
      const c = color.get(v) || 0;
      if (c === 1) {
        const idx = stack.indexOf(v);
        return [...stack.slice(idx), v];
      }
      if (c === 0) {
        const res = dfsCycleCheck(v, adj, color, stack);
        if (res) return res;
      }
    }
    stack.pop();
    color.set(u, 2);
    return null;
  }

  /* Directory Breadcrumb Helper */
  function getAncestorChain(id, nodesMap) {
    const chain = [];
    let cur = nodesMap.get(id);
    const seen = new Set();
    while (cur && !seen.has(cur.id)) {
      seen.add(cur.id);
      chain.unshift(cur);
      cur = cur.parentId ? nodesMap.get(cur.parentId) : null;
    }
    return chain;
  }

  function formatTruncatedDirectory(id, nodesMap) {
    const chain = getAncestorChain(id, nodesMap);
    if (chain.length <= 1) return "Knowledge";
    const sub = chain.slice(1).map(n => n.title);
    const n = sub.length;
    if (n === 1) return sub[0];
    if (n === 2) return `${sub[0]} / ${sub[1]}`;
    return `${sub[0]} / ... / ${sub[n - 2]} / ${sub[n - 1]}`;
  }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderMathInContainer(el) {
    if (!el || typeof window.renderMathInElement !== "function") return;
    try {
      window.renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true }
        ],
        throwOnError: false
      });
    } catch { /* Fallback */ }
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove("show"), 2400);
  }

  /* =========================================================================
   * 3. ZERO-OVERLAP GRAPH LAYOUT ENGINE (Tidy Tree & Generous Radial)
   * ========================================================================= */
  let liveGraph = buildLiveGraph();
  let layoutPositions = new Map();
  let visibleNodeIds = new Set();

  function computeVisibleSet(graph) {
    const vis = new Set(["knowledge"]);
    function walk(id) {
      const n = graph.nodes.get(id);
      if (!n) return;
      if (n.state.expandedOnMap || id === "knowledge") {
        for (const cId of n.childrenIds) {
          vis.add(cId);
          walk(cId);
        }
      }
    }
    walk("knowledge");
    return vis;
  }

  function computeLayout(graph) {
    visibleNodeIds = computeVisibleSet(graph);
    const pos = new Map();

    if (uiSettings.layoutMode === "tree") {
      /* TIDY HIERARCHICAL TREE (Mathematical guarantee: ZERO OVERLAPS) */
      const NODE_WIDTH = 170;
      const HORIZ_GAP = 55;
      const UNIT_WIDTH = NODE_WIDTH + HORIZ_GAP;
      const LEVEL_HEIGHT = 180;

      // Post-order traversal to calculate clean subtree bounding widths
      const subtreeWidths = new Map();
      function calcSubtreeWidth(id) {
        const n = graph.nodes.get(id);
        const visKids = (n?.childrenIds || []).filter(c => visibleNodeIds.has(c));
        if (visKids.length === 0) {
          subtreeWidths.set(id, UNIT_WIDTH);
          return UNIT_WIDTH;
        }
        let total = 0;
        for (const cId of visKids) total += calcSubtreeWidth(cId);
        const w = Math.max(UNIT_WIDTH, total);
        subtreeWidths.set(id, w);
        return w;
      }
      calcSubtreeWidth("knowledge");

      // Pre-order traversal to assign non-overlapping coordinates
      function assignTreePos(id, leftX) {
        const n = graph.nodes.get(id);
        const totalW = subtreeWidths.get(id) || UNIT_WIDTH;
        const centerX = leftX + totalW / 2;
        const y = n.depth * LEVEL_HEIGHT - 120;
        pos.set(id, { x: centerX, y, angle: Math.PI / 2, depth: n.depth });

        const visKids = (n?.childrenIds || []).filter(c => visibleNodeIds.has(c));
        let curLeft = leftX;
        for (const cId of visKids) {
          const kidW = subtreeWidths.get(cId) || UNIT_WIDTH;
          assignTreePos(cId, curLeft);
          curLeft += kidW;
        }
      }
      const rootW = subtreeWidths.get("knowledge") || UNIT_WIDTH;
      assignTreePos("knowledge", -rootW / 2);

    } else {
      /* GENEROUS RADIAL WEDGE WITH COLLISION CLEARANCE */
      const leafCountMap = new Map();
      function countLeaves(id) {
        const n = graph.nodes.get(id);
        const visKids = (n?.childrenIds || []).filter(c => visibleNodeIds.has(c));
        if (visKids.length === 0) {
          leafCountMap.set(id, 1);
          return 1;
        }
        let count = 0;
        for (const cId of visKids) count += countLeaves(cId);
        leafCountMap.set(id, Math.max(1, count));
        return count;
      }
      countLeaves("knowledge");

      // Ring radii with generous circumference: 2*pi*R >= Count * 220px
      const totalLeaves = leafCountMap.get("knowledge") || 1;
      const minRadius = Math.max(300, (totalLeaves * 210) / (2 * Math.PI));
      const ringRadii = [0, minRadius * 0.45, minRadius * 0.85, minRadius * 1.3, minRadius * 1.75, minRadius * 2.2];

      pos.set("knowledge", { x: 0, y: 0, angle: 0, depth: 0 });

      function assignRadialPos(id, thetaStart, thetaEnd) {
        const n = graph.nodes.get(id);
        const visKids = (n?.childrenIds || []).filter(c => visibleNodeIds.has(c));
        const totalW = visKids.reduce((acc, c) => acc + (leafCountMap.get(c) || 1), 0) || 1;
        let curAngle = thetaStart;

        for (const cId of visKids) {
          const w = leafCountMap.get(cId) || 1;
          const span = ((thetaEnd - thetaStart) * w) / totalW;
          const mid = curAngle + span / 2;
          const d = graph.nodes.get(cId).depth;
          const r = ringRadii[d] || (d * 240);
          pos.set(cId, {
            x: r * Math.cos(mid),
            y: r * Math.sin(mid),
            angle: mid,
            depth: d
          });
          assignRadialPos(cId, curAngle, curAngle + span);
          curAngle += span;
        }
      }
      assignRadialPos("knowledge", -Math.PI * 0.5, Math.PI * 1.5);
    }

    layoutPositions = pos;
  }

  /* =========================================================================
   * 4. CAMERA ENGINE (Smooth Pan, Scroll, Touch Drag/Pinch & Minimap)
   * ========================================================================= */
  const camera = { x: 0, y: 0, k: 0.95 };
  let animFrameId = null;

  function applyWorldTransform() {
    const canvas = document.getElementById("canvasPane");
    const w = canvas.clientWidth || 800;
    const h = canvas.clientHeight || 600;
    const tx = w / 2 + camera.x;
    const ty = h / 2 + camera.y;
    document.getElementById("svgWorld").setAttribute("transform", `translate(${tx.toFixed(2)}, ${ty.toFixed(2)}) scale(${camera.k.toFixed(4)})`);
    const pct = `${Math.round(camera.k * 100)}%`;
    document.getElementById("zoomPctLabel").textContent = pct;
    document.getElementById("minimapZoomPct").textContent = pct;
    updateMinimapViewport();
  }

  function cancelCameraAnim() {
    if (animFrameId !== null) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
  }

  function animateCameraTo(worldX, worldY, targetK = null, duration = 400) {
    cancelCameraAnim();
    const startX = camera.x;
    const startY = camera.y;
    const startK = camera.k;
    const endK = targetK !== null ? targetK : startK;
    const endX = -worldX * endK;
    const endY = -worldY * endK;
    const t0 = performance.now();

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function step(now) {
      const raw = Math.min(1, (now - t0) / duration);
      const e = easeInOutCubic(raw);
      camera.x = startX + (endX - startX) * e;
      camera.y = startY + (endY - startY) * e;
      camera.k = startK + (endK - startK) * e;
      applyWorldTransform();
      if (raw < 1) {
        animFrameId = requestAnimationFrame(step);
      } else {
        animFrameId = null;
      }
    }
    animFrameId = requestAnimationFrame(step);
  }

  function locateNode(id, zoomTarget = 0.98) {
    ensureAncestorsExpanded(id);
    const p = layoutPositions.get(id);
    if (!p) return;
    animateCameraTo(p.x, p.y, Math.max(camera.k, zoomTarget), 400);
  }

  function panCameraBy(dx, dy) {
    cancelCameraAnim();
    camera.x += dx;
    camera.y += dy;
    applyWorldTransform();
  }

  function fitVisibleGraph() {
    if (layoutPositions.size === 0) return;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of layoutPositions.values()) {
      minX = Math.min(minX, p.x - 95);
      maxX = Math.max(maxX, p.x + 95);
      minY = Math.min(minY, p.y - 50);
      maxY = Math.max(maxY, p.y + 50);
    }
    const canvas = document.getElementById("canvasPane");
    const w = canvas.clientWidth || 800;
    const h = canvas.clientHeight || 600;
    const spanX = Math.max(220, maxX - minX);
    const spanY = Math.max(220, maxY - minY);
    const k = Math.max(0.24, Math.min(1.2, Math.min((w - 90) / spanX, (h - 90) / spanY)));
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    animateCameraTo(cx, cy, k, 380);
  }

  function ensureAncestorsExpanded(id) {
    let cur = liveGraph.nodes.get(id);
    let changed = false;
    const seen = new Set();
    while (cur && cur.parentId && !seen.has(cur.id)) {
      seen.add(cur.id);
      if (!layer2State.nodes[cur.parentId]) {
        layer2State.nodes[cur.parentId] = { introDone: false, baselineDone: false, completedSourceIds: [], expandedOnMap: true };
        changed = true;
      } else if (!layer2State.nodes[cur.parentId].expandedOnMap) {
        layer2State.nodes[cur.parentId].expandedOnMap = true;
        changed = true;
      }
      cur = liveGraph.nodes.get(cur.parentId);
    }
    if (changed) {
      persistAll();
      liveGraph = buildLiveGraph();
      computeLayout(liveGraph);
      renderAll();
    }
  }

  /* Conduit Geometry Math */
  function sampleCubicBezier(p0, p1, p2, p3, steps = 36) {
    const pts = [];
    let totalLen = 0;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const mt = 1 - t;
      const x = mt * mt * mt * p0.x + 3 * mt * mt * t * p1.x + 3 * mt * t * t * p2.x + t * t * t * p3.x;
      const y = mt * mt * mt * p0.y + 3 * mt * mt * t * p1.y + 3 * mt * t * t * p2.y + t * t * t * p3.y;
      if (i > 0) {
        const dx = x - pts[i - 1].x;
        const dy = y - pts[i - 1].y;
        totalLen += Math.hypot(dx, dy);
      }
      pts.push({ x, y, len: totalLen });
    }
    return { pts, totalLen: Math.max(1, totalLen) };
  }

  function pointAndTangentAtFraction(sampled, frac) {
    const clamped = Math.max(0, Math.min(1, frac));
    const targetLen = clamped * sampled.totalLen;
    const pts = sampled.pts;
    for (let i = 1; i < pts.length; i++) {
      if (pts[i].len >= targetLen || i === pts.length - 1) {
        const a = pts[i - 1];
        const b = pts[i];
        const seg = Math.max(0.0001, b.len - a.len);
        const u = Math.max(0, Math.min(1, (targetLen - a.len) / seg));
        const x = a.x + (b.x - a.x) * u;
        const y = a.y + (b.y - a.y) * u;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 1;
        return { x, y, tx: dx / d, ty: dy / d };
      }
    }
    return { x: pts[0].x, y: pts[0].y, tx: 1, ty: 0 };
  }

  function subPolylinePath(sampled, fracStart, fracEnd) {
    const aLen = Math.max(0, fracStart) * sampled.totalLen;
    const bLen = Math.min(1, fracEnd) * sampled.totalLen;
    if (bLen <= aLen) return "";
    const pts = sampled.pts;
    const startPt = pointAndTangentAtFraction(sampled, fracStart);
    const out = [`M ${startPt.x.toFixed(2)} ${startPt.y.toFixed(2)}`];
    for (let i = 1; i < pts.length; i++) {
      if (pts[i].len > aLen && pts[i].len < bLen) {
        out.push(`L ${pts[i].x.toFixed(2)} ${pts[i].y.toFixed(2)}`);
      }
    }
    const endPt = pointAndTangentAtFraction(sampled, fracEnd);
    out.push(`L ${endPt.x.toFixed(2)} ${endPt.y.toFixed(2)}`);
    return out.join(" ");
  }

  function makeSvgEl(tag, attrs = {}) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs)) {
      el.setAttribute(k, String(v));
    }
    return el;
  }

  /* Compute Main Goal Subgraph for Spotlight */
  function computeMainDependencySubgraph(graph) {
    const mainId = graph.navigation.MAIN;
    const activeSet = new Set();
    for (const anc of getAncestorChain(mainId, graph.nodes)) activeSet.add(anc.id);
    const queue = [mainId];
    while (queue.length > 0) {
      const cur = queue.shift();
      const node = graph.nodes.get(cur);
      if (!node) continue;
      for (const pId of node.prereqIds) {
        if (!activeSet.has(pId)) {
          activeSet.add(pId);
          queue.push(pId);
          for (const anc of getAncestorChain(pId, graph.nodes)) activeSet.add(anc.id);
        }
      }
    }
    return activeSet;
  }

  /* =========================================================================
   * 5. SCENE RENDERING (Conduits, Arrows & Zero-Clutter Cards)
   * ========================================================================= */
  function renderAll() {
    liveGraph = buildLiveGraph();
    computeLayout(liveGraph);
    renderTopbar();
    renderFloatingDetour();
    renderSvgScene();
    renderMinimap();
    renderSidePanel();
    applyWorldTransform();
  }

  function renderTopbar() {
    const nodesArr = [...liveGraph.nodes.values()].filter(n => n.id !== "knowledge" && !n.isStub);
    const doneCount = nodesArr.filter(n => n.isBaselineDone).length;
    document.getElementById("globalProgressPill").textContent = `Completed: ${doneCount} / ${nodesArr.length}`;

    const mainNode = liveGraph.nodes.get(liveGraph.navigation.MAIN);
    const headNode = liveGraph.nodes.get(liveGraph.navigation.HEAD);
    document.getElementById("topMainTitle").textContent = mainNode ? mainNode.title : "—";
    document.getElementById("topHeadTitle").textContent = headNode ? headNode.title : "—";
    document.getElementById("btnToggleLayout").textContent = uiSettings.layoutMode === "tree" ? "Layout: Tree" : "Layout: Radial";

    const spotHud = document.getElementById("spotlightHudBox");
    spotHud.style.display = uiSettings.spotlightMain ? "flex" : "none";
  }

  function renderFloatingDetour() {
    const banner = document.getElementById("floatingDetourBanner");
    const stack = liveGraph.navigation.detourStack;
    if (stack.length === 0) {
      banner.classList.remove("visible");
      return;
    }
    const prevId = stack[stack.length - 1];
    const prevNode = liveGraph.nodes.get(prevId);
    const btn = document.getElementById("btnFloatingGetBack");
    btn.textContent = `← Back to ${prevNode ? prevNode.title : prevId}`;
    document.getElementById("floatingDetourLabel").textContent = `Detour depth: ${stack.length}`;
    banner.classList.add("visible");
  }

  function findVisibleAnchor(id) {
    if (visibleNodeIds.has(id) && layoutPositions.has(id)) {
      return { id, pos: layoutPositions.get(id), proxied: false };
    }
    let cur = liveGraph.nodes.get(id);
    const seen = new Set();
    while (cur && cur.parentId && !seen.has(cur.id)) {
      seen.add(cur.id);
      if (visibleNodeIds.has(cur.parentId) && layoutPositions.has(cur.parentId)) {
        return { id: cur.parentId, pos: layoutPositions.get(cur.parentId), proxied: true };
      }
      cur = liveGraph.nodes.get(cur.parentId);
    }
    return { id: "knowledge", pos: layoutPositions.get("knowledge"), proxied: true };
  }

  function renderSvgScene() {
    const gConduits = document.getElementById("layerConduits");
    const gPrereqs = document.getElementById("layerPrereqs");
    const gNodes = document.getElementById("layerNodes");

    gConduits.innerHTML = "";
    gPrereqs.innerHTML = "";
    gNodes.innerHTML = "";

    const spotlightSet = uiSettings.spotlightMain ? computeMainDependencySubgraph(liveGraph) : null;
    const isDimmed = (id) => spotlightSet && !spotlightSet.has(id);

    /* 1) Hollow Progress Conduits */
    for (const vId of visibleNodeIds) {
      if (vId === "knowledge") continue;
      const v = liveGraph.nodes.get(vId);
      const uPos = layoutPositions.get(v.parentId);
      const vPos = layoutPositions.get(vId);
      if (!uPos || !vPos) continue;

      let p1, p2;
      if (uiSettings.layoutMode === "tree") {
        const midY = (uPos.y + vPos.y) / 2;
        p1 = { x: uPos.x, y: midY };
        p2 = { x: vPos.x, y: midY };
      } else {
        const dx = vPos.x - uPos.x;
        const dy = vPos.y - uPos.y;
        const dist = Math.hypot(dx, dy) || 1;
        const ux = uPos.x === 0 && uPos.y === 0 ? dx / dist : uPos.x / (Math.hypot(uPos.x, uPos.y) || 1);
        const uy = uPos.x === 0 && uPos.y === 0 ? dy / dist : uPos.y / (Math.hypot(uPos.x, uPos.y) || 1);
        p1 = { x: uPos.x + ux * dist * 0.35, y: uPos.y + uy * dist * 0.35 };
        p2 = { x: vPos.x - dx * 0.32, y: vPos.y - dy * 0.32 };
      }

      const sampled = sampleCubicBezier(uPos, p1, p2, vPos, 36);
      const fullPath = subPolylinePath(sampled, 0, 1);
      const conduitGroup = makeSvgEl("g", { class: isDimmed(vId) ? "dimmed" : "" });

      // Outer wall
      conduitGroup.appendChild(makeSvgEl("path", {
        d: fullPath,
        fill: "none",
        stroke: "#8c959f",
        "stroke-width": 8,
        "stroke-linecap": "round"
      }));
      // Hollow channel
      conduitGroup.appendChild(makeSvgEl("path", {
        d: fullPath,
        fill: "none",
        stroke: "#ffffff",
        "stroke-width": 5.5,
        "stroke-linecap": "round"
      }));

      const visStart = 0.16;
      const visEnd = 0.84;
      let activeRatio = v.progress;
      if (v.isPostBaselineDeepened) {
        activeRatio = 0.30 + 0.70 * v.progress;
      }
      const fillFrac = visStart + activeRatio * (visEnd - visStart);
      const fillColor = v.isBaselineDone ? "#4ac26b" : "#d4a72c";
      const barColor = v.isBaselineDone ? "#116329" : "#7d4e00";

      if (activeRatio > 0.01) {
        const fillPath = subPolylinePath(sampled, 0, fillFrac);
        conduitGroup.appendChild(makeSvgEl("path", {
          d: fillPath,
          fill: "none",
          stroke: fillColor,
          "stroke-width": 4.2,
          "stroke-linecap": "butt"
        }));
      }

      // Achievement Crossbar
      const pt = pointAndTangentAtFraction(sampled, fillFrac);
      const nx = -pt.ty * 7;
      const ny = pt.tx * 7;
      conduitGroup.appendChild(makeSvgEl("line", {
        x1: (pt.x - nx).toFixed(2),
        y1: (pt.y - ny).toFixed(2),
        x2: (pt.x + nx).toFixed(2),
        y2: (pt.y + ny).toFixed(2),
        stroke: barColor,
        "stroke-width": 2.4,
        "stroke-linecap": "square"
      }));

      gConduits.appendChild(conduitGroup);
    }

    /* 2) Prerequisite Arrows (Clean curves, NO blocking labels covering cards) */
    const targetsToDraw = [];
    if (liveGraph.navigation.MAIN !== liveGraph.navigation.HEAD) {
      targetsToDraw.push({ id: liveGraph.navigation.MAIN, dimmed: true });
    }
    targetsToDraw.push({ id: liveGraph.navigation.HEAD, dimmed: false });

    const seenPairs = new Set();
    for (const { id: targetId, dimmed } of targetsToDraw) {
      const targetNode = liveGraph.nodes.get(targetId);
      if (!targetNode) continue;
      const targetAnchor = findVisibleAnchor(targetId);
      const tPos = targetAnchor.pos;
      if (!tPos) continue;

      targetNode.prereqIds.forEach((pId, idx) => {
        const pairKey = `${pId}->${targetId}`;
        if (seenPairs.has(pairKey)) return;
        seenPairs.add(pairKey);

        const pNode = liveGraph.nodes.get(pId);
        if (!pNode) return;
        const pAnchor = findVisibleAnchor(pId);
        const sPos = pAnchor.pos;
        if (!sPos) return;

        const isDone = pNode.isBaselineDone;
        const dx = tPos.x - sPos.x;
        const dy = tPos.y - sPos.y;
        const dist = Math.hypot(dx, dy) || 1;
        const nx = -dy / dist;
        const ny = dx / dist;

        const curveSign = idx % 2 === 0 ? 1 : -1;
        const curveMag = Math.max(38, Math.min(110, dist * 0.22)) + idx * 12;
        const cx = (sPos.x + tPos.x) / 2 + nx * curveMag * curveSign;
        const cy = (sPos.y + tPos.y) / 2 + ny * curveMag * curveSign;

        const endT = Math.max(0.72, 1 - 42 / dist);
        const ex = (1 - endT) * (1 - endT) * sPos.x + 2 * (1 - endT) * endT * cx + endT * endT * tPos.x;
        const ey = (1 - endT) * (1 - endT) * sPos.y + 2 * (1 - endT) * endT * cy + endT * endT * tPos.y;

        const pathD = `M ${sPos.x.toFixed(1)} ${sPos.y.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
        const strokeColor = dimmed ? "#8c959f" : (isDone ? "#116329" : "#a40e26");
        const markerId = dimmed ? "url(#arrow-dim)" : (isDone ? "url(#arrow-done)" : "url(#arrow-needed)");

        const hitGroup = makeSvgEl("g", {
          class: `prereq-arrow-hit ${dimmed ? "dimmed" : ""}`,
          style: dimmed ? "opacity: 0.45;" : ""
        });
        // Tooltip hint on hover
        const titleEl = makeSvgEl("title");
        titleEl.textContent = `Prerequisite: ${pNode.title} (${isDone ? "Completed" : "Needs Completion"}) — Click to jump`;
        hitGroup.appendChild(titleEl);

        // Invisible wide hit area
        hitGroup.appendChild(makeSvgEl("path", {
          d: pathD,
          fill: "none",
          stroke: "transparent",
          "stroke-width": 16
        }));
        // Visible line
        const arrowAttrs = {
          class: "visible-arrow",
          d: pathD,
          fill: "none",
          stroke: strokeColor,
          "stroke-width": isDone ? 1.9 : 2.4,
          "marker-end": markerId
        };
        if (isDone) arrowAttrs["stroke-dasharray"] = "5,4";
        hitGroup.appendChild(makeSvgEl("path", arrowAttrs));

        hitGroup.addEventListener("click", (e) => {
          e.stopPropagation();
          detourTo(pId);
        });
        gPrereqs.appendChild(hitGroup);
      });
    }

    /* 3) Topic Node Cards */
    for (const id of visibleNodeIds) {
      const n = liveGraph.nodes.get(id);
      const pos = layoutPositions.get(id);
      if (!n || !pos) continue;

      const isMain = id === liveGraph.navigation.MAIN;
      const isHead = id === liveGraph.navigation.HEAD;
      const nodeG = makeSvgEl("g", {
        class: `svg-node ${isDimmed(id) ? "dimmed" : ""}`,
        transform: `translate(${pos.x.toFixed(1)}, ${pos.y.toFixed(1)})`
      });

      // Tooltip hint
      const titleHint = makeSvgEl("title");
      titleHint.textContent = `${n.title} — Click to inspect in side panel`;
      nodeG.appendChild(titleHint);

      if (id === "knowledge") {
        // Origin Dot
        nodeG.appendChild(makeSvgEl("circle", {
          cx: 0, cy: 0, r: 28,
          fill: "#ffffff",
          stroke: isHead ? "#8250df" : "#1f2328",
          "stroke-width": isHead ? 2.8 : 2
        }));
        nodeG.appendChild(makeSvgEl("circle", {
          cx: 0, cy: 0, r: 19,
          fill: "#f1f3f5",
          stroke: "#8c959f",
          "stroke-width": 1.2
        }));
        nodeG.appendChild(makeSvgEl("circle", {
          cx: 0, cy: 0, r: 5,
          fill: "#1f2328"
        }));
        const lbl = makeSvgEl("text", {
          x: 0, y: 42,
          "text-anchor": "middle",
          "font-family": "var(--font-mono)",
          "font-size": 11,
          "font-weight": 800,
          fill: "#1f2328"
        });
        lbl.textContent = "KNOWLEDGE";
        nodeG.appendChild(lbl);
      } else {
        const w = 158;
        const h = 44;
        let fill = "#ffffff";
        let stroke = "#8c959f";
        let strokeW = 1.2;
        let dash = null;

        if (n.isStub) {
          fill = "#eaeef2";
          dash = "4,3";
        } else if (n.isBaselineDone) {
          fill = "#f6fff8";
          stroke = "#4ac26b";
        } else if (n.isBlocked) {
          fill = "#fff8f7";
          stroke = "#ff8182";
        } else if (n.progress > 0) {
          fill = "#fffdf0";
          stroke = "#d4a72c";
        }

        // MAIN pulse beacon
        if (isMain) {
          nodeG.appendChild(makeSvgEl("rect", {
            x: -w / 2 - 5,
            y: -h / 2 - 5,
            width: w + 10,
            height: h + 10,
            rx: 6,
            fill: "none",
            stroke: "#0969da",
            "stroke-width": 2,
            "stroke-dasharray": "4,3"
          }));
          nodeG.appendChild(makeSvgEl("circle", {
            class: "main-beacon-pulse",
            cx: -w / 2 + 8,
            cy: -h / 2 - 10,
            r: 10,
            fill: "none",
            stroke: "#0969da",
            "stroke-width": 1.8
          }));
        }

        // HEAD reticle
        if (isHead) {
          nodeG.appendChild(makeSvgEl("rect", {
            x: -w / 2 - 3,
            y: -h / 2 - 3,
            width: w + 6,
            height: h + 6,
            rx: 5,
            fill: "none",
            stroke: "#8250df",
            "stroke-width": 2.2
          }));
        }

        const cardAttrs = {
          class: "node-card",
          x: -w / 2,
          y: -h / 2,
          width: w,
          height: h,
          rx: 4,
          fill,
          stroke,
          "stroke-width": strokeW
        };
        if (dash) cardAttrs["stroke-dasharray"] = dash;
        nodeG.appendChild(makeSvgEl("rect", cardAttrs));

        // Status accent line
        const statusBarColor = n.isStub ? "#57606a"
          : n.isBaselineDone ? "#4ac26b"
          : n.isBlocked ? "#ff8182"
          : n.progress > 0 ? "#d4a72c"
          : "#d0d7de";
        nodeG.appendChild(makeSvgEl("rect", {
          x: -w / 2,
          y: -h / 2,
          width: 4.5,
          height: h,
          rx: 1,
          fill: statusBarColor
        }));

        // Title text
        const titleStr = n.title.length > 21 ? n.title.slice(0, 20) + "…" : n.title;
        const txt = makeSvgEl("text", {
          x: -w / 2 + 10,
          y: -3,
          "font-family": "var(--font-mono)",
          "font-size": 10.5,
          "font-weight": 700,
          fill: n.isStub ? "#57606a" : "#1f2328"
        });
        txt.textContent = titleStr;
        nodeG.appendChild(txt);

        // Subtitle (Clear, readable status without cryptic flags)
        const pct = Math.round(n.progress * 100);
        const statusLabel = n.isStub ? "Draft"
          : n.isBaselineDone ? "Completed"
          : n.isBlocked ? "Needs Prereqs"
          : n.progress > 0 ? "In Progress"
          : "Ready";
        const subTxt = makeSvgEl("text", {
          x: -w / 2 + 10,
          y: 13,
          "font-family": "var(--font-mono)",
          "font-size": 9,
          "font-weight": 600,
          fill: n.isBaselineDone ? "#116329" : n.isBlocked ? "#a40e26" : "#59636e"
        });
        subTxt.textContent = `${statusLabel} · ${pct}%`;
        nodeG.appendChild(subTxt);

        // Top badges: MAIN / HEAD
        if (isMain || isHead) {
          let bx = -w / 2;
          if (isMain) {
            nodeG.appendChild(makeSvgEl("rect", { x: bx, y: -h / 2 - 17, width: 38, height: 14, rx: 2, fill: "#0969da" }));
            const mt = makeSvgEl("text", { x: bx + 19, y: -h / 2 - 7, "text-anchor": "middle", "font-family": "var(--font-mono)", "font-size": 8.5, "font-weight": 800, fill: "#ffffff" });
            mt.textContent = "MAIN";
            nodeG.appendChild(mt);
            bx += 42;
          }
          if (isHead) {
            nodeG.appendChild(makeSvgEl("rect", { x: bx, y: -h / 2 - 17, width: 38, height: 14, rx: 2, fill: "#8250df" }));
            const ht = makeSvgEl("text", { x: bx + 19, y: -h / 2 - 7, "text-anchor": "middle", "font-family": "var(--font-mono)", "font-size": 8.5, "font-weight": 800, fill: "#ffffff" });
            ht.textContent = "HEAD";
            nodeG.appendChild(ht);
          }
        }

        // Expand / Collapse Badge (+N / -)
        if (n.childrenIds.length > 0) {
          const isExp = n.state.expandedOnMap;
          const badgeText = isExp ? "−" : `+${n.childrenIds.length}`;
          const bw = isExp ? 18 : Math.max(22, badgeText.length * 6.5 + 8);
          const bg = makeSvgEl("g", { class: "svg-expand-badge" });
          bg.appendChild(makeSvgEl("rect", {
            x: w / 2 - bw - 4,
            y: h / 2 - 10,
            width: bw,
            height: 16,
            rx: 3,
            fill: "#f1f3f5",
            stroke: "#8c959f",
            "stroke-width": 1
          }));
          const bt = makeSvgEl("text", {
            x: w / 2 - bw / 2 - 4,
            y: h / 2 + 1.5,
            "text-anchor": "middle",
            "font-family": "var(--font-mono)",
            "font-size": 9,
            "font-weight": 800,
            fill: "#1f2328"
          });
          bt.textContent = badgeText;
          bg.appendChild(bt);
          bg.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleNodeExpansion(id);
          });
          nodeG.appendChild(bg);
        }
      }

      nodeG.addEventListener("click", (e) => {
        e.stopPropagation();
        selectNodeFromMap(id);
      });

      gNodes.appendChild(nodeG);
    }
  }

  /* Minimap Rendering */
  let minimapBounds = { minX: -400, maxX: 400, minY: -300, maxY: 300 };

  function renderMinimap() {
    const svg = document.getElementById("minimapSvg");
    svg.innerHTML = "";
    let minX = -200, maxX = 200, minY = -160, maxY = 160;
    for (const p of layoutPositions.values()) {
      minX = Math.min(minX, p.x - 90);
      maxX = Math.max(maxX, p.x + 90);
      minY = Math.min(minY, p.y - 70);
      maxY = Math.max(maxY, p.y + 70);
    }
    minimapBounds = { minX, maxX, minY, maxY };
    const vw = Math.max(100, maxX - minX);
    const vh = Math.max(100, maxY - minY);
    svg.setAttribute("viewBox", `${minX.toFixed(1)} ${minY.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`);

    for (const id of visibleNodeIds) {
      if (id === "knowledge") continue;
      const n = liveGraph.nodes.get(id);
      const u = layoutPositions.get(n.parentId);
      const v = layoutPositions.get(id);
      if (!u || !v) continue;
      svg.appendChild(makeSvgEl("line", {
        x1: u.x, y1: u.y, x2: v.x, y2: v.y,
        stroke: n.isBaselineDone ? "#4ac26b" : "#8c959f",
        "stroke-width": Math.max(1.8, vw * 0.0035)
      }));
    }

    const dotR = Math.max(4.5, vw * 0.01);
    for (const id of visibleNodeIds) {
      const p = layoutPositions.get(id);
      if (!p) continue;
      const isMain = id === liveGraph.navigation.MAIN;
      const isHead = id === liveGraph.navigation.HEAD;
      svg.appendChild(makeSvgEl("circle", {
        cx: p.x, cy: p.y,
        r: isMain || isHead ? dotR * 1.5 : dotR,
        fill: isMain ? "#0969da" : isHead ? "#8250df" : (id === "knowledge" ? "#1f2328" : "#59636e")
      }));
    }

    const vpRect = makeSvgEl("rect", {
      id: "minimapViewportRect",
      fill: "rgba(9, 105, 218, 0.12)",
      stroke: "#0969da",
      "stroke-width": Math.max(2, vw * 0.005)
    });
    svg.appendChild(vpRect);
    updateMinimapViewport();
  }

  function updateMinimapViewport() {
    const vp = document.getElementById("minimapViewportRect");
    if (!vp) return;
    const canvas = document.getElementById("canvasPane");
    const cw = canvas.clientWidth || 800;
    const ch = canvas.clientHeight || 600;
    const worldLeft = (-cw / 2 - camera.x) / camera.k;
    const worldTop = (-ch / 2 - camera.y) / camera.k;
    const worldW = cw / camera.k;
    const worldH = ch / camera.k;
    vp.setAttribute("x", worldLeft.toFixed(1));
    vp.setAttribute("y", worldTop.toFixed(1));
    vp.setAttribute("width", worldW.toFixed(1));
    vp.setAttribute("height", worldH.toFixed(1));
  }

  /* =========================================================================
   * 6. NAVIGATION ACTIONS (MAIN, HEAD, DETOUR STACK)
   * ========================================================================= */
  function selectNodeFromMap(id) {
    const node = liveGraph.nodes.get(id);
    if (!node) return;
    layer2State.navigation.HEAD = id;
    layer2State.navigation.detourStack = [];
    if (id !== "knowledge" && (node.childrenIds.length > 0 || node.sources.length > 0)) {
      ensureNodeState(id).expandedOnMap = !ensureNodeState(id).expandedOnMap;
    }
    persistAll();
    renderAll();
  }

  function toggleNodeExpansion(id) {
    const st = ensureNodeState(id);
    st.expandedOnMap = !st.expandedOnMap;
    persistAll();
    renderAll();
  }

  function detourTo(prereqId) {
    if (!liveGraph.nodes.has(prereqId)) return;
    const oldHead = liveGraph.navigation.HEAD;
    if (oldHead && oldHead !== prereqId) {
      layer2State.navigation.detourStack.push(oldHead);
    }
    layer2State.navigation.HEAD = prereqId;
    persistAll();
    ensureAncestorsExpanded(prereqId);
    renderAll();
    locateNode(prereqId, 0.96);
  }

  function popDetour() {
    const stack = layer2State.navigation.detourStack;
    if (!stack || stack.length === 0) return;
    const restored = stack.pop();
    layer2State.navigation.HEAD = restored;
    persistAll();
    ensureAncestorsExpanded(restored);
    renderAll();
    locateNode(restored, 0.96);
  }

  function jumpToDetourFrame(index) {
    const stack = layer2State.navigation.detourStack;
    if (index < 0 || index >= stack.length) return;
    const target = stack[index];
    layer2State.navigation.detourStack = stack.slice(0, index);
    layer2State.navigation.HEAD = target;
    persistAll();
    ensureAncestorsExpanded(target);
    renderAll();
    locateNode(target, 0.96);
  }

  function setHeadAsMain() {
    layer2State.navigation.MAIN = layer2State.navigation.HEAD;
    layer2State.navigation.detourStack = [];
    persistAll();
    renderAll();
    showToast("Main study target anchored to current topic.");
  }

  function ensureNodeState(id) {
    if (!layer2State.nodes[id]) {
      layer2State.nodes[id] = {
        introDone: false,
        baselineDone: false,
        completedSourceIds: [],
        expandedOnMap: false
      };
    }
    return layer2State.nodes[id];
  }

  /* =========================================================================
   * 7. FULLY EDITABLE SIDE PANEL WITH HINTS & SIMPLIFIED LABELS
   * ========================================================================= */
  let isEditingTopicDetails = false;
  let editingSourceId = null;
  let editingSubtopicId = null;
  let prereqSearchQuery = "";
  let lastPrereqCycleDiag = "";

  function renderSidePanel() {
    const side = document.getElementById("sidePane");
    const headId = liveGraph.navigation.HEAD;
    const node = liveGraph.nodes.get(headId);
    if (!node) {
      side.innerHTML = `<div class="box">Topic not found.</div>`;
      return;
    }

    const isMain = headId === liveGraph.navigation.MAIN;
    const stack = liveGraph.navigation.detourStack;
    const pct = Math.round(node.progress * 100);

    let html = "";

    /* Top Detour Call-Stack */
    if (stack.length > 0) {
      const chainIds = [...stack, headId];
      const chainHtml = chainIds.map((id, idx) => {
        const n = liveGraph.nodes.get(id);
        const title = escapeHtml(n ? n.title : id);
        if (idx === chainIds.length - 1) {
          return `<span class="detour-current">${title}</span>`;
        }
        return `<span class="detour-link" data-detour-idx="${idx}" title="Jump back to this topic">${title}</span>`;
      }).join(` <span>→</span> `);

      html += `
        <details open class="audit-drawer detour-drawer">
          <summary>
            <span>DETOUR HISTORY (${stack.length} steps deep)</span>
            <button type="button" class="btn-xs head-btn" id="btnSideGetBack" title="Return to previous topic">← Back</button>
          </summary>
          <div class="detour-chain">${chainHtml}</div>
        </details>
      `;
    }

    /* Topic Header */
    const statusTag = node.isStub
      ? `<span class="tag draft" title="Draft topic placeholder">Draft</span>`
      : node.isBaselineDone
        ? `<span class="tag done" title="Topic mastered">Completed</span>`
        : node.isBlocked
          ? `<span class="tag needed" title="Unmet prerequisites required first">Needs Prereqs</span>`
          : `<span class="tag active" title="Currently active in your curriculum">In Progress</span>`;
    const overrideTag = liveGraph.overriddenIds.has(headId) ? `<span class="tag edited" title="Modified via UI">Edited</span>` : "";

    html += `
      <div class="box">
        <div class="topic-breadcrumb" title="Directory path in knowledge graph">${escapeHtml(formatTruncatedDirectory(headId, liveGraph.nodes))}</div>
        <div class="topic-title-row">
          <div>
            <div class="topic-title">${escapeHtml(node.title)}</div>
            <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:2px;">id: ${escapeHtml(node.id)}</div>
          </div>
          <div class="list-row-actions">
            <button type="button" class="btn-xs" id="btnToggleEditTopic" title="Edit title, category, or overview notes">${isEditingTopicDetails ? "Cancel" : "✏️ Edit Topic"}</button>
          </div>
        </div>

        <div class="topic-meta-bar">
          ${statusTag}
          ${overrideTag}
          <span class="tag" title="Overall progress">${pct}% Complete</span>
          ${isMain
            ? `<span class="tag" style="background:var(--accent-soft);color:var(--accent);border-color:var(--accent);" title="Currently your main objective on the map">Main Target ✓</span>`
            : `<button type="button" class="btn-xs accent-btn" id="btnSetAsMain" title="Set this topic as your primary target beacon on the map">Set as Main Target</button>`
          }
        </div>

        <div class="progress-track" title="Topic completion progress">
          <div class="progress-fill ${node.isBaselineDone ? "done" : ""}" style="width:${pct}%"></div>
        </div>

        ${isEditingTopicDetails ? renderTopicEditor(node) : ""}
      </div>
    `;

    /* Section 1: Prerequisites */
    const allPrereqsDone = node.prereqIds.every(pId => {
      const p = liveGraph.nodes.get(pId);
      return p && p.isBaselineDone;
    });
    const prereqStatusBadge = node.prereqIds.length === 0
      ? `<span class="tag done">None Required</span>`
      : allPrereqsDone
        ? `<span class="tag done">All Completed ✓</span>`

    const prereqRows = node.prereqIds.length === 0
      ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">No prerequisites required. You can start studying this immediately!</div>`
      : node.prereqIds.map(pId => {
          const p = liveGraph.nodes.get(pId);
          if (!p) return "";
          const badge = p.isBaselineDone
            ? `<span class="tag done">✓ Completed</span>`
            : `<span class="tag needed">✕ Needed</span>`;
          return `
            <div class="list-row">
              <div class="list-row-left">
                ${badge}
                <div class="list-row-main">
                  <div class="list-row-title">${escapeHtml(p.title)} ${p.isStub ? '<span class="tag draft">Draft</span>' : ''}</div>
                  <div class="list-row-sub">${escapeHtml(formatTruncatedDirectory(pId, liveGraph.nodes))}</div>
                </div>
              </div>
              <div class="list-row-actions">
                <button type="button" class="btn-xs head-btn" data-detour-id="${escapeHtml(pId)}" title="Jump to this prerequisite">Detour →</button>

              </div>

        }).join("");

    const candidatePrereqs = [...liveGraph.nodes.values()]
      .filter(n => n.id !== headId && n.id !== "knowledge" && !node.prereqIds.includes(n.id))
      .filter(n => !prereqSearchQuery || n.title.toLowerCase().includes(prereqSearchQuery.toLowerCase()) || n.id.toLowerCase().includes(prereqSearchQuery.toLowerCase()))
      .slice(0, 40);

    html += `
      <div class="box">
        <div class="box-header">
          <span class="box-title">Prerequisites</span>
          ${prereqStatusBadge}
        </div>
        <div class="section-hint">Concepts you should understand before this topic. Click <strong>Detour →</strong> to inspect or study any prerequisite.</div>
        <div class="item-list">${prereqRows}</div>
        <div class="inline-add-row">
          <input type="text" id="inputPrereqSearch" placeholder="Filter topics to link..." value="${escapeHtml(prereqSearchQuery)}" style="flex:1 1 110px;" title="Filter topics">

            <option value="">-- Choose prerequisite --</option>
            ${candidatePrereqs.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.title)} (${escapeHtml(c.id)})</option>`).join("")}
